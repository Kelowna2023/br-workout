<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BR">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==================== BR · Studio ==================== */
:root{
  --bg:#09090a; --card:#141416; --card2:#1c1c1f; --line:#232327; --line2:#2e2e33;
  --text:#f4f2ee; --dim:#8d8c92; --dim2:#5d5c62; --acc:#9d6bff; --acc2:#6c4dff; --acc-soft:rgba(157,107,255,.14); --acc-text:#c9b4ff;
  --grad:linear-gradient(135deg,#ad85ff 0%,#7a55ff 55%,#6347ff 100%);
  --red:#ff6b6b; --green:#7fe0ae;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",Arial,sans-serif;
  --r-card:20px; --r-box:12px; --r-btn:16px;
  --g:16px;
  /* old names still used inside the app's markup */
  --plate:var(--acc); --chalk:var(--text); --dust:var(--dim); --ink:#0b0b0c; --knurl:var(--line); --iron:var(--bg); --danger:var(--red);
  --poster:var(--font); --display:var(--font); --mono:var(--font); --body:var(--font);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--text);font:400 15px/1.4 var(--font);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
input,textarea{-webkit-user-select:text;user-select:text}
a{color:inherit;text-decoration:none}
.vh,.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num,.si,.box,.ringn,.xc,b{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header.top,#aura,#grain,#restgo,.xbig,.pickbig,.morphg{display:none!important}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 14px) var(--g) 32px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;overscroll-behavior-x:none}
main>*{flex:none}

/* type */
.lt,.pick-h,.xn,.fs-h{margin:0;font:700 32px/1.06 var(--font)!important;letter-spacing:-.035em!important;text-transform:none!important;color:var(--text)}
h2{margin:10px 0 0;font:700 20px/1.2 var(--font);letter-spacing:-.025em}
h3{margin:0}
.cap,.mono,.eyebrow,.sec{font:500 13px/1.35 var(--font);letter-spacing:-.005em;text-transform:none;color:var(--dim)}
.sec{margin-top:10px;font-weight:600;color:var(--text);font-size:15px}
.meta{font:400 13px/1.4 var(--font);color:var(--dim)}
.meta.acc,.acc{color:var(--acc-text)}
.muted{color:var(--dim);font-size:14px}
.empty{color:var(--dim);font-size:14px;line-height:1.5;padding:16px;border:1px dashed var(--line2);border-radius:var(--r-card)}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--text);text-align:left;width:100%}
button.card{transition:transform .18s ease,background .18s ease}
button.card:active{transform:scale(.98);background:var(--card2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc-text);font:600 12px/1 var(--font);letter-spacing:0}
.chip.dim{background:var(--card2);color:var(--dim)}
.chip.sug{background:rgba(127,224,174,.12);color:var(--green)}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:var(--grad);color:#fff;font:700 11px/1 var(--font)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 18px;border:1px solid var(--line2);border-radius:var(--r-btn);background:var(--card);color:var(--text);font:600 15px/1 var(--font);text-transform:none;letter-spacing:-.01em;transition:transform .15s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--grad);border:0;color:#fff;min-height:56px;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(110,80,255,.32)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;font-size:14px;padding:0 14px}
.btn.danger,.danger{color:var(--red)!important}
.btn.grow,.grow{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.links{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 2px;font:500 14px/1 var(--font)}
.links a,.links button{background:none;border:0;padding:12px 0;color:var(--acc-text);font:inherit}
.links .danger{color:var(--red)}
.back{align-self:flex-start;background:none;border:0;padding:6px 0;margin:-6px 0 -2px;color:var(--acc-text);font:500 15px/1 var(--font)!important;letter-spacing:-.01em!important;text-transform:none!important}
.iconbtn{background:none;border:0;color:var(--dim2);font-size:20px;min-width:36px;min-height:36px}
.more{background:var(--card2);border:0;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--dim);flex:none}
.more svg{width:18px;height:18px}
.field{width:100%;min-height:46px;padding:0 14px;border:1px solid var(--line2);border-radius:var(--r-box);background:var(--card2);color:var(--text);font:500 16px/1 var(--font)}
textarea.field{min-height:72px;padding:12px 14px;line-height:1.4;resize:none}
.field:focus{outline:0;border-color:var(--acc)}
select.field{-webkit-appearance:none;appearance:none}
label.eyebrow{display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:transparent;color:var(--dim);font:600 13px/1 var(--font)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.06)}

/* home */
.hm-top{display:flex;align-items:center;justify-content:space-between}
.hm-br{width:38px;height:38px;border-radius:12px;border:0;background:var(--grad);color:#fff;font:800 13px/1 var(--font);letter-spacing:.02em;box-shadow:0 6px 18px rgba(110,80,255,.35)}
.wkc{flex-direction:row;align-items:center;gap:16px;padding:18px}
.ringw{position:relative;width:68px;height:68px;flex:none}
.ring{width:68px;height:68px}
.ring circle{fill:none;stroke-width:7}
.ring .rt0{stroke:var(--line2)}
.ring .rt1{stroke:url(#rg);stroke-linecap:round}
.ringn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1px;font:700 18px/1 var(--font)}
.ringn small{font-size:12px;color:var(--dim);font-weight:600}
.ct{font:700 17px/1.2 var(--font);letter-spacing:-.02em}
.wlist,.xlist{display:flex;flex-direction:column;gap:10px}
.wr{gap:8px}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wn{font:700 19px/1.15 var(--font);letter-spacing:-.025em;color:var(--text)}
.chev{color:var(--dim2);font-size:24px;line-height:1}

/* workout */
.pbar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:6px;background:var(--grad);transform-origin:left;transition:width .5s ease}
.tr{flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
.xnum{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--dim);font:700 14px/1 var(--font)}
.tr.fin .xnum{background:var(--grad);color:#fff}
.xm{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font:600 16px/1.2 var(--font);letter-spacing:-.02em;color:var(--text)}
.tr.fin .nm{color:var(--dim)}
.xc{flex:none;font:600 14px/1 var(--font);color:var(--dim)}

/* exercise */
.ex-top{display:flex;align-items:center;justify-content:space-between}
.exb{display:flex;flex-direction:column;gap:12px}
.xh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.setc{padding:6px 12px 4px;gap:0}
.sr{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr) 34px 40px 26px;gap:8px;align-items:center;padding:7px 0}
.sr.hdr{padding:8px 0 2px;font:600 11px/1 var(--font);color:var(--dim2);text-transform:uppercase;letter-spacing:.06em}
.sr.hdr span:nth-child(2),.sr.hdr span:nth-child(3){text-align:center}
.sn{font:600 14px/1 var(--font);color:var(--dim2);text-align:center}
.si{width:100%;min-width:0;height:48px;margin:0;padding:0;border:0;border-radius:var(--r-box);background:var(--card2);color:var(--text);text-align:center;font:700 21px/1 var(--font);letter-spacing:-.02em;-webkit-appearance:none;appearance:none;transition:box-shadow .15s}
.si::placeholder{color:var(--dim2);font-weight:600;font-size:16px}
.si:focus{outline:0;box-shadow:inset 0 0 0 2px var(--acc)}
.sr.cur .si{box-shadow:inset 0 0 0 1.5px rgba(157,107,255,.55)}
.sr.cur .si:focus{box-shadow:inset 0 0 0 2px var(--acc)}
.sr.done .si{background:transparent;color:var(--dim)}
.nt{height:44px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--dim2);font:600 9px/1 var(--font)}
.nt svg{width:17px;height:17px}
.nt.has{color:var(--acc-text)}
.ck{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);background:transparent;color:var(--dim2);display:grid;place-items:center;padding:0}
.ck svg{width:18px;height:18px}
.sr.cur .ck{border-color:var(--acc);color:var(--acc-text)}
.sr.done .ck{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(110,80,255,.4)}
.sx{width:26px;height:36px;border:0;background:none;color:var(--dim2);padding:0;font-size:18px;line-height:1}
.setfoot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px}
.setfoot button{background:none;border:0;padding:14px 4px;color:var(--acc-text);font:600 14px/1 var(--font)}
.setnote{padding:4px 0 10px 26px;display:flex;flex-direction:column;gap:8px}
.rir{display:flex;gap:6px}
.rir button{flex:1;min-height:36px;border:0;border-radius:10px;background:var(--card2);color:var(--dim);font:600 12px/1 var(--font)}
.rir button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-text)}
.rir-l{margin:-4px 0 6px 26px;font:600 12px/1 var(--font);color:var(--acc-text)}
.ss2{color:var(--acc-text)}
.restc{position:relative;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 14px 14px 18px;overflow:hidden}
.restc>span:not(.rbtn){display:flex;flex-direction:column;gap:2px}
.restc b{font:700 30px/1 var(--font);letter-spacing:-.03em}
.restc .rbtn{width:52px;height:52px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(110,80,255,.4);flex:none}
.restc .rbtn svg{width:20px;height:20px;fill:currentColor}
.restc.ready{border-color:rgba(157,107,255,.5);box-shadow:0 0 0 4px rgba(157,107,255,.08)}
.restc.ready .rbtn::after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid var(--acc);animation:ripple 1.6s ease-out infinite}
@keyframes ripple{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.restc.run b{color:var(--acc-text)}
.restc.run .rbtn{background:var(--card2);box-shadow:none;color:var(--acc-text)}
.restc .t-bar{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0) * 100%);background:var(--grad)}
.nextb{justify-content:space-between}
.nextb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* bottom tabs */
.tabs{order:9;display:flex;justify-content:space-around;align-items:flex-start;padding:8px 6px calc(env(safe-area-inset-bottom) + 6px);border-top:1px solid var(--line);background:rgba(9,9,10,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);flex:none}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font:600 10.5px/1 var(--font);color:var(--dim2);letter-spacing:0;text-transform:none}
.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a[aria-current="page"]{color:var(--acc-text)}
#tab-routines{display:none!important}

/* rest dock (when you leave the exercise mid-rest) */
#rest{order:8;margin:0 var(--g) 10px;padding:12px 12px 12px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;overflow:hidden;flex:none}
#rest .r1{display:flex;align-items:center;gap:8px}
#rest .lab{font:500 12px/1 var(--font);color:var(--dim)}
#rest .time{font:700 22px/1.1 var(--font);color:var(--acc-text)}
#rest button{min-height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--card2);color:var(--text);font:600 13px/1 var(--font)}
#rest .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
#rest .bar i{display:block;height:100%;background:var(--grad)}
#rest.go .time{color:var(--green)}

/* rest, full screen */
#restfull{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px);overflow:hidden}
#restfull::before{content:"";position:absolute;left:50%;top:38%;width:560px;height:560px;margin:-280px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,90,255,.28),rgba(124,90,255,0));pointer-events:none;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
#restfull>*{position:relative}
#restfull .rtop{display:flex;justify-content:center;gap:8px;font:600 15px/1 var(--font);color:var(--dim)}
#rf-time{font:700 clamp(110px,34vw,170px)/1 var(--font);letter-spacing:-.05em;text-align:center;color:var(--text)}
#restfull .rtrack{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin:6px 0 18px}
#restfull .rtrack i{display:block;height:100%;background:var(--grad);border-radius:6px}
#restfull .rbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#restfull .rbtns button{min-height:54px;border:1px solid var(--line2);border-radius:var(--r-btn);background:var(--card);color:var(--text);font:600 16px/1 var(--font)}
#restfull .rbtns button:last-child{grid-column:1/-1;background:var(--grad);border:0;color:#fff;font-weight:700}
#rf-next{text-align:center;padding-top:16px;color:var(--dim);font:500 14px/1.4 var(--font)}
#rf-next b{display:block;color:var(--text);font:700 18px/1.3 var(--font);margin-top:4px}
.rmin{align-self:center;background:none;border:0;color:var(--acc-text);font:600 15px/1 var(--font)!important;padding:12px}
#restfull.late::before{animation-duration:1.1s;background:radial-gradient(closest-side,rgba(124,90,255,.5),rgba(124,90,255,0))}
#restfull.late #rf-time{color:var(--acc-text)}
#rf-time.beat{animation:beat .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes beat{0%{transform:scale(1.18);opacity:.6}100%{transform:none;opacity:1}}
#restfull.go #rf-time{color:var(--green)}
#restfull.go::after{content:"";position:absolute;left:50%;top:38%;width:40px;height:40px;margin:-20px;border-radius:50%;background:rgba(124,90,255,.85);pointer-events:none;animation:flare 1.2s cubic-bezier(.2,.9,.3,1) both}
@keyframes flare{0%{transform:scale(0);opacity:1}100%{transform:scale(36);opacity:0}}
#restfull:not([hidden]){animation:rfin .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rfin{from{opacity:0;transform:translateY(24px)}}

/* sheets */
#sheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .25s ease both}
@keyframes fadein{from{opacity:0}}
#sheet .panel{width:100%;max-height:90%;overflow-y:auto;background:#121214;border-top:1px solid var(--line2);border-radius:26px 26px 0 0;padding:10px var(--g) calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:14px;animation:sheetup .38s cubic-bezier(.2,.9,.3,1) both}
#sheet .panel::before{content:"";align-self:center;width:38px;height:5px;border-radius:5px;background:var(--line2);margin-bottom:4px}
@keyframes sheetup{from{transform:translateY(100%)}}
#sheet h2{margin:0}
#toast{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 84px);z-index:80;display:flex;justify-content:center;pointer-events:none}
#toast div{background:#232327;color:var(--text);padding:12px 18px;border-radius:14px;font:600 14px/1.2 var(--font);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rfin .3s ease both}

/* wheel + quick picks + stack + gear */
.tpre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tpre button{min-height:44px;border:0;border-radius:12px;background:var(--card2);color:var(--text);font:700 15px/1 var(--font)}
.tpre button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-text);box-shadow:inset 0 0 0 1.5px var(--acc)}
.whl{display:grid;grid-template-columns:1fr 18px 1fr;text-align:center;font:600 12px/1 var(--font);color:var(--dim2);margin-bottom:-6px}
.whs{position:relative;display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;height:220px}
.whs::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--card2);pointer-events:none}
.wh{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:88px 0;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wh::-webkit-scrollbar{display:none}
.wh div{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font:600 24px/1 var(--font);color:var(--dim2);transition:color .15s,transform .15s}
.wh div.sel{color:var(--text);transform:scale(1.1)}
.whc{position:relative;text-align:center;font:700 24px/1 var(--font);color:var(--acc-text)}
.stk-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.stk-w{font:700 48px/1 var(--font);letter-spacing:-.04em;margin-top:6px}
.stk-w small{font:600 15px/1 var(--font);color:var(--dim)}
.stk-pin{color:var(--acc-text);padding-bottom:6px}
.stk-g{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stk-t{height:52px;border:0;border-radius:12px;background:var(--card2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.stk-t b{font:700 16px/1 var(--font)}
.stk-t span{font:600 10px/1 var(--font);color:var(--dim2)}
.stk-t[aria-pressed="true"]{background:var(--grad);color:#fff}
.stk-t[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.stk-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gearsw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gearsw button{min-height:42px;border:0;border-radius:10px;background:var(--card2);color:var(--dim);font:600 13px/1 var(--font)}
.gearsw button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc-text);box-shadow:inset 0 0 0 1.5px var(--acc)}

/* plates */
.big{font:700 44px/1 var(--font);letter-spacing:-.04em}
.plbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plbtns .btn{min-height:46px;gap:8px}
.dot{width:10px;height:10px;border-radius:50%}
#pl-draw{display:flex;justify-content:center;padding:6px 0}
.bar-draw{display:flex;align-items:center;gap:2px;max-width:100%;overflow:hidden}
.pl{display:grid;place-items:center;background:var(--c);border-radius:3px;color:rgba(0,0,0,.6);font:700 8px/1 var(--font);writing-mode:vertical-rl}
.sleeve{width:22px;height:10px;background:#3a3a40;border-radius:2px}
.collar{width:6px;height:22px;background:#55545a;border-radius:2px}
.shaft{width:60px;height:6px;background:#47464c}

/* history */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.cal-h button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card2);color:var(--text);font-size:16px}
.cal-h button:disabled{opacity:.3}
.cal-t{display:flex;flex-direction:column;align-items:center;gap:4px}
.cal-t b{font:700 17px/1 var(--font);color:var(--text)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 12px}
.cal span{text-align:center;font:600 11px/1 var(--font);color:var(--dim2);padding-bottom:6px}
.cal b{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font:600 14px/1 var(--font);color:var(--dim)}
.cal b.td{box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--text)}
.cal b.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(110,80,255,.35)}
.list{display:flex;flex-direction:column;gap:10px}
details.card{padding:0;gap:0}
details.card>summary{list-style:none;padding:16px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{border-bottom:1px solid var(--line)}
details.card>*:not(summary){margin:0 16px}
details.card>*:not(summary):first-of-type{margin-top:14px}
details.card>*:last-child{margin-bottom:16px}
.hs .eyebrow{font-size:12px}
.hs b{display:block;font:700 17px/1.25 var(--font);letter-spacing:-.02em;margin:4px 0}
.hs .meta{display:flex;flex-wrap:wrap;gap:4px 12px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:var(--acc-soft);color:var(--acc-text);font:700 11px/1 var(--font)}
.lines{display:flex;flex-direction:column;gap:8px;font-size:14px}
.lines>div{display:flex;justify-content:space-between;gap:12px}
.lines>div span:last-child{color:var(--dim);text-align:right}
.notebox{font-size:13px;color:var(--dim);background:var(--card2);border-radius:10px;padding:8px 10px}

/* progress */
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cells span{display:flex;flex-direction:column-reverse;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;font:500 12px/1.2 var(--font);color:var(--dim)}
.cells b{font:700 24px/1 var(--font);color:var(--text);letter-spacing:-.03em}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip div{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.strip b{font:700 20px/1 var(--font)}
.strip span{font:500 12px/1.2 var(--font);color:var(--dim)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:14px}
.chart svg{width:100%;height:auto;display:block}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px/1 var(--font);color:var(--dim2);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:12px}
td{padding:12px;border-top:1px solid var(--line)}
.r{text-align:right}
.goal .rt{display:flex;align-items:center;gap:12px}
.goal .t{flex:1;display:flex;flex-direction:column;gap:3px}
.goal .t b{font:700 16px/1.2 var(--font)}
.goal .t span{font-size:12px;color:var(--dim)}
.pct{font:700 18px/1 var(--font);color:var(--acc-text)}
.gbar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--grad);border-radius:6px}

/* body */
.pk2{display:flex;flex-direction:column;gap:4px}
.bmap{display:flex;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 8px}
.bmap svg{width:min(80vw,330px)!important;height:auto}
.bmap path.on{filter:drop-shadow(0 0 3px rgba(157,107,255,.8))}
.bg{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:6px 16px 12px}
.bg-r{display:flex;justify-content:space-between;align-items:baseline;width:100%;padding:12px 0 8px;background:none;border:0;color:var(--text);font:600 15px/1 var(--font);text-align:left}
.bg-n{font:700 17px/1 var(--font)}
.bg-n.low{color:var(--red)}
.bg-b{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.bg-b i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.bg-b i.low{background:var(--red)}
.bg-b i.short{background:#4a4950}
.ms{padding:14px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.ms-in{display:flex;align-items:center;justify-content:space-between;gap:16px;font:600 15px/1 var(--font)}
.ms-in .field{width:110px;text-align:right}
.ph-h{display:flex;align-items:baseline;justify-content:space-between}
.addp{background:none;border:0;color:var(--acc-text);font:600 14px/1 var(--font);padding:10px 0;cursor:pointer}
.ph-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-cmp button,.ph-strip button{background:none;border:0;padding:0;color:var(--dim);text-align:left;display:flex;flex-direction:column;gap:6px;font:500 12px/1 var(--font)}
.ph-cmp img,.ph-strip img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:14px}
.ph-strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ph-strip::-webkit-scrollbar{display:none}
.ph-strip button{flex:none;width:28%}
.ph-full{width:100%;max-height:62vh;object-fit:contain;border-radius:16px;background:#000}

/* edit workouts */
.rt{display:flex;align-items:center;gap:12px}
.rt .t{display:flex;flex-direction:column;gap:3px}
.rt .t b{font:700 16px/1.2 var(--font)}
.rt .t span{font-size:12px;color:var(--dim)}
.disc{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-text);font:700 12px/1 var(--font);flex:none}
.exedit{display:grid;grid-template-columns:1fr 36px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.exedit .three{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exedit label{display:flex;flex-direction:column;gap:4px;font:500 12px/1 var(--font);color:var(--dim)}
.lk{grid-column:1/-1;display:flex;align-items:center;gap:8px;font:500 13px/1 var(--font);color:var(--dim)}
.sync,.syncline{display:none}

/* moments */
.moment{position:absolute;inset:0;z-index:70;background:rgba(9,9,10,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px;animation:fadein .4s ease both}
.moment.out{animation:fadeout .5s ease both}
@keyframes fadeout{to{opacity:0}}
.moment .burst{position:absolute;left:50%;top:46%;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(circle,rgba(130,95,255,.9),rgba(130,95,255,0) 70%);animation:burst 1.8s cubic-bezier(.2,.9,.3,1) .1s both}
@keyframes burst{0%{transform:scale(0);opacity:1}100%{transform:scale(12);opacity:.3}}
.moment>*:not(.burst){position:relative}
.mo-n{color:var(--acc-text)!important;font:600 14px/1 var(--font)!important;animation:rfin .6s ease .2s both}
.mo-h{font:800 clamp(56px,18vw,92px)/.95 var(--font);letter-spacing:-.05em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .9s cubic-bezier(.2,1.4,.4,1) .3s both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.mo-v{font:700 28px/1 var(--font);animation:rfin .6s ease .7s both}
.mo-t{margin-top:20px;animation:rfin .6s ease 1.2s both}
#endcard{position:absolute;inset:0;z-index:65;background:var(--bg);overflow-y:auto;animation:fadein .5s ease both}
#endcard.bye{animation:fadeout .5s ease both}
.ec-in{display:flex;flex-direction:column;gap:16px;padding:calc(env(safe-area-inset-top) + 40px) var(--g) calc(env(safe-area-inset-bottom) + 30px)}
.ec-in .brmark{width:72px;margin:0}
.fs-h{font-size:36px!important}
.fs-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fs-st div{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.fs-st b{font:700 26px/1 var(--font);letter-spacing:-.03em}
.fs-r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.fs-r span:last-child{color:var(--dim);white-space:nowrap}
.up{color:var(--green)!important}.dn{color:var(--dim)!important}

/* intro */
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;background:#000;opacity:0}
#wipe i{display:none}
#intro{position:absolute;inset:0;z-index:30;overflow:hidden;display:grid;place-items:center;background:var(--bg);padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
#intro::before{content:"";position:absolute;left:50%;top:40%;width:600px;height:600px;margin:-300px;border-radius:50%;background:radial-gradient(closest-side,rgba(124,90,255,.25),rgba(124,90,255,0));pointer-events:none;animation:breathe 6s ease-in-out infinite}
#intro::after{content:"";position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#intro .bar{display:none}
#intro .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;width:100%}
.brmark{width:min(40vw,160px);height:auto;overflow:visible;margin-bottom:14px}
.brmark .m-p{fill:url(#brg)}
.brmark .m-all{filter:drop-shadow(0 0 18px rgba(124,90,255,.45))}
.m-sh{display:none}
#intro .i-day{font:600 14px/1 var(--font);color:var(--acc-text);letter-spacing:.02em}
#intro .i-line{display:none}
#intro .i-title{font:800 clamp(40px,12vw,64px)/1 var(--font);letter-spacing:-.045em}
#intro .i-sub{display:none}
#intro .btn.go{margin-top:26px;width:min(80vw,320px);min-height:60px;font-size:18px}
@media (prefers-reduced-motion:no-preference){
  #intro::after{animation:i-open .6s ease-out both}
  @keyframes i-open{from{opacity:1}to{opacity:0}}
  .brmark .m-p{animation:m-in 1s cubic-bezier(.19,1,.22,1) both}
  .brmark .m-1{--mx:0px;--my:-30px;animation-delay:.05s}.brmark .m-2{--mx:30px;--my:0px;animation-delay:.12s}.brmark .m-3{--mx:30px;--my:0px;animation-delay:.19s}.brmark .m-4{--mx:0px;--my:30px;animation-delay:.26s}.brmark .m-5{--mx:30px;--my:0px;animation-delay:.33s}.brmark .m-6{--mx:18px;--my:24px;animation-delay:.4s}
  @keyframes m-in{from{opacity:0;transform:translate(var(--mx),var(--my))}to{opacity:1;transform:none}}
  .brmark .m-all{animation:m-lock 1.2s ease-out .75s both}
  @keyframes m-lock{0%{filter:drop-shadow(0 0 0 rgba(124,90,255,0))}30%{filter:drop-shadow(0 0 30px rgba(190,165,255,1))}100%{filter:drop-shadow(0 0 18px rgba(124,90,255,.45))}}
  #intro .i-day{animation:rfin .8s cubic-bezier(.2,.9,.3,1) .7s both}
  #intro .i-title{animation:rfin .9s cubic-bezier(.2,.9,.3,1) .8s both}
  #intro .btn.go{animation:rfin .9s cubic-bezier(.2,.9,.3,1) 1s both}
  #wipe.run{animation:wipe .6s ease-in-out both}
  @keyframes wipe{0%{opacity:0}45%{opacity:1}55%{opacity:1}100%{opacity:0}}
}
#intro.quick *,#intro.quick::after{animation:none!important}

/* logging feedback */
.sr.just .ck{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== Studio, alive: bold display type, moving light, electric edges ===== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--disp:Anton,"Arial Narrow",Impact,sans-serif}
#app{padding-top:env(safe-area-inset-top)}
main{padding-top:14px}
#app::before,#app::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0;will-change:transform}
#app::before{width:560px;height:560px;left:-220px;top:-200px;background:radial-gradient(closest-side,rgba(150,100,255,.46),rgba(150,100,255,0));animation:drift1 13s ease-in-out infinite}
#app::after{width:520px;height:520px;right:-240px;bottom:-120px;background:radial-gradient(closest-side,rgba(90,80,255,.34),rgba(90,80,255,0));animation:drift2 17s ease-in-out infinite}
#app:has(main[data-v="history"])::before{background:radial-gradient(closest-side,rgba(100,110,255,.46),rgba(100,110,255,0))}
#app:has(main[data-v="progress"])::before{background:radial-gradient(closest-side,rgba(200,90,255,.42),rgba(200,90,255,0))}
#app:has(main[data-v="body"])::before{background:radial-gradient(closest-side,rgba(225,95,235,.4),rgba(225,95,235,0))}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(190px,90px) scale(1.2)}66%{transform:translate(60px,260px) scale(.9)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(-200px,-220px) scale(1.25)}70%{transform:translate(-60px,-420px) scale(.95)}}
main,.tabs,#rest{position:relative;z-index:1}
.card,.cal,.bmap,.bg,.chart,.tablewrap,.cells span,.strip div,.fs-st div{background:rgba(20,20,24,.74)}
/* type */
.lt,.pick-h,.xn,.fs-h{font:400 42px/.98 var(--disp)!important;letter-spacing:.01em!important;text-transform:uppercase!important;text-shadow:0 0 34px rgba(157,107,255,.5)}
.xn{font-size:38px!important}
h2{font:400 24px/1.1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.wn{font:400 25px/1.05 var(--disp);letter-spacing:.015em;text-transform:uppercase}
.nm{font:400 19px/1.1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.ct,.hs b,.rt .t b,.goal .t b,.cal-t b{font-family:var(--disp)!important;font-weight:400!important;text-transform:uppercase;letter-spacing:.02em}
.ct{font-size:21px}.cal-t b{font-size:22px}
.si{font:400 27px/1 var(--disp)}
.ringn{font:400 23px/1 var(--disp)}.ringn small{font:400 14px/1 var(--disp)}
.restc b{font:400 38px/1 var(--disp);letter-spacing:.01em}
#rf-time{font:400 clamp(130px,42vw,200px)/1 var(--disp);letter-spacing:0;text-shadow:0 0 70px rgba(157,107,255,.6)}
.cells b,.strip b,.fs-st b,.bg-n,.stk-w,.wh div,.big,.pct,.xc,.xnum,.tpre button,.stk-t b{font-family:var(--disp)!important;font-weight:400!important;letter-spacing:.01em}
.btn.go{font:400 20px/1 var(--disp);letter-spacing:.09em;text-transform:uppercase;position:relative;overflow:hidden}
.btn.go::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(105deg,rgba(255,255,255,0),rgba(255,255,255,.45),rgba(255,255,255,0));transform:translateX(-140%);animation:shim 4.2s cubic-bezier(.5,0,.3,1) 1.2s infinite;pointer-events:none}
@keyframes shim{0%{transform:translateX(-140%)}45%,100%{transform:translateX(360%)}}
.mo-h,#intro .i-title{font-family:var(--disp)!important;font-weight:400!important;text-transform:uppercase;letter-spacing:.01em!important}
.badge{font:400 13px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
/* electric edge: a light runs round the card */
.wkc,.restc.ready,.restc.run,.wr:has(.badge){position:relative}
.wkc::before,.restc.ready::before,.restc.run::before,.wr:has(.badge)::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:conic-gradient(from var(--ang),rgba(157,107,255,0) 0 62%,#9d6bff 80%,#fff 90%,rgba(157,107,255,0) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 3.6s linear infinite;pointer-events:none}
@keyframes spin{to{--ang:360deg}}
.ring .rt1{filter:drop-shadow(0 0 5px rgba(157,107,255,.9))}
.tabs a[aria-current="page"] svg{filter:drop-shadow(0 0 7px rgba(157,107,255,.95))}
.pbar i,.bg-b i:not(.short):not(.low),.gbar i{box-shadow:0 0 12px rgba(157,107,255,.8)}
.ck{position:relative}
.sr.just .ck::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #b893ff;animation:spark .8s cubic-bezier(.2,.9,.3,1) both}
@keyframes spark{from{transform:scale(1);opacity:1}to{transform:scale(2.6);opacity:0}}
button.card:active{box-shadow:0 0 0 1.5px var(--acc),0 0 34px rgba(157,107,255,.45)}
/* body map: tap a part, it lights up */
button.bg-r{cursor:pointer;transition:color .25s}
.bg-r.sel>span:first-child{color:var(--acc-text);text-shadow:0 0 16px rgba(157,107,255,.8)}
.bmap{flex-direction:column;align-items:center;gap:10px;position:sticky;top:-6px;z-index:3;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.bmap svg{width:min(62vw,250px)!important}
.bmap path[data-m]{transition:opacity .35s,fill .35s,fill-opacity .35s;cursor:pointer}
.bmap.has-sel path,.bmap.has-sel g>g:first-child{opacity:.6}
.bmap.has-sel path.sel{opacity:1;fill:#c4a6ff!important;fill-opacity:1!important;stroke:#fff!important;filter:drop-shadow(0 0 4px #9d6bff) drop-shadow(0 0 9px rgba(157,107,255,.9));animation:mpulse 1.5s ease-in-out infinite}
@keyframes mpulse{50%{fill:#9d6bff}}
#bsel-info{text-align:center;min-height:36px;padding:0 8px}
#bsel-info b{display:block;font:400 19px/1.2 var(--disp);letter-spacing:.03em;text-transform:uppercase;color:var(--acc-text)}
/* calendar: tap a day; a dot marks a progress photo */
.cal .cd{position:relative;aspect-ratio:1;display:grid;place-items:center;border:0;border-radius:50%;background:none;padding:0;font:600 14px/1 var(--font);color:var(--dim)}
.cal .cd.td{box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--text)}
.cal .cd.on{background:var(--grad);color:#fff;box-shadow:0 0 16px rgba(124,90,255,.7)}
.cal .cd.ph::after{content:"";position:absolute;right:1px;top:1px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #9d6bff;box-shadow:0 0 8px #b893ff}
.cal .cd:active{transform:scale(.88)}
.leg{display:flex;justify-content:center;gap:18px;font:500 12px/1 var(--font);color:var(--dim)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.leg .l1{background:var(--grad)}.leg .l2{background:#fff;border:2px solid #9d6bff}
.dayph{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dayph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.dayph button{border:0;background:none;padding:0}
/* workout day: one note and photos for the whole session */
.wkx{gap:10px;padding:12px}
.wkx textarea.field{min-height:56px;background:transparent;border-color:var(--line)}
.wkp{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wkp::-webkit-scrollbar{display:none}
.wkp button{flex:none;width:66px;height:88px;border:0;border-radius:12px;padding:0;overflow:hidden;background:none}
.wkp img{width:100%;height:100%;object-fit:cover;display:block}
.wkp label{flex:none;width:66px;height:88px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line2);border-radius:12px;color:var(--acc-text);font:600 13px/1 var(--font);cursor:pointer}
.wkp label:not(.wide){font:400 28px/1 var(--font)}
.wkp label.wide{flex:1;height:48px}
.wkp label svg{width:18px;height:18px}
/* ---- opening ---- */
#ifx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#intro .rays{position:absolute;width:900px;height:900px;margin:-450px;z-index:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(157,107,255,0) 0deg 7deg,rgba(157,107,255,.16) 9deg 11deg,rgba(157,107,255,0) 13deg 20deg);-webkit-mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 30%,transparent 72%);mask:radial-gradient(closest-side,#000 8%,rgba(0,0,0,.5) 30%,transparent 72%)}
#intro.fx .rays{animation:raysp 40s linear infinite}
@keyframes raysp{to{rotate:360deg}}
#intro .mid{z-index:1;transform-style:preserve-3d}

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }

function e1rm(w,r){ if(!(w>0) || !(r>0)) return 0; return r === 1 ? w : w * (1 + r/30); }  // Epley estimate
function fmtW(n){ return (Math.round(n*10)/10).toString(); }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m + ":" + (s<10?"0":"") + s; }
function fmtDur(sec){ sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h? h+":"+(m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s; }
function fmtMin(sec){ return Math.max(1, Math.round(sec/60)) + " min"; }
function fmtVol(n){ return Math.round(n).toLocaleString("en-US"); }
function fmtDate(t){ return new Date(t).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(t){ return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(t){ var d = new Date(t); d.setHours(0,0,0,0); var day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function lowRep(r){ var m = String(r||"").match(/\d+/); return m ? m[0] : ""; }

var ls = {
  get: function(k){ try{ var v = localStorage.getItem("ironlog."+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem("ironlog."+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- starter program (shown until you edit it) ---------- */
var STARTER = { units:"lb", updatedAt:0, weeklyGoal:5, pv:4, goals:[], notes:{}, routines:[
  { id:"mon", day:1, name:"Posterior Chain", focus:"Rows, RDLs, pulldowns, shrugs", exercises:[

    {name:"RDL", sets:4, reps:"10-12", rest:90},

  ]},
  { id:"tue", day:2, name:"Push", focus:"Incline press, Arnold press, triceps", exercises:[
    {name:"Incline Press", sets:4, reps:"8-12", rest:90},
    {name:"Seated Arnold Press", sets:3, reps:"10-12", rest:90},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15-20", rest:60},
    {name:"Cable Tricep Pushdown", sets:3, reps:"15-20", rest:60}
  ]},
  { id:"thu", day:4, name:"Lower Body", focus:"Split squats, squats, extensions, RDLs, calves", exercises:[
    {name:"Smith Bulgarian Split Squat", sets:4, reps:"8-10", rest:90},
    {name:"Goblet Squat / Heels-Elevated Smith Squat", sets:3, reps:"10-12", rest:90},
    {name:"Leg Extension", sets:4, reps:"12-15", rest:60},
    {name:"RDL", sets:3, reps:"12", rest:90},

  ]},
  { id:"fri", day:5, name:"Upper Density", focus:"Row + press, delts, arms, flys, calves", exercises:[
    {name:"Cable Seated Row", sets:4, reps:"15-20", rest:75, link:true},
    {name:"Flat Press", sets:4, reps:"15-20", rest:75},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60, link:true},
    {name:"Rear Delt Raise", sets:4, reps:"15-20", rest:60},
    {name:"Cable Curl", sets:3, reps:"15", rest:60, link:true},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15", rest:60},
    {name:"Cable Chest Fly", sets:2, reps:"20", rest:60},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:60}
  ]},
  { id:"sat", day:6, name:"Shoulders & Carries", focus:"Shoulder press, delts, shrugs, farmer carries", exercises:[
    {name:"Seated Shoulder Press", sets:4, reps:"12", rest:90},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60, link:true},
    {name:"Rear Delt Raise", sets:4, reps:"15-20", rest:60},
    {name:"Dumbbell Shrug", sets:3, reps:"15-20", rest:60},
    {name:"Farmer Carry", sets:3, reps:"lengths of the gym", rest:90, repLabel:"Lengths"},
    {name:"Smith Calf Raise", sets:3, reps:"20", rest:60}
  ]}
]};
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], migrated = false;
function normalise(c){ c.goals = c.goals || []; c.notes = c.notes || {}; c.bars = c.bars || {}; c.gear = c.gear || {}; c.meas = c.meas || []; c.stack = c.stack || {}; c.weeklyGoal = c.weeklyGoal || 5; c.routines = c.routines || [];
  if((c.pv || 0) < 2){ c.routines = clone(STARTER.routines); c.weeklyGoal = 5; c.pv = 2; migrated = true; }
  if((c.pv || 0) < 3){ var ren = { mon:["Back & Hamstrings","Posterior Chain"], thu:["Legs","Lower Body"], fri:["Upper Supersets","Upper Density"] };
    c.routines.forEach(function(r){ if(ren[r.id] && r.name === ren[r.id][0]) r.name = ren[r.id][1]; }); c.pv = 3; migrated = true; }
  if((c.pv || 0) < 4){ c.routines.forEach(function(r){ if(r.id === "tue" && r.name === "Chest & Shoulders") r.name = "Push"; }); c.pv = 4; migrated = true; }
  if((c.pv || 0) < 5){ var addEx = function(id, ex, after){ c.routines.forEach(function(r){ if(r.id !== id) return; var ks = r.exercises.map(function(x){ return key(x.name); }); if(ks.indexOf(key(ex.name)) >= 0) return; var i = after ? ks.indexOf(after) : -1; if(i >= 0 && !r.exercises[i].link) r.exercises.splice(i + 1, 0, ex); else r.exercises.push(ex); }); };
    c.routines.forEach(function(r){ if(r.id === "mon" || r.id === "sat") r.exercises.forEach(function(x){ if(key(x.name) === "dumbbell shrug") x.name = "Smith Shrug"; }); });
    addEx("mon", {name:"Lat Pulldown", sets:4, reps:"10-12", rest:75}, "low cable row");
    addEx("mon", {name:"Dumbbell Curl", sets:3, reps:"10-12", rest:60}, null);
    addEx("tue", {name:"Machine Chest Press", sets:3, reps:"10-12", rest:90}, "incline press");
    addEx("sat", {name:"Hammer Curl", sets:3, reps:"12-15", rest:60}, "smith shrug");
    c.pv = 5; migrated = true; }
  return c; }
var PLATE_COLORS = ["var(--plate)","var(--p-blue)","var(--p-yellow)","var(--p-green)"];

/* ---------- state ---------- */
var S = {
  cfg: normalise(ls.get("cfg") || clone(STARTER)),
  sessions: ls.get("sessions") || [],
  active: ls.get("active") || null,
  parked: ls.get("parked") || [],
  activeAt: ls.get("activeAt") || 0,
  pend: ls.get("pend") || { cfg:false, add:[], del:[] },
  openRoutine: null, pick: false, histMonth: 0,
  progressEx: null
};
if(migrated && S.active && !hasWork(S.active)){ S.active = null; ls.set("active", null); }
var STANDALONE = !(window.claude && typeof window.claude.use === "function");
var db = null, chains = {}, timers = {}, confirmFn = null, restFlash = 0, actx = null, restMin = true;

/* ---------- persistence: this device first, then your Claude account ---------- */
function setSync(s){
  var el = $("#sync"); el.dataset.s = s;
  el.textContent = { local:"Saved on this device", syncing:"Connecting…", cloud:"Saved to your account", offline:"Offline, saved on this device" }[s];
}
function dbWrite(k, fn){
  if(!db) return;
  chains[k] = (chains[k] || Promise.resolve()).then(fn).then(function(){ setSync("cloud"); }).catch(function(e){
    console.warn("save failed", e); setSync("offline");
  });
}
function debounce(k, ms, fn){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }
function savePend(){ ls.set("pend", S.pend); }
function saveCfg(){
  S.cfg.updatedAt = Date.now(); ls.set("cfg", S.cfg);
  S.pend.cfg = true; savePend();
  debounce("cfg", 1200, pushCfg);
}
function pushCfg(){
  var body = clone(S.cfg);
  dbWrite("cfg", function(){ return db.doc("app/config").set(body).then(function(){ S.pend.cfg = false; savePend(); }); });
}
function saveActive(){
  S.activeAt = Date.now(); ls.set("active", S.active); ls.set("parked", S.parked); ls.set("activeAt", S.activeAt);
  debounce("active", 1500, pushActive);
}
function pushActive(){
  var body = S.active ? { on:true, w:clone(S.active), updatedAt:S.activeAt } : { on:false, updatedAt:S.activeAt };
  body.p = clone(S.parked);
  dbWrite("active", function(){ return db.doc("app/active").set(body); });
}
function pushSession(s){
  var body = clone(s);
  dbWrite("s"+s.id, function(){ return db.collection("sessions").doc(s.id).set(body).then(function(){
    S.pend.add = S.pend.add.filter(function(i){ return i !== s.id; }); savePend(); }); });
}
function pushDelete(id){
  dbWrite("s"+id, function(){ return db.collection("sessions").doc(id).delete().then(function(){
    S.pend.del = S.pend.del.filter(function(i){ return i !== id; }); savePend(); }); });
}
function connect(){
  if(!(window.claude && typeof window.claude.use === "function")){ setSync("local"); return; }
  setSync("syncing");
  var slow = setTimeout(function(){ if($("#sync").dataset.s === "syncing") setSync("offline"); }, 10000);
  window.claude.use("db").then(function(d){
    if(!d){ clearTimeout(slow); setSync("local"); return; }
    return Promise.all([
      d.doc("app/config").get(),
      d.doc("app/active").get(),
      d.collection("sessions").orderBy("startedAt","desc").limit(500).get()
    ]).then(function(res){
      clearTimeout(slow); db = d;
      var c = res[0], a = res[1], q = res[2];
      if(c.exists){ var rc = c.data(); if(rc && rc.routines && (!S.pend.cfg || (rc.updatedAt||0) > (S.cfg.updatedAt||0))){ S.cfg = normalise(clone(rc)); S.pend.cfg = false; ls.set("cfg", S.cfg); } }
      if(S.pend.cfg) pushCfg();
      var remote = {}; q.docs.forEach(function(doc){ var v = doc.data(); if(v && v.id) remote[v.id] = clone(v); });
      var merged = [];
      Object.keys(remote).forEach(function(id){ if(S.pend.del.indexOf(id) < 0) merged.push(remote[id]); });
      S.sessions.forEach(function(s){ if(!remote[s.id] && S.pend.add.indexOf(s.id) >= 0) merged.push(s); });
      merged.sort(function(x,y){ return y.startedAt - x.startedAt; });
      S.sessions = merged; ls.set("sessions", merged);
      S.pend.add.slice().forEach(function(id){ var s = merged.filter(function(m){ return m.id === id; })[0]; if(s) pushSession(s); });
      S.pend.del.slice().forEach(pushDelete);
      if(a.exists){ var ra = a.data() || {};
        if((ra.updatedAt||0) > (S.activeAt||0)){ S.active = ra.on && ra.w ? clone(ra.w) : null; S.parked = Array.isArray(ra.p) ? clone(ra.p) : []; S.activeAt = ra.updatedAt; ls.set("active", S.active); ls.set("parked", S.parked); ls.set("activeAt", S.activeAt); }
        else if((S.activeAt||0) > (ra.updatedAt||0)) pushActive();
      } else if(S.active) pushActive();
      if(migrated){ migrated = false; saveCfg(); }
      var offPlan = false; if(S.active && !S.active.routineId){ S.active = null; offPlan = true; } var pk2 = S.parked.filter(function(w){ return w.routineId; }); if(pk2.length !== S.parked.length){ S.parked = pk2; offPlan = true; }
      if(dropStale() || trimActive() || relabel() || offPlan) saveActive();
      savePend(); setSync("cloud");
      var ae = document.activeElement; if(!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName))) render();
    });
  }).catch(function(e){ clearTimeout(slow); console.warn(e); setSync("offline"); });
}

/* ---------- history index ---------- */
function histIndex(){
  var idx = {};
  for(var i = S.sessions.length-1; i >= 0; i--){
    var s = S.sessions[i];
    (s.exercises||[]).forEach(function(x){
      var k = key(x.name); var h = idx[k] || (idx[k] = { name:x.name, best:0, bestSet:null, bestAt:0, last:[], series:[] });
      var top = 0;
      (x.sets||[]).forEach(function(st){ var e = e1rm(st.w, st.r); if(e > top) top = e; if(e > h.best){ h.best = e; h.bestSet = {w:st.w, r:st.r}; h.bestAt = s.startedAt; } });
      h.last = x.sets || []; h.name = x.name;
      if(top > 0) h.series.push({ t:s.startedAt, e:top });
    });
  }
  return idx;
}
function nextRoutine(){
  var rs = S.cfg.routines; if(!rs.length) return null;
  var today = new Date().getDay(), dated = rs.filter(function(r){ return r.day != null; });
  if(dated.length){ var t = dated.filter(function(r){ return r.day === today; })[0]; return t || { rest:true }; }
  var last = S.sessions[0]; if(!last) return rs[0];
  for(var i = 0; i < rs.length; i++) if(rs[i].id === last.routineId) return rs[(i+1) % rs.length];
  return rs[0];
}
function groupOf(a, ei){
  var i = ei, j = ei;
  while(i > 0 && a.exercises[i-1].link) i--;
  while(a.exercises[j].link && a.exercises[j+1]) j++;
  var out = []; for(var k = i; k <= j; k++) out.push(k); return out;
}
function dropStale(){
  var a = S.active; if(!a || !a.routineId) return false;
  if(S.cfg.routines.some(function(r){ return r.id === a.routineId; })) return false;
  if(a.exercises.some(function(x){ return x.sets.some(function(q){ return q.done; }); })) return false;
  S.active = null; return true;
}
function weekStats(){
  var now = Date.now(), ws = weekStart(now), thisWeek = 0, weeks = {};
  S.sessions.forEach(function(s){ var w = weekStart(s.startedAt); weeks[w] = 1; if(w === ws) thisWeek++; });
  var streak = 0, cur = ws; if(!weeks[cur]) cur = weekStart(cur - 864e5);
  while(weeks[cur]){ streak++; cur = weekStart(cur - 864e5); }
  return { thisWeek:thisWeek, streak:streak };
}

/* ---------- workout actions ---------- */
function trimActive(){
  var a = S.active, changed = false; if(!a) return false;
  a.exercises.forEach(function(x){ if(x.plan) return; x.plan = x.sets.length; changed = true;
    while(x.sets.length > 1 && !x.sets[x.sets.length-1].done) x.sets.pop(); });
  return changed;

function chart(series, u){
  var W = 320, H = 160, pl = 36, pr = 16, pt = 18, pb = 24;
  var vals = series.map(function(p){ return p.e; }), mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var lo = mn, hi = mx; if(hi === lo){ hi += 5; lo -= 5; } var pad = (hi-lo)*.18; lo -= pad; hi += pad;
  var X = function(i){ return series.length === 1 ? pl + (W-pl-pr)/2 : pl + i*(W-pl-pr)/(series.length-1); };
  var Y = function(v){ return pt + (hi-v)*(H-pt-pb)/(hi-lo); };
  var ticks = mn === mx ? [mn] : [mn, (mn+mx)/2, mx];
  var g = ticks.map(function(v){ return '<line x1="' + pl + '" x2="' + (W-pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--knurl)" stroke-width="1"/><text x="' + (pl-6) + '" y="' + (Y(v)+4) + '" text-anchor="end" font-size="10" fill="var(--dust)">' + Math.round(v) + '</text>'; }).join("");
  var pts = series.map(function(p, i){ return X(i).toFixed(1) + "," + Y(p.e).toFixed(1); });
  var li = series.length - 1, lx = X(li), ly = Y(series[li].e);
  var area = series.length > 1 ? '<path d="M' + pts.join(" L") + ' L' + X(li) + ',' + (H-pb) + ' L' + X(0) + ',' + (H-pb) + ' Z" fill="var(--plate)" opacity=".14"/><polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--plate)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : "";
  var dots = series.map(function(p, i){ return i === li ? "" : '<circle cx="' + X(i) + '" cy="' + Y(p.e) + '" r="2.5" fill="var(--plate)"/>'; }).join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Estimated one-rep max over time, in ' + esc(u) + '">' + g + area + dots +
    '<circle cx="' + lx + '" cy="' + ly + '" r="5" fill="var(--chalk)" stroke="var(--plate)" stroke-width="3"/>' +
    '<text x="' + pl + '" y="' + (H-6) + '" font-size="10" fill="var(--dust)">' + fmtShort(series[0].t) + '</text>' +
    (series.length > 1 ? '<text x="' + (W-pr) + '" y="' + (H-6) + '" text-anchor="end" font-size="10" fill="var(--dust)">' + fmtShort(series[li].t) + '</text>' : "") + '</svg>';
}

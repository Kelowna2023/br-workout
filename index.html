<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wake">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-w-180.png">
<link rel="icon" type="image/png" href="icon-w-192.png">
<link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<title>Wake</title>
<style>
/* ==================== Wake: one system ====================
   Black, warm white, one teal. Inter Tight. Thin rules, no cards, no glows.
   Solid teal = something you tap. Outlined teal = a status. */
@font-face{font-family:"Inter Tight";src:url("fonts/inter-tight.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Inter Tight";src:url("fonts/inter-tight-macron.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap;unicode-range:U+0100-017F}
@font-face{font-family:"Wake Greek";src:url("fonts/wake-greek.woff2") format("woff2");font-display:block}
@font-face{font-family:"Wake Kanji";src:url("fonts/wake-kanji.woff2") format("woff2");font-display:block}
@font-face{font-family:"Wake Sanskrit";src:url("fonts/wake-sanskrit.woff2") format("woff2");font-display:block}
:root{
  --bg:#000; --tx:#F5F2EC; --mu:#8A867F; --mu2:#6B6862; --dim:#3A3834; --ln:#222; --ln2:#333; --sf:#111;
  --t:#14D3C2; --tsoft:#8FD3CA; --red:#E5604D;
  --p-blue:#2F6FDE; --p-yellow:#E9C33B; --p-green:#3BA55D; --p-red:#D8483A; --p-grey:#8A867F; --chalk:#F5F2EC;
  --font:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --g:20px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --io:cubic-bezier(.76,0,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--tx);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;text-align:inherit}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;border-radius:0}
h1,h2,h3,p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
b,.num{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* ---- top bar: fades in as the big title scrolls away ---- */
#bar{position:absolute;z-index:20;top:0;left:0;right:0;height:calc(var(--st) + 74px);padding:calc(var(--st) + 22px) 8px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#app[data-s="home"] #bar{height:calc(var(--st) + 82px);padding-top:calc(var(--st) + 30px)}
#app[data-s="home"] main{padding-top:calc(var(--st) + 52px)}
#bar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--bp,0);border-bottom:.5px solid var(--ln)}
#bar>*{position:relative;pointer-events:auto}
#app[data-s="home"] #bar::before{bottom:auto;height:calc(var(--st) + 14px);border:0;background:linear-gradient(var(--bg) 62%,rgba(0,0,0,0))}
.bk{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;color:var(--t);font-size:15px;font-weight:500;max-width:min(240px,56vw);transition:transform .3s var(--spring),color .2s}
.bk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bk.tap{transform:scale(.94);opacity:.6}
.bk svg{width:20px;height:20px}
#bar-t{position:absolute;left:50%;top:calc(var(--st) + 22px);height:52px;display:flex;align-items:center;transform:translateX(-50%);font-weight:600;font-size:16px;letter-spacing:-.02em;opacity:var(--tp,0);max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mu);border-radius:50%;transition:transform .3s var(--spring),color .2s}
.ib.due,#tabs a.due{position:relative}
.ib.due::after{content:"";position:absolute;top:10px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--t);box-shadow:0 0 0 2px var(--bg),0 0 0 transparent}
#tabs a.due::after{content:"";position:absolute;top:11px;right:calc(50% - 27px);width:4px;height:4px;border-radius:50%;background:var(--t);box-shadow:0 0 0 transparent}
.ib.tap{transform:scale(.88);color:var(--tx)}
#bar-date{position:absolute;left:var(--g);top:calc(var(--st) + 30px);height:52px;display:flex;align-items:center;font-size:14px;color:#A8A49C;font-weight:500;pointer-events:none}

/* ---- the wordmark: big on arrival, rides your scroll up into the bar ---- */
#wm{position:absolute;z-index:21;left:var(--g);top:calc(var(--st) + 10px);font:600 76px/1 var(--font);letter-spacing:-.05em;display:flex;align-items:flex-end;transform-origin:0 0;will-change:transform;pointer-events:none;white-space:nowrap;view-transition-name:wm}
#wm span{display:inline-block}
#wm i{width:.19em;height:.19em;border-radius:50%;background:var(--t);margin:0 0 .136em .07em;flex:none}
#app:not([data-s="home"]) #wm,#app:not([data-s="home"]) #bar-date{opacity:0!important;visibility:hidden}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.32);opacity:.55}}
.breathe{animation:breathe 2.8s cubic-bezier(.45,0,.55,1) infinite}

/* ---- the scrolling page ---- */
main{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 74px) var(--g) 26px;touch-action:pan-y;overscroll-behavior-x:none;will-change:transform}
main::-webkit-scrollbar{display:none}
/* each section's name in Greek, set huge and vertical down the right edge, far behind the page: it surfaces slowly, out of focus into focus, and drifts a little slower than you scroll */
#view{z-index:1}
#ghost{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.gh{position:absolute;left:0;top:0;will-change:transform}
.gh svg{display:block}
.gh .gring,.gh .gme{transform-box:fill-box;transform-origin:center}
.gh-history .gring{transform-box:view-box;transform-origin:calc(100% + 24px) 36%}
.gh-w{display:block;will-change:transform,opacity;transform:translateZ(0)}
.gcap{margin:64px 0 8px;font-size:13px;line-height:1.55;color:var(--mu2);max-width:17em}
.gcap b{display:block;font-weight:300;font-size:15px;letter-spacing:.16em;color:#9AA9A6;margin-bottom:4px}
.gcap span{font-family:"Wake Greek",serif;font-size:15px;letter-spacing:.04em;color:rgba(20,211,194,.55);margin-left:10px}
/* the neighbouring section, laid out beside this one while you swipe */
/* home: the name stays put; the list dissolves as it slides up under the reflection */
#app[data-s="home"] main{-webkit-mask-image:linear-gradient(180deg,transparent calc(var(--st) + 172px),#000 calc(var(--st) + 246px));mask-image:linear-gradient(180deg,transparent calc(var(--st) + 172px),#000 calc(var(--st) + 246px))}
.big{font:700 46px/1.02 var(--font);letter-spacing:-.052em;margin:16px 0 0;text-wrap:balance;transform-origin:0 100%;will-change:transform,opacity;view-transition-name:title}
.big.lg{font-size:38px;letter-spacing:-.048em}
.sub{color:var(--mu);font-size:15px;margin-top:12px}
.sub.t,.t{color:var(--t)}
.eyebrow{font-size:13px;color:var(--mu);font-weight:500}
.muted{color:var(--mu);font-size:14px;line-height:1.5}
h2{font:500 20px/1.2 var(--font);letter-spacing:-.03em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:48px 0 0;padding-bottom:12px;border-bottom:.5px solid var(--ln)}
.sec h2{font:500 14px/1.3 var(--font);letter-spacing:0;color:#A8A49C}
.sec+.list{border-top:0;margin-top:0!important}
.sec+.empty{border-top:0}
.sec .lnk{padding:0 0 0 12px}
.lnk{color:var(--t);font-weight:600;font-size:14px;padding:8px 0 8px 12px}
.empty{color:var(--mu);font-size:14px;line-height:1.5;padding:16px 0;border-top:.5px solid var(--ln);border-bottom:.5px solid var(--ln)}

/* tags: small pieces of the same smoked glass as the buttons. Complete is teal; In progress carries a slow-breathing teal point */
.tag{flex:none;display:inline-flex;align-items:center;gap:7px;font:500 12px/1 var(--font);letter-spacing:-.005em;color:#9FE9E0;padding:7px 11px;border-radius:10px;white-space:nowrap;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.tag.q{color:#C9C5BD;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.tag.q::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--t);box-shadow:0 0 0 transparent;animation:tagb 2.8s ease-in-out infinite}
@keyframes tagb{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.tag.q::before{animation:none}}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:.5px solid var(--ln2);font-weight:500;font-size:15px;color:var(--tx);transition:transform .35s var(--spring),background .2s,opacity .2s}
.btn.tap{transform:scale(.965)}
/* buttons share the tab bar's material: smoked glass with a fine light rim. The main action is the lit key: a teal glow from below and a hairline of teal light */
.btn{border:0;border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.018));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.04);letter-spacing:-.01em;position:relative;overflow:hidden}
.btn.go{color:#F5FFFD;font-weight:500;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));box-shadow:inset 0 0 0 .5px rgba(150,245,235,.2),inset 0 1px 0 rgba(255,255,255,.06),0 0 0 transparent}
.btn.go::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:1px;transform:scaleY(.6);transform-origin:50% 100%;background:linear-gradient(90deg,transparent,rgba(170,248,240,.7),transparent);pointer-events:none}
.btn.go:disabled::after{opacity:.3}
/* the brand signature: one short line of the logo's teal, centred on the base of a key, with a little light pooled above it.
   No coloured outlines: the glass keeps its quiet neutral edge */
.btn.go,#tab-pill,#clock .chips button.p,.rb{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.085),inset 0 1px 0 rgba(255,255,255,.05)}
.btn.go,#tab-pill,#clock .chips button.p{background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.022))}
.btn.go::after,#tab-pill::after,#clock .chips button.p::after{content:"";position:absolute;left:50%;bottom:0;width:34%;max-width:120px;height:1.5px;border-radius:2px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(20,211,194,0),#14D3C2 30%,#7FF2E6 50%,#14D3C2 70%,rgba(20,211,194,0));box-shadow:0 0 0 transparent;pointer-events:none}
#tab-pill::after{width:40%;max-width:44px;height:1.5px}
#clock .chips button.p::after{width:38%;max-width:40px}
.rb{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
.btn.go:disabled::after{opacity:.3}
.rb,.tag{position:relative}
.btn.danger{color:var(--red)}
.btn.ghost{background:none;box-shadow:none;color:var(--mu)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.grow{flex:1}
.stack{display:grid;gap:10px;margin-top:22px}
.field{width:100%;min-height:48px;background:var(--sf);border:.5px solid var(--ln2);border-radius:12px;padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--t)}
textarea.field{padding:12px 14px;min-height:76px;resize:none;line-height:1.4}

/* ---- home ---- */
.hero{height:168px}
.wk{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.wk-n{font:600 40px/1 var(--font);letter-spacing:-.045em}
.wk-n b{color:var(--t);font-weight:600}.wk-n span{color:var(--dim)}
.wk-l{font-size:13px;color:var(--mu);flex:1;margin-left:-6px}
.wk-s{font-size:15px;color:var(--mu)}
.wk-s b{color:var(--t);font-weight:600}
.wk+.segs{margin-top:12px}
.h-cd{margin-bottom:22px}
.tg-cap{margin-top:14px;font-size:13px;font-weight:500;color:var(--mu2)}
.tg{display:flex;justify-content:space-between;align-items:flex-end;height:36px;margin-top:30px}
.tg i{position:relative;width:1px;height:12px;background:#262626;transform-origin:50% 100%;will-change:transform}
.tg i.p{background:#3A3A3A}
.tg i.t{background:var(--t);opacity:.6}
.tg i.n{height:26px;background:var(--t)}
.tg i.n::before{content:"";position:absolute;left:-2.5px;top:-9px;width:6px;height:6px;border-radius:50%;background:var(--t);box-shadow:0 0 0 transparent}
.h-cd .yg{margin-top:16px}
.h-cd .yg-g i{border-color:#1D1D1D}
.h-cd .yg-g i.p{background:#1D1D1D}
.h-cd .yg-g i.n{border-color:#8F8B84}
.h-cd .yg-c{color:#5E5B56}
.segs{display:flex;gap:6px;margin-top:20px}
.segs+.list{margin-top:36px}
.segs span{flex:1;height:4px;border-radius:2px;background:#1E1E1E;overflow:hidden}
.segs i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .9s var(--out)}
.segs i.on{transform:scaleX(1)}
.list{margin-top:32px;border-top:.5px solid var(--ln)}
.wrow{width:100%;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:.5px solid var(--ln);will-change:transform,opacity;transform-origin:0 50%}
.wn{display:block;font:500 23px/1.1 var(--font);letter-spacing:-.035em;transition:color .15s}
.wrow small{display:block;font-size:13px;color:var(--mu);margin-top:5px}
.wr{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.wv{width:76px;height:20px;overflow:hidden;color:var(--dim);transition:color .4s}
.wv svg{display:block;width:152px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;animation:drift 16s linear infinite;will-change:transform}
.wrow.on .wv{color:var(--t)}
@keyframes drift{to{transform:translate3d(-76px,0,0)}}
/* a horizon under each page title, and a thought at the foot of each page */
.hz{height:1px;margin:22px calc(var(--g) * -1) 0;background:linear-gradient(90deg,transparent,var(--t) 22%,var(--t) 60%,transparent);opacity:.45;transform-origin:0 50%}
.th{position:relative;margin:84px 0 6px;padding-right:10%}
.th.top{margin:52px 0 6px}
.th.top p{font-size:17px}
.th.ry{margin:40px 0 8px;padding-right:14%}.th.ry::before{content:none}.th.ry p{font:400 17px/1.4 var(--font);letter-spacing:-.012em;color:#7C7972;text-wrap:balance}.th.ry p b{font-weight:500;color:#D9D5CD}.th.ry span{color:var(--mu2);margin-top:12px;font-size:12px}
.th::before{content:attr(data-g);position:absolute;left:-10px;top:-62px;font:400 180px/1 Georgia,"Times New Roman",serif;color:var(--tx);opacity:.06;pointer-events:none}
.th[data-g="?"]::before{top:-108px;left:auto;right:4%;font-size:170px}
.th[data-g="~"]::before{top:-118px;left:auto;right:2%;font-size:230px;font-style:italic}
.th p{position:relative;font:400 18px/1.36 var(--font);letter-spacing:-.012em;color:#8F8B84}
.th p b{font-weight:500;color:var(--tx)}
.th span{position:relative;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;color:#A8A49C;margin-top:14px}
.th span i{width:6px;height:6px;border-radius:50%;background:var(--t);flex:none}
/* the inline dial: drag sideways on a number, it turns like a wheel */
.hw{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:6px calc(var(--g) * -1) 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);touch-action:pan-x}
.hw::-webkit-scrollbar{display:none}
.hw-t{display:flex;width:max-content;padding:0 calc(50% - 65px)}
.hw span{flex:none;width:130px;text-align:center;scroll-snap-align:center;font:600 58px/1.12 var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;transform:scale(.36);opacity:.14;will-change:transform}
.hw.ghost span{color:var(--tx)}
.hw-u{text-align:center;font-size:12px;color:var(--mu2);margin-bottom:14px}
.hw-u button{color:var(--t);font-weight:500;padding:6px 0 6px 8px;font-size:12px}
.hw.v{overflow-x:hidden;overflow-y:auto;scroll-snap-type:y mandatory;height:136px;width:240px;margin:0 auto;touch-action:pan-y;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent)}
.hw.v .hw-t{display:block;width:auto;padding:36px 0}
.hw.v span{display:block;width:auto;height:64px;line-height:64px}
.hwx+.hw-u{margin-top:-14px;position:relative}
.hwx{position:relative}
.hw-b{position:absolute;top:50%;margin-top:-30px;width:60px;height:60px;display:grid;place-items:center;color:var(--t);z-index:2;transition:transform .25s var(--spring)}
.hw-b.m{left:calc(50% - 158px)}.hw-b.p{left:calc(50% + 98px)}
.hw-b.tap{transform:scale(1.3)}
.hw-b svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}
.hw.v span{color:var(--tx)}
.hw.v.ghost span{color:var(--tx)}
.hw.sm{flex:1;margin:0 6px;min-width:0}
.hw.sm .hw-t{padding:0 calc(50% - 39px)}
.hw.sm span{width:78px;font:500 26px/44px var(--font);letter-spacing:-.03em}
.rest[data-st="idle"] #rest-n{display:none}
.rest:not([data-st="idle"]) .hw{visibility:hidden}
/* check-ins */
.ck{margin-top:26px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:14px;color:var(--mu)}
.ck b{color:var(--tx);font-weight:500}
.ck .lnk{padding:10px 0;flex:none}.ck .btn{width:auto;min-height:44px;padding:0 20px;flex:none}
.gbar{height:4px;border-radius:2px;background:#1A1A1A;overflow:hidden;margin-top:12px}
.gbar i{display:block;height:100%;background:var(--t);border-radius:2px}
.tn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tn button{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--sf)}
.tn img{width:100%;height:100%;object-fit:cover;display:block}
.tn span{position:absolute;left:10px;bottom:8px;font-size:12px;font-weight:500;text-shadow:0 1px 5px rgba(0,0,0,.85)}
.sc{width:100%;min-height:60px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:.5px solid var(--ln);text-align:left}
.sc b{font:500 17px/1.2 var(--font);letter-spacing:-.02em;transition:color .15s}
.sc.tap b{color:var(--t)}
.sc small{grid-column:1;font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.sc em{grid-row:1/3;grid-column:2;font-style:normal;font-size:14px;font-weight:600;color:var(--t);font-variant-numeric:tabular-nums}
.sc em.z{color:var(--mu2);font-weight:400}
/* moon and the year in weeks */
.mn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu2);flex:none}
.mn svg{width:18px;height:18px;flex:none}
.yg{margin-top:44px}
.yg-g{display:grid;grid-template-columns:repeat(26,1fr);gap:5px}
.yg-g i{aspect-ratio:1;border-radius:50%;border:1px solid #232323}
.yg-g i.p{background:#2A2A2A;border-color:#2A2A2A}
.yg-g i.t{background:var(--t);border-color:var(--t)}
.yg-g i.n{border-color:var(--tx)}
.yg-c{display:flex;justify-content:space-between;font-size:12px;color:var(--mu2);margin-top:12px}
/* rest: the tide comes in */
.ck-tide{position:absolute;inset:0;overflow:hidden;pointer-events:none;will-change:transform}
.ck-tide b{position:absolute;inset:0;background:rgba(20,211,194,.14);transform:translate3d(0,100%,0);transition:transform .3s linear;will-change:transform}
.ck-tide svg{position:absolute;left:0;bottom:100%;width:200%;height:12px;fill:rgba(20,211,194,.14);animation:drift2 7s linear infinite;margin-bottom:-1px}
@keyframes drift2{to{transform:translate3d(-50%,0,0)}}
#clock .ck-bar{display:none}
.bmap path.sel{animation:zap .8s var(--out)}
@keyframes zap{from{fill-opacity:.1}}
.ck-q{font-size:13px;line-height:1.4;color:var(--mu2);text-align:center;max-width:84%;margin-top:6px}
.ck-q b{font-weight:500;color:var(--mu)}
.foot{margin-top:22px;display:grid;gap:2px}
.foot button{color:var(--t);font-weight:500;font-size:15px;padding:12px 0;display:flex;align-items:center;gap:10px}
.foot button.t{color:var(--tsoft)}

/* ---- workout: the list of lifts ---- */
.xrow{width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:.5px solid var(--ln)}
/* a superset: its lifts sit together on one quiet panel, joined by a single slim teal rule */
.ss-panel{position:relative;margin:12px -14px;padding:0 14px;border-radius:18px;background:rgba(255,255,255,.022);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07)}
.ss-panel::before{content:"";position:absolute;left:0;top:22px;bottom:22px;width:1.5px;border-radius:2px;background:var(--t);opacity:.85;pointer-events:none}
.ss-panel .xrow{border-bottom:0;position:relative}

.list > .xrow:has(+ .ss-panel){border-bottom-color:transparent}
.xrow .nm{font:500 19px/1.2 var(--font);letter-spacing:-.025em;display:block}
.xrow small{display:block;font-size:12px;color:var(--mu2);margin-top:3px}
.xrow .ct{font-size:14px;color:var(--mu2);font-variant-numeric:tabular-nums;font-weight:500}
.xrow.done .nm{color:var(--mu)}
.xrow .nm,.prow>span:first-child,.hrow b,.acc>button,.mrow>span:first-child,.grow-r div span:first-child{transition:color .15s}
.prow.tap>span:first-child,.hrow.tap b,.mrow.tap>span:first-child,.grow-r.tap div span:first-child{color:var(--t)}
.xrow small.t{color:var(--t);font-weight:500}
.xrow .ct b{color:var(--t);font-weight:600}
.sub b{color:var(--t);font-weight:600}
.btn.tl{color:#9FD9D2}
.okc{width:22px;height:22px;border-radius:50%;background:var(--t);color:#000;display:grid;place-items:center;flex:none}
.okc svg{width:14px;height:14px;stroke-width:2.4}

/* ---- exercise: one set in focus, the finished ones underneath ---- */
.x-of{font-size:13px;color:var(--mu)}.x-of+.big{margin-top:8px}
.x-beat{font-size:14px;font-weight:500;color:var(--t);margin-top:8px;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.x-beat button{color:var(--mu2);font-weight:400;font-size:14px;padding:4px 0}
.x-note{font-size:13px;color:var(--mu);margin-top:6px}
.x-segs{display:flex;gap:6px;margin-top:18px}
.x-segs span{flex:1;height:4px;border-radius:2px;background:#242424;overflow:hidden}
.x-segs i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .7s var(--out)}
.x-segs i.on{transform:scaleX(1)}
.x-cur{margin-top:24px}
.x-cur .lab{font-size:13px;color:var(--mu)}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stp+.stp{margin-top:14px}
.sb{width:52px;height:52px;border-radius:50%;border:.5px solid var(--ln2);display:grid;place-items:center;font-size:24px;font-weight:400;color:var(--tx);flex:none;transition:transform .28s var(--spring),background .2s,border-color .2s}
.sb.tap{transform:scale(.86);background:var(--sf);border-color:var(--mu2)}
.nw{position:relative;flex:1;text-align:center;overflow:hidden}
.nw input{width:100%;background:none;border:0;outline:0;text-align:center;font:600 58px/1.06 var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--tx);padding:0;caret-color:var(--t)}
.nw input::placeholder{color:var(--dim);opacity:1}
.nw small{display:block;font-size:12px;color:var(--mu2);margin-top:2px}
.nw small button{color:var(--t);font-weight:600;padding:4px 0 4px 6px;font-size:12px}
.sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);transform:translateX(-130%);mix-blend-mode:overlay}
.x-go{margin-top:20px}
.x-sup{margin-top:10px}
.rest{position:relative;margin-top:22px;display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px}
.rest-t{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--mu);font-size:14px}
.rest-t i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;transition:background .3s}
.rest-t b{font:500 28px/1 var(--font);letter-spacing:-.03em;color:var(--tx);min-width:76px}
.rest[data-st="idle"] .rest-t b{color:var(--mu)}
.rest[data-st="run"] .rest-t i,.rest[data-st="go"] .rest-t i{background:var(--t);animation:breathe 2.8s cubic-bezier(.45,0,.55,1) infinite}
.rest[data-st="paused"] .rest-t i{background:var(--t)}
.rest[data-st="go"] .rest-t b{color:var(--t)}
.rest-b{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.05);display:grid;place-items:center;color:var(--t);transition:transform .28s var(--spring)}
.rb.tap{transform:scale(.86)}
.rb svg{width:18px;height:18px}
.rb.x{color:var(--mu)}
.rest[data-st="idle"] .rb.x,.rest[data-st="go"] .rb.x{display:none}
.rest .i-pause,.rest[data-st="run"] .i-play{display:none}.rest[data-st="run"] .i-pause{display:block}
.rest-bar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:#1A1A1A;overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .3s linear}
.dset{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:.5px solid var(--ln)}
.dsets{margin-top:18px;border-top:.5px solid var(--ln)}
.dset .k{color:var(--mu2);font-size:14px;width:44px;flex:none}
.dset .v{font:500 18px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:1;min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dset .v small{font-size:12px;color:var(--t);font-weight:500;letter-spacing:0}
.dset .nb{font-size:13px;color:var(--mu2);min-height:44px;padding:0 4px}
.dset .nb.has{color:var(--t)}
.dset .dx{width:36px;height:44px;color:var(--mu2);font-size:20px;display:grid;place-items:center}
.dnote{padding:0 0 12px 56px;border-bottom:.5px solid var(--ln);margin-top:-6px}
.x-more{display:flex;gap:18px;margin-top:6px}
.x-more button{color:var(--t);font-weight:500;font-size:15px;padding:12px 0}

/* ---- tabs ---- */
/* the tab bar: a floating soft-square of smoked glass, the same corners as the buttons. The page runs on underneath it, softened by the blur;
   a glass key lit from below in teal slides to the section you tap */
#tabs{position:absolute;left:16px;right:16px;bottom:calc(max(var(--sb), 12px) + 4px);display:flex;padding:5px;border-radius:20px;background:rgba(18,22,22,.6);-webkit-backdrop-filter:blur(28px) saturate(1.7);backdrop-filter:blur(28px) saturate(1.7);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1),0 20px 44px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4);z-index:15;view-transition-name:tabs;transform:translateZ(0)}
#tab-pill{position:absolute;left:0;top:5px;bottom:5px;width:0;border-radius:15px;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.025));box-shadow:inset 0 0 0 .5px rgba(255,255,255,.075),inset 0 1px 0 rgba(255,255,255,.05);pointer-events:none;opacity:0;will-change:transform,width}
#tab-pill::after{content:"";position:absolute;left:34%;right:34%;bottom:0;height:1px;transform:scaleY(.5);transform-origin:50% 100%;background:linear-gradient(90deg,transparent,rgba(150,245,235,.75),transparent)}
/* a soft fall to black behind the bar, so the page dissolves before it reaches the glass */
#tab-veil{position:absolute;left:0;right:0;bottom:0;height:calc(max(var(--sb), 12px) + 104px);background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.72) 34%,#000 52%);pointer-events:none;z-index:14}
#app[data-s="home"] #tab-veil,#app[data-s="dn"] #tab-veil,#app[data-s="wk"] #tab-veil,#app[data-s="ex"] #tab-veil,#app[data-s="setup"] #tab-veil{display:none}
#app[data-s="home"] main,#app[data-s="history"] main,#app[data-s="progress"] main,#app[data-s="body"] main{padding-bottom:calc(max(var(--sb), 12px) + 96px)}
#tabs a{position:relative;z-index:1;flex:1;display:grid;justify-items:center;align-content:center;min-height:48px;padding:0;font-size:14.5px;font-weight:500;letter-spacing:-.01em;color:#8A867F;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:color .42s cubic-bezier(.22,1,.36,1),transform .3s cubic-bezier(.22,1,.36,1)}
#tabs a.tap{transform:scale(.94)}
#tabs a[aria-current="page"]{color:#F5FFFD}
#tab-dot{display:none}
#app[data-s="dn"] #tabs,#app[data-s="wk"] #tabs,#app[data-s="ex"] #tabs,#app[data-s="setup"] #tabs{display:none}

/* ---- history ---- */
.cal-h .ib{color:var(--t)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.cal-h b{font:500 18px/1 var(--font);letter-spacing:-.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px;row-gap:2px}
.cal .dw{font-size:11px;color:var(--mu2);text-align:center;padding:6px 0}
.cd{position:relative;height:48px;display:grid;place-items:center;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.cd span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring)}
.cd.on{color:#000;font-weight:600}.cd.on span{background:var(--t)}
.cd.on.tap span{transform:scale(.86)}
.cd.td:not(.on){color:var(--tx)}.cd.td:not(.on) span{border:1px solid var(--ln2)}
.cd.ph::after{content:"";position:absolute;top:5px;right:calc(50% - 20px);width:6px;height:6px;border-radius:50%;background:var(--tx);border:1.5px solid #000}
.cd.ph:not(.on){color:var(--tx)}
.cd.pa{color:var(--mu)}.cd.pa.tap span{background:var(--ln)}
.lg-r{width:100%;min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:.5px solid var(--ln);font-size:16px;font-weight:500;color:var(--t);text-align:left;transition:opacity .2s}.lg-r.tap{opacity:.5}.lg-r svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bd{margin-top:14px}
.hrow{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:.5px solid var(--ln)}
.hrow b{font:500 17px/1.2 var(--font);letter-spacing:-.02em;display:block}
.hrow small{display:block;font-size:13px;color:var(--mu);margin-top:3px}
.hrow .r{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.hrow .r b{font-size:17px;color:var(--tx)}
.dx-ex{padding:12px 0;border-bottom:.5px solid var(--ln)}
.dx-ex b{font-weight:600;font-size:15px;display:block}
.dx-ex span{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums;display:block;margin-top:3px;line-height:1.5}
.dx-ex em{display:block;font-style:normal;font-size:13px;color:var(--mu2);margin-top:4px}

/* ---- progress ---- */
.acc{border-bottom:.5px solid var(--ln)}
.acc>button{width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;font:500 20px/1.2 var(--font);letter-spacing:-.03em}
.acc>button{transition:color .6s var(--out)!important}
.acc.open>button{color:var(--t)}
.acc>button svg{width:18px;height:18px;color:var(--t);transition:transform .75s cubic-bezier(.65,0,.35,1)!important}
.acc.open>button svg{transform:rotate(90deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .75s cubic-bezier(.65,0,.35,1)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.acc-b>div>*{opacity:0;transform:translate3d(0,-8px,0);transition:opacity .35s ease,transform .5s var(--out)}
.acc.open .acc-b>div>*{opacity:1;transform:none;transition:opacity .6s ease .18s,transform .8s var(--out) .18s}
.pg-up{font-style:normal;color:var(--t);font-size:10px;margin-right:7px;position:relative;top:-1px}
.sub b{color:var(--tx);font-weight:500}
.prow{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;border-top:.5px solid #161616}
.prow span:last-child{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.acc-b>div>:last-child{margin-bottom:10px}
.pday{padding:16px 0;border-bottom:.5px solid var(--ln)}
.pday-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pday-h span{font-size:14px;color:var(--mu)}
.pday-h b{font:500 22px/1 var(--font);letter-spacing:-.03em}
.pday-h b small{font-size:12px;color:var(--mu2);font-weight:500;letter-spacing:0}
.pday-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.pday-n{font-size:14px;color:var(--mu);margin-top:10px;line-height:1.5;padding-left:12px;border-left:1px solid var(--ln2)}
.up,.fs-r span:last-child .up{color:var(--t);font-weight:600;font-size:13px}

/* ---- body ---- */
.bmap{margin:34px calc(var(--g) * -1 + 4px) 0;perspective:1400px}
.vit-in{position:relative;aspect-ratio:1002/1000;will-change:transform}
.vit svg{position:absolute;inset:0;width:100%;height:100%}
.vit .vb,.vit.back .vf{display:none}.vit.back .vb{display:inline}
.vit-g{transition:opacity .5s}

.bmap path[data-m]{transition:fill .45s cubic-bezier(.22,1,.36,1),fill-opacity .45s cubic-bezier(.22,1,.36,1),stroke .45s;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bside{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:6px}
.bside button{min-height:44px;padding:0 6px;font-size:14px;font-weight:500;color:var(--mu2);transition:color .4s cubic-bezier(.22,1,.36,1)}
.bside button[aria-pressed="true"]{color:var(--tx)}
.bside i{width:1px;height:12px;background:var(--ln2)}
.b-info{min-height:44px;margin-top:22px;margin-bottom:26px;font-size:14px;color:var(--mu);line-height:1.6;text-align:center}
.b-info b{color:var(--t);font-weight:600;font-size:16px;display:block}
.grow-r{width:100%;display:block;padding:14px 0 12px;border-bottom:.5px solid var(--ln)}
.grow-r div{display:flex;justify-content:space-between;align-items:baseline;font:500 18px/1 var(--font);letter-spacing:-.02em}
.grow-r div span:last-child{font-variant-numeric:tabular-nums;color:var(--mu)}
.grow-r[aria-pressed="true"] div span{color:var(--t)}
.grow-r p{height:3px;border-radius:2px;background:#1A1A1A;margin-top:10px;overflow:hidden}
.grow-r p i{display:block;height:100%;background:var(--t);border-radius:2px;transform-origin:0 50%}
.mrow{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--ln);font-size:16px}
.mrow span:last-child{color:var(--mu);font-size:14px}.mrow b{color:var(--tx);font-size:17px}
.ph-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ph-strip button{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sf)}
.ph-strip img{width:100%;height:100%;object-fit:cover;display:block}
.ph-strip span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.ph-full{width:100%;border-radius:12px;display:block;margin:12px 0}

/* ---- setup ---- */
details.rt{border-bottom:.5px solid var(--ln)}
details.rt summary{list-style:none;min-height:64px;display:flex;align-items:center;justify-content:space-between;font:500 20px/1.2 var(--font);letter-spacing:-.03em}
details.rt summary::-webkit-details-marker{display:none}
details.rt summary small{font-size:13px;color:var(--mu2);font-weight:400;letter-spacing:0}
.rt-b{padding:0 0 18px;display:grid;gap:10px}
.rx{display:grid;grid-template-columns:1fr 64px 64px 36px;gap:6px;align-items:center}
.rx .field{min-height:44px;padding:0 10px;font-size:16px}
.rx-h{font-size:11px;color:var(--mu2)}
.rx button{color:var(--mu2);font-size:20px;height:44px}
.sup{font-size:12px;color:var(--mu2);display:flex;align-items:center;gap:8px;margin:-2px 0 4px}
.sup input{width:18px;height:18px;border:1px solid var(--ln2);border-radius:5px;display:grid;place-items:center}
.sup input:checked{background:var(--t);border-color:var(--t)}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:60px;border-bottom:.5px solid var(--ln);font-size:16px;gap:12px}
.seg{display:flex;border:.5px solid var(--ln2);border-radius:10px;overflow:hidden}
.seg button{min-width:52px;min-height:38px;padding:0 12px;font-size:14px;font-weight:500;color:var(--mu)}
.seg button[aria-pressed="true"]{background:var(--t);color:#000;font-weight:600}
.ver{margin-top:28px;font-size:12px;color:var(--dim);text-align:center}

/* ---- sheets ---- */
#sheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
.panel{width:100%;max-height:88%;overflow-y:auto;background:#0C0C0C;border-top:.5px solid var(--ln2);border-radius:22px 22px 0 0;padding:10px var(--g) calc(var(--sb) + 22px);display:grid;gap:14px;animation:rise .55s var(--out) both;will-change:transform}
.grab{width:100%;height:20px;display:grid;place-items:center;touch-action:none;margin-bottom:-4px}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--ln2)}
.panel h2{font-size:24px;letter-spacing:-.035em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:12px;border:.5px solid var(--ln2);font-size:15px;font-weight:500;transition:transform .28s var(--spring)}
.chips button.tap{transform:scale(.94)}
.chips button[aria-pressed="true"]{border-color:var(--t);color:var(--t)}
.wheel{position:relative;display:flex;justify-content:center;gap:6px;height:220px;font:500 26px/44px var(--font);font-variant-numeric:tabular-nums}
.wheel::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-top:.5px solid var(--ln2);border-bottom:.5px solid var(--ln2);pointer-events:none}
.wheel>div{width:84px;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel>div::-webkit-scrollbar{display:none}
.wheel>div>span{display:block;height:44px;scroll-snap-align:center}
.wheel>b{align-self:center;font-size:13px;color:var(--mu);font-weight:500;width:28px}
.bar-draw{display:flex;align-items:center;justify-content:center;height:130px;gap:2px}
.bar-draw .shaft{width:70px;height:8px;background:#555}
.bar-draw .sleeve{width:16px;height:12px;background:#666;border-radius:2px}
.bar-draw .collar{width:6px;height:26px;background:#777;border-radius:2px}
.pl{display:grid;place-items:center;border-radius:3px;background:var(--c);color:#000;font-size:9px;font-weight:600;writing-mode:vertical-rl}
.plbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plbtns .dot{width:12px;height:12px;border-radius:50%}
.fs-r{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-bottom:.5px solid var(--ln);font-size:15px}
.fs-r span:last-child{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.ms-in{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.ms-in .field{width:120px;text-align:center}

/* ---- rest, grown: press play and the timer swells into the lower half of the screen ---- */
/* while a rest runs, it follows you: a small glass capsule under the status bar on every other page. Tap it for the full clock */

::view-transition-group(*){animation-duration:.55s;animation-timing-function:var(--out)}

::view-transition-new(root){animation:vt-in .55s var(--out) both}
html[data-dir="back"]::view-transition-old(root){animation-name:vt-out-b}

html[data-dir="tab"]::view-transition-new(root){animation:fade .28s ease-out both}
html[data-carry="1"]::view-transition-group(title){animation-duration:.68s;animation-timing-function:cubic-bezier(.7,0,.14,1)}

html[data-carry="1"]::view-transition-old(root){animation:fade .2s ease-in reverse both}
html[data-carry="1"]::view-transition-new(root){animation:fade .26s .2s ease-out both}

/* ---------- type system ----------
   One scale, one job per size. Everything on a page sits on one of these steps:
   46  page title (700)                     24  the workouts on home (600)
   22  section headings (600, white)        20  the lifts inside a workout (500)
   17  every row under a section heading, and its values (500)
   15  body copy, buttons, right-hand values
   13  captions and sub-lines under a name  11  tab bar and weekday letters only
   Colour carries the rest: white = read this, grey (--mu) = supporting, teal = tappable or yours. No text sits on the dimmest grey any more. */
:root{--mu2:#7F7B74}

.acc>button{min-height:60px}
details.rt summary{min-height:60px}
details.rt summary small,.sc small,.hrow small{font-size:13px;color:var(--mu)}
.wn{font-size:24px;font-weight:600}

.prow,.mrow,.opt{font-size:17px}
.cal-h b{font-size:17px}
.dset .v{font-size:17px}
.b-info b{font-size:17px}
.muted,.empty,.b-info,.ck,.rest-t,.pday-s,.bk-st{font-size:15px}
.x-beat,.x-beat button{font-size:15px}
.x-beat button{color:var(--mu)}
.xrow .ct,.hrow .r,.prow span:last-child,.mrow span:last-child,.sc em{font-size:15px}
.xrow .ct{color:var(--mu)}
.lnk{font-size:15px}

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function key(name){ return String(name||"").trim().toLowerCase(); }
function e1rm(w,r){ if(!(w>0) || !(r>0)) return 0; return r === 1 ? w : w * (1 + r/30); }  // Epley estimate
function fmtW(n){ return (Math.round(n*10)/10).toString(); }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m + ":" + (s<10?"0":"") + s; }
function fmtDur(sec){ sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h? h+":"+(m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s; }
function fmtMin(sec){ return Math.max(1, Math.round(sec/60)) + " min"; }
function fmtVol(n){ return Math.round(n).toLocaleString("en-US"); }
function fmtDate(t){ return new Date(t).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(t){ return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(t){ var d = new Date(t); d.setHours(0,0,0,0); var day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function lowRep(r){ var m = String(r||"").match(/\d+/); return m ? m[0] : ""; }

var ls = {
  get: function(k){ try{ var v = localStorage.getItem("ironlog."+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem("ironlog."+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- starter program (shown until you edit it) ---------- */
var STARTER = { units:"lb", updatedAt:0, weeklyGoal:5, pv:4, goals:[], notes:{}, routines:[
  { id:"mon", day:1, name:"Posterior Chain", focus:"Rows, RDLs, pulldowns, shrugs", exercises:[
    {name:"Low Cable Row", sets:3, reps:"12-15", rest:150},
    {name:"RDL", sets:3, reps:"10-12", rest:150},
    {name:"Cable Straight-Arm Pulldown", sets:3, reps:"15", rest:150},
    {name:"Hamstring Curl", sets:3, reps:"15", rest:150},

  ]},
  { id:"tue", day:2, name:"Push", focus:"Incline press, Arnold press, triceps", exercises:[
    {name:"Incline Press", sets:3, reps:"8-12", rest:150},
    {name:"Seated Arnold Press", sets:3, reps:"10-12", rest:150},
    {name:"Lateral Raise", sets:3, reps:"15-20", rest:150},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15-20", rest:150},
    {name:"Cable Tricep Pushdown", sets:3, reps:"15-20", rest:150}
  ]},
  { id:"thu", day:4, name:"Lower Body", focus:"Split squats, squats, extensions, RDLs, calves", exercises:[
    {name:"Smith Bulgarian Split Squat", sets:3, reps:"8-10", rest:150},
    {name:"Goblet Squat / Heels-Elevated Smith Squat", sets:3, reps:"10-12", rest:150},
    {name:"Leg Extension", sets:3, reps:"12-15", rest:150},
    {name:"RDL", sets:3, reps:"12", rest:150},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:150}
  ]},
  { id:"fri", day:5, name:"Upper Density", focus:"Row + press, delts, arms, flys, calves", exercises:[
    {name:"Cable Seated Row", sets:3, reps:"15-20", rest:150, link:true},
    {name:"Flat Press", sets:3, reps:"15-20", rest:150},
    {name:"Lateral Raise", sets:3, reps:"15-20", rest:150, link:true},
    {name:"Rear Delt Raise", sets:3, reps:"15-20", rest:150},
    {name:"Cable Curl", sets:3, reps:"15", rest:150, link:true},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15", rest:150},
    {name:"Cable Chest Fly", sets:3, reps:"20", rest:150},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:150}
  ]},
  { id:"sat", day:6, name:"Shoulders & Carries", focus:"Shoulder press, delts, shrugs, farmer carries", exercises:[
    {name:"Seated Shoulder Press", sets:3, reps:"12", rest:150},
    {name:"Lateral Raise", sets:3, reps:"15-20", rest:150, link:true},
    {name:"Rear Delt Raise", sets:3, reps:"15-20", rest:150},
    {name:"Dumbbell Shrug", sets:3, reps:"15-20", rest:150},
    {name:"Farmer Carry", sets:3, reps:"lengths of the gym", rest:150, repLabel:"Lengths"},
    {name:"Smith Calf Raise", sets:3, reps:"20", rest:150}
  ]}
]};
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], migrated = false;
function normalise(c){ c.goals = c.goals || []; c.notes = c.notes || {}; c.bars = c.bars || {}; c.gear = c.gear || {}; c.meas = c.meas || []; c.stack = c.stack || {}; c.weeklyGoal = c.weeklyGoal || 5; c.routines = c.routines || [];
  if((c.pv || 0) < 2){ c.routines = clone(STARTER.routines); c.weeklyGoal = 5; c.pv = 2; migrated = true; }
  if((c.pv || 0) < 3){ var ren = { mon:["Back & Hamstrings","Posterior Chain"], thu:["Legs","Lower Body"], fri:["Upper Supersets","Upper Density"] };
    c.routines.forEach(function(r){ if(ren[r.id] && r.name === ren[r.id][0]) r.name = ren[r.id][1]; }); c.pv = 3; migrated = true; }
  if((c.pv || 0) < 4){ c.routines.forEach(function(r){ if(r.id === "tue" && r.name === "Chest & Shoulders") r.name = "Push"; }); c.pv = 4; migrated = true; }
  if((c.pv || 0) < 5){ var addEx = function(id, ex, after){ c.routines.forEach(function(r){ if(r.id !== id) return; var ks = r.exercises.map(function(x){ return key(x.name); }); if(ks.indexOf(key(ex.name)) >= 0) return; var i = after ? ks.indexOf(after) : -1; if(i >= 0 && !r.exercises[i].link) r.exercises.splice(i + 1, 0, ex); else r.exercises.push(ex); }); };
    c.routines.forEach(function(r){ if(r.id === "mon" || r.id === "sat") r.exercises.forEach(function(x){ if(key(x.name) === "dumbbell shrug") x.name = "Smith Shrug"; }); });
    addEx("mon", {name:"Lat Pulldown", sets:3, reps:"10-12", rest:150}, "low cable row");
    addEx("mon", {name:"Dumbbell Curl", sets:3, reps:"10-12", rest:150}, null);
    addEx("tue", {name:"Machine Chest Press", sets:3, reps:"10-12", rest:150}, "incline press");
    addEx("sat", {name:"Hammer Curl", sets:3, reps:"12-15", rest:150}, "smith shrug");
    c.pv = 5; migrated = true; }
  if((c.pv || 0) < 6){ c.routines.forEach(function(r){ r.exercises.forEach(function(x){ x.rest = 150; }); }); c.pv = 6; migrated = true; }
  if((c.pv || 0) < 7){ c.routines.forEach(function(r){ r.exercises.forEach(function(x){ x.sets = 3; }); }); c.pv = 7; migrated = true; }
  return c; }

/* ---------- state ---------- */
var S = {
  cfg: normalise(ls.get("cfg") || clone(STARTER)),
  sessions: ls.get("sessions") || [],
  active: ls.get("active") || null,
  parked: ls.get("parked") || [],
  activeAt: ls.get("activeAt") || 0,
  pend: ls.get("pend") || { cfg:false, add:[], del:[] },
  openRoutine: null, pick: false, histMonth: 0,
  progressEx: null
};
if(migrated && S.active && !hasWork(S.active)){ S.active = null; ls.set("active", null); }
if(!ls.get("r150")){ [S.active].concat(S.parked || []).forEach(function(w){ if(w && w.exercises) w.exercises.forEach(function(x){ x.rest = 150; }); }); ls.set("active", S.active); ls.set("parked", S.parked); ls.set("r150", 1); }
if(!ls.get("s3")){ [S.active].concat(S.parked || []).forEach(function(w){ if(w && w.exercises) w.exercises.forEach(function(x){ var dn = x.sets.filter(function(q){ return q.done; }).length; x.plan = Math.max(3, dn);
  while(x.sets.length < 3){ var l = x.sets[x.sets.length - 1]; x.sets.push({ w: l ? l.w : "", r: l ? l.r : "", pl: l && l.pl ? l.pl.slice() : [], bar: l ? l.bar : undefined, done:false, prev:null }); } }); }); ls.set("active", S.active); ls.set("parked", S.parked); ls.set("s3", 1); }
if(!ls.get("g3")){ S.cfg.gear = S.cfg.gear || {}; if(S.cfg.gear["incline press"] !== "bar"){ S.cfg.gear["incline press"] = "bar"; ls.set("cfg", S.cfg); } ls.set("g3", 1); }
if(!ls.get("g2")){ S.cfg.gear = S.cfg.gear || {}; Object.keys(S.cfg.gear).forEach(function(k){ if(/smith/.test(k) || S.cfg.gear[k] === "bar") delete S.cfg.gear[k]; }); ls.set("cfg", S.cfg); ls.set("g2", 1); }
var STANDALONE = !(window.claude && typeof window.claude.use === "function");
var db = null, chains = {}, timers = {}, confirmFn = null, restFlash = 0, actx = null, restMin = true;

/* ---------- persistence: this device first, then your Claude account ---------- */
function setSync(s){
  var el = $("#sync"); el.dataset.s = s;
  el.textContent = { local:"Saved on this device", syncing:"Connecting…", cloud:"Saved to your account", offline:"Offline, saved on this device" }[s];
}
function dbWrite(k, fn){
  if(!db) return;
  chains[k] = (chains[k] || Promise.resolve()).then(fn).then(function(){ setSync("cloud"); }).catch(function(e){
    console.warn("save failed", e); setSync("offline");
  });
}
function debounce(k, ms, fn){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }
function savePend(){ ls.set("pend", S.pend); }
function saveCfg(){
  S.cfg.updatedAt = Date.now(); ls.set("cfg", S.cfg);
  S.pend.cfg = true; savePend();
  debounce("cfg", 1200, pushCfg);
}
function pushCfg(){
  var body = clone(S.cfg);
  dbWrite("cfg", function(){ return db.doc("app/config").set(body).then(function(){ S.pend.cfg = false; savePend(); }); });
}
function saveActive(){
  S.activeAt = Date.now(); ls.set("active", S.active); ls.set("parked", S.parked); ls.set("activeAt", S.activeAt);
  debounce("active", 1500, pushActive);
}
function pushActive(){
  var body = S.active ? { on:true, w:clone(S.active), updatedAt:S.activeAt } : { on:false, updatedAt:S.activeAt };
  body.p = clone(S.parked);
  dbWrite("active", function(){ return db.doc("app/active").set(body); });
}
function pushSession(s){
  var body = clone(s);
  dbWrite("s"+s.id, function(){ return db.collection("sessions").doc(s.id).set(body).then(function(){
    S.pend.add = S.pend.add.filter(function(i){ return i !== s.id; }); savePend(); }); });
}
function pushDelete(id){
  dbWrite("s"+id, function(){ return db.collection("sessions").doc(id).delete().then(function(){
    S.pend.del = S.pend.del.filter(function(i){ return i !== id; }); savePend(); }); });
}
function connect(){
  if(!(window.claude && typeof window.claude.use === "function")){ setSync("local"); return; }
  setSync("syncing");
  var slow = setTimeout(function(){ if($("#sync").dataset.s === "syncing") setSync("offline"); }, 10000);
  window.claude.use("db").then(function(d){
    if(!d){ clearTimeout(slow); setSync("local"); return; }
    return Promise.all([
      d.doc("app/config").get(),
      d.doc("app/active").get(),
      d.collection("sessions").orderBy("startedAt","desc").limit(500).get()
    ]).then(function(res){
      clearTimeout(slow); db = d;
      var c = res[0], a = res[1], q = res[2];
      if(c.exists){ var rc = c.data(); if(rc && rc.routines && (!S.pend.cfg || (rc.updatedAt||0) > (S.cfg.updatedAt||0))){ S.cfg = normalise(clone(rc)); S.pend.cfg = false; ls.set("cfg", S.cfg); } }
      if(S.pend.cfg) pushCfg();
      var remote = {}; q.docs.forEach(function(doc){ var v = doc.data(); if(v && v.id) remote[v.id] = clone(v); });
      var merged = [];
      Object.keys(remote).forEach(function(id){ if(S.pend.del.indexOf(id) < 0) merged.push(remote[id]); });
      S.sessions.forEach(function(s){ if(!remote[s.id] && S.pend.add.indexOf(s.id) >= 0) merged.push(s); });
      merged.sort(function(x,y){ return y.startedAt - x.startedAt; });
      S.sessions = merged; ls.set("sessions", merged);
      S.pend.add.slice().forEach(function(id){ var s = merged.filter(function(m){ return m.id === id; })[0]; if(s) pushSession(s); });
      S.pend.del.slice().forEach(pushDelete);
      if(a.exists){ var ra = a.data() || {};
        if((ra.updatedAt||0) > (S.activeAt||0)){ S.active = ra.on && ra.w ? clone(ra.w) : null; S.parked = Array.isArray(ra.p) ? clone(ra.p) : []; S.activeAt = ra.updatedAt; ls.set("active", S.active); ls.set("parked", S.parked); ls.set("activeAt", S.activeAt); }
        else if((S.activeAt||0) > (ra.updatedAt||0)) pushActive();
      } else if(S.active) pushActive();
      if(migrated){ migrated = false; saveCfg(); }
      var offPlan = false; if(S.active && !S.active.routineId){ S.active = null; offPlan = true; } var pk2 = S.parked.filter(function(w){ return w.routineId; }); if(pk2.length !== S.parked.length){ S.parked = pk2; offPlan = true; }
      if(dropStale() || trimActive() || relabel() || offPlan) saveActive();
      savePend(); setSync("cloud");
      var ae = document.activeElement; if(!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName))) render();
    });
  }).catch(function(e){ clearTimeout(slow); console.warn(e); setSync("offline"); });
}

/* ---------- history index ---------- */

  if(calm || !p || !p.animate){ s.hidden = true; s.innerHTML = ""; return; }
  var cur = p.style.transform || "translateY(0)";
  p.animate([{ transform:cur }, { transform:"translateY(100%)" }], { duration:260, easing:"cubic-bezier(.4,0,.7,.2)", fill:"forwards" });
  s.animate([{ opacity:1 }, { opacity:0 }], { duration:260, fill:"forwards" }).onfinish = function(){ s.hidden = true; s.innerHTML = ""; s.getAnimations().forEach(function(q){ q.cancel(); }); };
}
function ask(title, text, yes, fn, opt){
  opt = opt || {}; $("#sheet").hidden = true; $("#sheet").getAnimations().forEach(function(q){ q.cancel(); });
  sheet('<h2>' + esc(title) + '</h2><div class="muted">' + esc(text) + '</div><div class="row"><button class="btn grow" type="button" data-act="sheet-close">' + esc(opt.no || "Keep it") + '</button><button class="btn ' + (opt.go ? "go" : "danger") + ' grow" type="button" data-act="confirm-yes">' + esc(yes) + '</button></div>');
  confirmFn = fn;
}
function toast(msg){ var t = $("#toast"); t.innerHTML = "<div>" + esc(msg) + "</div>"; clearTimeout(timers.toast); timers.toast = setTimeout(function(){ t.innerHTML = ""; }, 2600); }
/* pull the sheet down by its handle: it follows, then closes or springs back */
(function(){
  var sh = $("#sheet"), on = false, y0 = 0, dy = 0, p = null;
  sh.addEventListener("touchstart", function(ev){ p = sh.firstChild; on = !!(p && (ev.target.classList.contains("grab") || (p.scrollTop <= 0 && ev.target.closest(".panel") && !ev.target.closest("input,textarea,.wheel,.chips")))); y0 = ev.touches[0].clientY; dy = 0; }, { passive:true });
  sh.addEventListener("touchmove", function(ev){ if(!on) return; dy = ev.touches[0].clientY - y0; if(dy <= 0){ p.style.transform = ""; return; } if(dy > 6){ p.style.animation = "none"; p.style.transform = "translateY(" + dy + "px)"; } }, { passive:true });
  sh.addEventListener("touchend", function(){ if(!on) return; on = false; if(dy > 110) closeSheet(); else if(dy > 6){ p.animate([{ transform:"translateY(" + dy + "px)" }, { transform:"translateY(0)" }], { duration:380, easing:OUT }); p.style.transform = ""; } });
})();

/* ---------- photos ---------- */

    S.photos.forEach(function(p){ try{ URL.revokeObjectURL(p.url); }catch(e){} });
    S.photos = (list || []).sort(function(a, b){ return b.at - a.at; }).map(function(p){ return { id:p.id, at:p.at, wid:p.wid || "", url:URL.createObjectURL(p.blob) }; });
    var v = view.dataset.v; if(v === "body" || v === "history") render();
  }).catch(function(){ S.photosOff = true; if(view.dataset.v === "body") render(); });
}
function addPhoto(file){
  var at = file.lastModified && file.lastModified < Date.now() + 60000 ? file.lastModified : Date.now();
  toast("Saving photo…");
  shrink(file).then(function(blob){ return pTx("readwrite", function(st){ return st.put({ id:uid(), at:at, blob:blob }); }); })
    .then(function(){ toast("Photo saved"); return loadPhotos(); }).catch(function(){ toast("Couldn't save that photo"); });

/* a quiet piece behind each main page: the tide rises with the week on Train, one ring per workout on History */

  if(type === "home"){ var ws = weekStart(Date.now()), goal = Math.max(1, +S.cfg.weeklyGoal || 5), n = S.sessions.filter(function(q){ return q.startedAt >= ws; }).length, f = Math.min(1, n / goal);
    el.querySelector(".dk-tide").style.setProperty("--lvl", (17 + f * 45).toFixed(1) + "%"); el.querySelector(".dk-tide").style.setProperty("--ink", (0.1 + f * 0.1).toFixed(3)); }
  if(type === "history"){ var c = Math.min(16, S.sessions.length), h = "", i; for(i = 0; i < c + 2; i++){ var live = i < c, r = 54 + i * 22;
      h += '<circle cx="400" cy="400" r="' + r + '" fill="none" stroke="#14D3C2" stroke-width="' + (live ? 1 : 0.6) + '" opacity="' + (live ? Math.max(0.08, 0.42 - i * 0.022) : 0.07).toFixed(3) + '"' + (live ? '' : ' stroke-dasharray="2 7"') + '/>'; }
    h += '<circle class="rip" cx="400" cy="400" r="54" fill="none" stroke="#14D3C2" stroke-width="1"/>'; el.querySelector(".dk-rings").innerHTML = h; } }
/* the home list always ends above the tab bar: rows share whatever height the screen really has */

  var top = lst.getBoundingClientRect().top + view.scrollTop, avail = tb.getBoundingClientRect().top - 40 - top; if(!(avail > 0)) return;
  var rh = clamp(Math.floor(avail / rows.length), 50, 132); UI.rh = rh;
  lst.classList.toggle("tight", rh < 70); lst.classList.toggle("tighter", rh < 58);
  [].forEach.call(rows, function(e){ e.style.minHeight = rh + "px"; e.style.height = rh + "px"; });
  var fits = rh * rows.length <= avail; if(fits) view.scrollTop = 0; view.style.overflowY = fits ? "hidden" : ""; }
window.addEventListener("resize", function(){ UI.rh = 0; fitHome(); });
/* ---------- home ---------- */
function vHome(){
  var now = Date.now(), ws = weekStart(now), goal = Math.max(1, +S.cfg.weeklyGoal || 5), n = 0, done = {}, prog = {}, last = {}, cnt = {}, segs = "", rows = "";
  S.sessions.forEach(function(s){ if(s.startedAt >= ws){ n++; if(s.routineId) done[s.routineId] = 1; } if(s.routineId && !last[s.routineId]) last[s.routineId] = s.startedAt; if(s.routineId) cnt[s.routineId] = (cnt[s.routineId] || 0) + 1; });
  [S.active].concat(S.parked || []).forEach(function(w){ if(w && w.routineId && w.exercises.some(function(x){ return x.sets.some(function(q){ return q.done; }); })) prog[w.routineId] = 1; });
  for(var i = 0; i < goal; i++) segs += '<span><i' + (i < n ? ' data-on style="transition-delay:' + (i * 90) + 'ms"' : '') + '></i></span>';
  S.cfg.routines.forEach(function(r){ var c = r.exercises.filter(function(x){ return key(x.name); }).length;
    rows += '<button type="button" class="wrow' + (done[r.id] || prog[r.id] ? " on" : "") + '" data-act="start" data-id="' + esc(r.id) + '" data-rv><span><b class="wn">' + esc(r.name || "Workout") + (done[r.id] && !prog[r.id] ? '<i class="fs" aria-label="done this week"></i>' : '') + '</b><small>' + c + (c === 1 ? " lift" : " lifts") + (last[r.id] ? " · Last " + esc(rel(last[r.id])) : "") + '</small></span>' +
      '<span class="wr">' + (prog[r.id] ? '<span class="wr-q">In progress</span>' : '') + '</span></button>'; });
  var dd = new Date();
  return '<div class="x-of">' + dd.toLocaleDateString("en-US", { weekday:"short", day:"numeric", month:"short" }) + ' · Week ' + isoWeek(dd) + '</div><h1 class="big">Train</h1>' +

/* ---------- a routine already done this week: its record, settled and kept ---------- */

function inProgress(rid){ return [S.active].concat(S.parked || []).some(function(w){ return w && w.routineId === rid && w.exercises.some(function(x){ return x.sets.some(function(q){ return q.done; }); }); }); }

    '<div class="dn-foot" data-rv>Saved. It opens fresh again next week.</div>';

/* ---------- workout: the list of lifts ---------- */

  a.exercises.forEach(function(x, i){ var d = x.sets.filter(function(q){ return q.done; }).length, all = d > 0 && d >= x.sets.length, nx = a.exercises[i + 1]; if(all) dn++; if(d) any = true;

    rows += '<button type="button" class="xrow' + (all ? " done" : "") + '" data-act="ex-open" data-e="' + i + '" data-rv><span><span class="nm">' + esc(x.name) + '</span></span>' +
      (all ? '<span class="okc">' + IC.check + '</span>' : '<span class="ct">' + (d ? '<b>' + d + '</b>' : d) + '/' + x.sets.length + '</span>') + '</button>';

    '<div class="list">' + rows + '</div>' +

/* ---------- exercise: one set in focus ---------- */
function unitLabel(g, u){ return g === "db" ? u + " each dumbbell" : g === "cable" ? u + " on the cable stack" : g === "machine" ? u + " on the machine" : g === "bar" ? u + " in plates and bar" : g === "body" ? u + " added" : u; }
function wStep(){ return S.cfg.units === "kg" ? 2.5 : 5; }
function winTxt(st, u){
  if(st.pr) return '<span class="tag">New best</span>';
  if(!st.prev || !(num(st.prev.r) > 0)) return "";
  var w = num(st.w), r = num(st.r), pw = num(st.prev.w), pr = num(st.prev.r);
  if(w > pw) return '<small>▲ +' + fmtW(w - pw) + ' ' + esc(u) + '</small>';
  if(w === pw && r > pr) return '<small>▲ +' + (r - pr) + (r - pr === 1 ? ' rep' : ' reps') + '</small>';
  return "";
}
function vExercise(){

      '<div class="hwx">' + hw("r", blank(st.r) ? hn.r : st.r, blank(st.r), "v") + '<button type="button" class="hw-b m" data-act="hw-step" data-d="-1" aria-label="Less"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><button type="button" class="hw-b p" data-act="hw-step" data-d="1" aria-label="More"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>' + '</div><div class="hw-u">' + esc((x.repLabel || "reps").toLowerCase()) + (x.target ? " · aim " + esc(x.target) : "") + '</div>' +

    '<span class="rest-b"><button type="button" class="rb x" data-act="rest-cancel" aria-label="Cancel rest">' + IC.x + '</button><button type="button" class="rb" data-act="rest-toggle" aria-label="Start or pause rest">' + IC.play + IC.pause + '</button></span><div class="rest-bar"><i id="rest-b"></i></div></div>';

/* small moments after a re-render: the set you just finished slides into the list, a new best catches the light */
function afterRender(){
  var j = UI.just; UI.just = null; if(!j || calm || view.dataset.v !== "ex") return;
  var row = view.querySelector('.dset[data-s="' + j.s + '"]'), cur = $("#cur");
  if(row) row.animate([{ opacity:0, transform:"translate3d(0,-18px,0)" }, { opacity:1, transform:"none" }], { duration:560, easing:OUT });
  if(cur) [].forEach.call(cur.querySelectorAll(".hw,.lab,.btn"), function(el, i){ el.animate([{ opacity:0, transform:"translate3d(0,22px,0)" }, { opacity:1, transform:"none" }], { duration:520, delay:i * 45, easing:OUT, fill:"backwards" }); });
  if(j.best && row){ var sw = document.createElement("div"); sw.className = "sweep"; row.style.position = "relative"; row.style.overflow = "hidden"; row.appendChild(sw);
    sw.animate([{ transform:"translateX(-130%)" }, { transform:"translateX(130%)" }], { duration:1200, delay:150, easing:"cubic-bezier(.65,0,.35,1)" }).onfinish = function(){ sw.remove(); };
    var tg = row.querySelector(".tag"); if(tg) tg.animate([{ opacity:0, transform:"scale(.6)" }, { opacity:1, transform:"none" }], { duration:600, delay:250, easing:SPRING, fill:"backwards" }); }

function roll(inp, val, dir){
  if(calm){ inp.value = val; return; }
  var d = dir > 0 ? -1 : 1;
  inp.getAnimations().forEach(function(q){ q.cancel(); });
  inp.animate([{ transform:"none", opacity:1 }, { transform:"translate3d(0," + (d * 55) + "%,0)", opacity:0 }], { duration:90, easing:"ease-in" }).onfinish = function(){
    inp.value = val; inp.animate([{ transform:"translate3d(0," + (-d * 55) + "%,0)", opacity:0 }, { transform:"none", opacity:1 }], { duration:300, easing:OUT }); };
}

/* ---------- finish ---------- */
function endCard(s){
  var u = S.cfg.units, prev = null, i; for(i = 0; i < S.sessions.length; i++){ var q = S.sessions[i]; if(q.id !== s.id && q.routineId === s.routineId && q.startedAt < s.startedAt){ prev = q; break; } }
  var ups = 0, lines = s.exercises.map(function(x){ var b = topOf(x.sets), px = prev ? prev.exercises.filter(function(z){ return key(z.name) === key(x.name); })[0] : null, pb = px ? topOf(px.sets) : null, up = !!(pb && b && beats(b.w, b.r, pb)), best = x.sets.some(function(t){ return t.pr; });
    if(up) ups++;
    return '<div class="fs-r"><span>' + esc(x.name) + (best ? '<em class="f-best" aria-label="New best"></em>' : '') + '</span><span>' + (up ? '<span class="dl">' + (b.w > pb.w ? '+' + fmtW(b.w - pb.w) + ' ' + esc(u) : '+' + (b.r - pb.r) + (b.r - pb.r === 1 ? ' rep' : ' reps')) + '</span>' : '') + (b ? (b.w > 0 ? fmtW(b.w) + ' × ' : '') + b.r : '') + '</span></div>'; }).join("");
  var ws = weekStart(Date.now()), n = S.sessions.filter(function(z){ return z.startedAt >= ws; }).length, goal = Math.max(1, +S.cfg.weeklyGoal || 5);
  var el = $("#end"), veil = $("#veil"), meta = [s.dur ? fmtMin(s.dur) : 'Logged for ' + esc(fmtDate(s.startedAt)), s.setCount + (s.setCount === 1 ? " set" : " sets"), n + ' of ' + goal + ' this week'];
  el.innerHTML = '<div class="f-stage" role="img" aria-label="' + esc(s.name) + ', complete"><canvas></canvas></div>' +
    '<div class="f-meta">' + meta.join(', ') + '</div>' +
    '<div class="f-sec"><span>Top sets</span>' + (prev && ups ? '<span>' + ups + ' up on last time</span>' : '') + '</div><div class="e-ls f-ls">' + lines + '</div>' +
    '<div class="stack f-act"><button type="button" class="btn go" data-act="end-done">Done</button><button type="button" class="btn ghost" data-act="end-undo" data-id="' + esc(s.id) + '">Not finished? Back to workout</button></div>' +
    (bkNeed() ? '<div class="bk-n"><p><b>Only on this phone</b>' + (function(f){ return f === 1 ? "1 workout" : f + " workouts"; })(bkNeed()) + ' since your last backup</p><button type="button" data-act="backup-go">Back up</button></div>' : '');
  if(bkNeed()) bkPrep();
  var show = function(){ el.hidden = false; el.scrollTop = 0; render(); finStage(el.querySelector(".f-stage"), s.name); };
  if(calm){ show(); return; }

/* no more teal rings behind History: the shoreline is its piece now */

(function(){
/* the workout list. Every lift is a small ring in the margin; a superset's rings are strung on one fine line.
   A ring fills with soft light when its lift is done. The right side speaks only mid-lift: "2 of 3" */
function rng(t){ return String(t || "").replace(/-/g, "–"); }
function lastOf(x, u){ var p = (x.sets[0] || {}).prev; return p && +p.w > 0 ? "last " + fmtW(+p.w) + " " + u : ""; }
function nDone(x){ return x.sets.filter(function(q){ return q.done; }).length; }
function isDone(x){ var d = nDone(x); return d > 0 && d >= x.sets.length; }
function plan(x, u){ var l = lastOf(x, u); return (x.target ? x.sets.length + ' × ' + esc(rng(x.target)) : x.sets.length + (x.sets.length === 1 ? ' set' : ' sets')) + (l ? ', ' + l : ''); }
function mark(x){ var d = nDone(x); return !isDone(x) && d ? '<span class="ct">' + d + ' of ' + x.sets.length + '</span>' : ''; }
/* about 45 seconds a set, and a rest after each set, except between lifts of a superset */
function mins(ex){ var s = 0; ex.forEach(function(x){ s += x.sets.length * (45 + (x.link ? 0 : (x.rest || 150))); }); return Math.max(5, Math.round(s / 300) * 5); }
vWorkout = function(){

  function line(cls, k, extra){ var x = ex[k], st = isDone(x) ? ' done' : nDone(x) ? ' on' : '';

  for(var i = 0; i < ex.length; i++){

    '<div class="list sx">' + rows + '</div>' +
    '<div class="foot" data-rv><button type="button" data-act="add-ex-open">+ Add a lift</button></div>' +
    '<div class="stack" data-rv><button type="button" class="btn ' + (any ? "go" : "tl") + '" data-act="finish">Finish workout</button><button type="button" class="btn ghost" data-act="cancel">Cancel workout</button></div>';

(function(){
var _vE = vExercise;
vExercise = function(){

/* a superset flows on its own: Complete set on one lift carries you straight to the next lift of the pair;
   on the last, it brings you back to the list. No pause: the set is logged and the page moves on the same tap, with the app's usual transition */
(function(){
var _cs = completeSet;
completeSet = function(ei, si){
  var a = S.active, x = a && a.exercises[ei]; if(!x || !x.sets[si] || x.sets[si].done) return _cs(ei, si);
  var grp = groupOf(a, ei); if(grp.length < 2) return _cs(ei, si);

/* going up: when every set last time reached the top of the range at one weight, today starts one step heavier.
   It is only an opening offer: one tap on minus puts it back, and once a set is logged the app follows what was actually lifted */
function upFor(x){
  if(!x || !x.target) return null; var m = String(x.target).match(/(\d+)\s*[-–]\s*(\d+)/), one = String(x.target).match(/\d+/); if(!m && !one) return null;

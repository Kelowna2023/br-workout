<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BR">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column (max 560px), bottom tab bar; a full-screen ring timer takes over during rest.
   One visual world, dark by choice: graphite, off-white, a single champagne accent, Oswald throughout. */
:root{
  color-scheme: dark;
  --iron:#0e0f11;      /* ground */
  --rack:#17181b;      /* cards */
  --knurl:#2a2b2f;     /* lines, raised controls */
  --chalk:#ece9e2;     /* text */
  --dust:#a39f95;      /* secondary text */
  --plate:#9d6bff;     /* accent: violet */
  --done:#9d6bff;      /* completed set */
  --gold:#ece9e2;      /* record pill, toast */
  --danger:#e8857a;    /* destructive actions, offline */
  --p-red:#e5483b; --p-blue:#3b7fe0; --p-yellow:#e9c23a; --p-green:#3fae6a; --p-grey:#7c838e;
  --display:Oswald,"Arial Narrow",Arial,sans-serif;
  --body:Oswald,"Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:#0e0f11}
body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.top{padding-top:calc(12px + env(safe-area-inset-top))!important}
.tabs{padding-bottom:calc(14px + env(safe-area-inset-bottom))!important}
#intro,#restfull{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sheet .panel{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}
html,body{height:100%;margin:0}
body{background:var(--iron);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--plate)}
.brand i{font-style:normal;color:var(--plate)}
.sync{font-size:12px;color:var(--dust);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--p-grey)}
.sync[data-s="cloud"]::before{background:var(--done)}
.sync[data-s="syncing"]::before{background:var(--gold)}
.sync[data-s="offline"]::before{background:var(--danger)}
main{flex:1;overflow-y:auto;padding:8px 16px 56px;display:flex;flex-direction:column;gap:16px}
.tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--knurl);background:var(--iron);padding:0 8px 14px}
.tabs::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:36px;margin-bottom:1px;pointer-events:none;background:linear-gradient(rgba(14,15,17,0),#0e0f11)}
main>*{flex:none}
.tabs a{min-width:0;overflow:hidden;padding:18px 2px 16px;text-align:center;text-decoration:none;color:var(--dust);font-family:var(--display);font-weight:600;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--plate);border-top-color:var(--plate)}

/* knurling strip: the crosshatch grip pattern on a barbell */
.knurl{height:1px;background:var(--knurl)}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;text-wrap:balance;line-height:.95}
h2{font-size:26px;font-weight:600;letter-spacing:.03em}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--dust)}
.muted{color:var(--dust)}
.num{font-variant-numeric:tabular-nums}

.hero{display:flex;flex-direction:column;gap:12px;padding:4px 0 0}
.hero h1{overflow-wrap:anywhere;font-size:clamp(48px,15vw,84px);font-weight:600;letter-spacing:-.01em;margin-left:-3px}
.hero .focus{font-size:17px;color:var(--dust)}
.btn{border:0;border-radius:10px;padding:14px 18px;background:var(--knurl);font-weight:600;font-size:16px;min-height:48px}
.btn.go{background:var(--plate);color:#17130a;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px}
.btn.ghost{background:transparent;border:1px solid var(--knurl)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--knurl);border:1px solid var(--knurl);border-radius:12px;overflow:hidden}
.strip div{background:var(--rack);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1}
.strip span{font-size:12px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--rack);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rt{display:flex;align-items:center;gap:12px}
.ss{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--plate);padding-left:10px}
.lk{grid-column:1;flex-direction:row!important;align-items:center;gap:10px!important;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;min-height:44px}
.lk input{width:22px;height:22px;accent-color:var(--plate)}
select.field{appearance:auto}
.card.restday{background:transparent;border:1px dashed var(--knurl)}
.card.restday .disc,.card.restday .t b{color:var(--dust)}
.disc{flex:none;width:44px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600;font-size:20px;color:var(--plate);font-variant-numeric:tabular-nums}
.rt .t{flex:1;min-width:0}
.rt .t b{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.05;overflow-wrap:anywhere}
.rt .t span{font-size:14px;color:var(--dust)}

/* workout */
.wk-head{position:sticky;top:-8px;z-index:3;background:var(--iron);padding:8px 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--knurl)}
.wk-head .t{flex:1;min-width:0}
.wk-head h2{overflow-wrap:anywhere}
#elapsed{font-family:var(--display);font-weight:600;font-size:22px;color:var(--dust)}
.ex h3{font-size:25px;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.ex .meta{font-size:13px;color:var(--dust);display:flex;gap:12px;flex-wrap:wrap}
.ex .exh{margin:0;font-size:inherit}
.exhead{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;align-items:center;gap:12px;width:100%;min-height:44px;padding:2px 0;background:transparent;border:0;text-align:left;color:inherit}
.exhead .exn{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.exhead .exc{font-size:15px;color:var(--dust);letter-spacing:.06em;font-variant-numeric:tabular-nums;display:flex;align-items:center}
.exhead .exc svg{width:20px;height:20px;stroke:var(--plate);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.exhead .chev{width:18px;height:18px;stroke:var(--dust);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.exhead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.card.ex.shut{padding:8px 14px}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.sethead{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px 48px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.1em}
.sethead span:nth-child(n+2){text-align:center}
.set .n{font-family:var(--display);font-weight:600;font-size:20px;color:var(--dust);text-align:center}
.set .prev{font-size:14px;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);text-align:center;font-family:var(--display);font-weight:600;font-size:24px;padding:0 4px}
.set .wbtn{width:100%;height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);color:inherit;text-align:center;font-family:var(--display);font-weight:600;font-size:24px;padding:0 4px;font-variant-numeric:tabular-nums}
.set .wbtn.empty{color:var(--dust)}
.set.done .wbtn{background:rgba(157,107,255,.1);border-color:transparent}
.set .nbtn{height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;display:grid;place-items:center;color:var(--dust)}
.set .nbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.set .nbtn.has{background:var(--plate);border-color:var(--plate);color:#17130a}
.set .nbtn[aria-expanded="true"]{background:transparent;color:var(--plate);border-color:var(--plate)}
.setsub{font-size:13px;color:var(--dust);padding-left:34px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setnote{padding-left:34px}
.setnote textarea{margin-top:0}
#pl-w{height:72px;font-family:var(--display);font-weight:600;font-size:48px;text-align:center}
.set .chk{height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;display:grid;place-items:center}
.set .chk svg{width:22px;height:22px;stroke:var(--dust);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.done input{background:rgba(157,107,255,.1);border-color:transparent}
.set.done .chk{background:var(--done);border-color:var(--done)}
.set.done .chk svg{stroke:#17130a}
.set.done .n{color:var(--done)}
.set.pr .n{color:var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--gold);color:#221a03}
.field{height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);padding:0 12px;min-width:0;width:100%}

.field.note{height:40px;font-size:14px;border-style:dashed;color:var(--chalk)}
textarea.field{height:auto;padding:10px 12px;resize:vertical;font-size:16px;text-transform:none;letter-spacing:0;margin-top:4px;display:block}
.up{font-size:13px;font-weight:600;color:var(--done)}
.notebox{font-size:14px;color:var(--dust);border-left:3px solid var(--knurl);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.gbar{height:8px;border-radius:4px;background:var(--iron);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--plate);border-radius:4px}
.goal .pct{font-family:var(--display);font-weight:600;font-size:26px}
.goal .t b{font-size:22px}
label.eyebrow{display:flex;flex-direction:column;gap:4px}
.mm{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:center;padding:6px 0 2px}
.mm svg{display:block;width:100%;height:auto;overflow:visible}
.mm-n *{fill:#212328;stroke:#40434a;stroke-width:.5}
.mm-b{fill:#2d2f35;stroke:#4a4d54;stroke-width:.5;stroke-linejoin:round}
.mm-s{fill:rgba(157,107,255,.34);stroke:rgba(157,107,255,.7);stroke-width:.5;stroke-linejoin:round}
.mm-p{fill:#9d6bff;stroke:#cdb8ff;stroke-width:.5;stroke-linejoin:round;filter:drop-shadow(0 0 2.4px rgba(157,107,255,.75))}
.mm-t{display:flex;flex-direction:column;gap:12px;min-width:0}
.mm-t div{display:flex;flex-direction:column;gap:2px}
.mm-t b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;color:var(--plate)}
.mm-t span:not(.eyebrow){font-size:15px;color:var(--chalk)}
.mm-t .eyebrow{font-size:11px}
/* rest dock */
#rest{margin:0 12px 10px;border-radius:12px;background:var(--rack);border:1px solid var(--plate);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
#rest[hidden]{display:none}
#rest .r1{display:flex;align-items:center;gap:8px}
#rest .lab{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dust)}
#rest .time{font-family:var(--display);font-weight:600;font-size:40px;line-height:1}
#rest button{border:1px solid var(--knurl);border-radius:8px;background:transparent;color:inherit;min-height:44px;padding:0 12px;font-weight:500}
#rest .bar{height:3px;border-radius:2px;background:var(--knurl);overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--plate);width:0}
#rest.go{background:var(--plate);color:#17130a}
#rest.go .lab{color:#17130a}

/* full-screen rest timer */
#restfull{position:absolute;inset:0;z-index:5;background:var(--iron);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:22px;padding:24px;overflow-y:auto}
#restfull[hidden]{display:none}
#restfull .ring{display:grid;place-items:center}
#restfull .ring svg{grid-area:1/1;width:min(72vw,300px);height:auto}
#restfull .ring .txt{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:4px}
#rf-time{font-family:var(--display);font-weight:600;font-size:clamp(64px,22vw,96px);line-height:.95}
#rf-lab{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}
#rf-of{font-size:14px;color:var(--dust)}
#rf-next{text-align:center;font-size:17px}
#rf-next small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin-bottom:4px}
#restfull.go #rf-time{color:var(--plate)}

/* history / progress */
details.card summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
details.card summary::-webkit-details-marker{display:none}
.hs b{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.hs .meta{font-size:14px;color:var(--dust);display:flex;gap:12px;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:6px;font-size:15px}
.lines div{display:flex;gap:10px;justify-content:space-between}
.lines div span:last-child{color:var(--dust);text-align:right}
.chart{background:var(--rack);border-radius:12px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--knurl)}
th{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.empty{color:var(--dust);padding:18px 0}

/* routine editor */
.exedit{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;padding:10px 0;border-top:1px solid var(--knurl)}
.exedit .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1}
.exedit label{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;gap:3px}
.exedit .x{grid-row:1 / span 2;grid-column:2;align-self:start}
.iconbtn{width:44px;height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;color:var(--dust);font-size:20px}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--knurl);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 18px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--plate);color:#17130a}

/* cinematic layer: grain over everything, lit hero, week strip */
#grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:160px 160px}
.hero.cine{position:relative;margin:-8px -16px 0;padding:30px 16px 22px;gap:14px;border-top:1px solid #000;border-bottom:1px solid var(--knurl);
  background:radial-gradient(120% 90% at 12% 0%,rgba(157,107,255,.2),rgba(157,107,255,0) 62%),radial-gradient(90% 70% at 100% 100%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%),var(--iron)}
.hero.cine h1{font-size:clamp(52px,17vw,96px);letter-spacing:.01em;text-shadow:0 0 42px rgba(157,107,255,.22)}
.hero.cine .eyebrow{color:var(--plate);letter-spacing:.42em}
.hero.cine .rule{height:1px;background:linear-gradient(90deg,var(--plate),rgba(157,107,255,0));transform-origin:left}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd .l{font-size:12px;letter-spacing:.14em;color:var(--dust)}
.wd .c{width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid var(--knurl);font-size:15px;color:var(--dust);font-variant-numeric:tabular-nums}
.wd .c svg{width:18px;height:18px;stroke:#17130a;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wd.done .c{background:var(--plate);border-color:var(--plate)}
.wd.today .c{border-color:var(--plate);color:var(--chalk);box-shadow:0 0 0 3px rgba(157,107,255,.18)}
.wd.today .l{color:var(--plate)}
.wd.rest .c{border-style:dashed;font-size:11px;letter-spacing:.04em}
.wd.missed .c{opacity:.45}
.textlink{color:var(--dust);text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:12px 0}

/* opening title card */
#intro[hidden],#wipe[hidden]{display:none}
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;background:#000;opacity:0}
#wipe i{display:none}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:var(--rack);padding:14px;min-height:72px;color:inherit;font:inherit}
.day .d{display:flex;flex-direction:column;gap:2px;font-family:var(--display)}
.day .d b{font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--plate);line-height:1}
.day .d span{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.day .n{min-width:0;display:flex;flex-direction:column;gap:2px}
.day .n b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.day .n span{font-size:14px;color:var(--dust)}
.day .s{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);display:flex;align-items:center}
.day .s svg{width:22px;height:22px;stroke:var(--plate);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.day.today{border-color:var(--plate);background:radial-gradient(120% 140% at 0% 0%,rgba(157,107,255,.18),rgba(157,107,255,0) 60%),var(--rack);box-shadow:0 0 28px rgba(157,107,255,.12)}
.day.today .s{color:var(--plate)}
.day.off{background:transparent;border:1px dashed var(--knurl)}
.day.off .d b,.day.off .n b{color:var(--dust)}
.pick h1{font-size:clamp(44px,14vw,76px);font-weight:600;text-shadow:0 0 42px rgba(157,107,255,.2)}
.pick .eyebrow{color:var(--plate);letter-spacing:.42em}
#intro{position:absolute;inset:0;z-index:30;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(90% 60% at 50% 45%,rgba(157,107,255,.2),rgba(157,107,255,0) 70%),#0e0f11}
#intro .bar{position:absolute;left:0;right:0;height:50%;background:#000}
#intro .bar.t{top:0}#intro .bar.b{bottom:0}
#intro .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 20px;text-align:center}
.brmark{width:min(46vw,190px);height:auto;overflow:visible;margin-bottom:10px}
.brmark .m-p{fill:var(--plate)}
.brmark .m-all{filter:drop-shadow(0 0 14px rgba(157,107,255,.35))}
#intro .i-day{white-space:nowrap;font-size:14px;font-weight:500;letter-spacing:.5em;text-transform:uppercase;color:var(--plate);padding-left:.5em}
#intro .i-line{width:min(60vw,240px);height:1px;background:var(--plate)}
#intro .i-title{font-family:var(--display);font-weight:600;font-size:clamp(40px,13vw,76px);line-height:.95;text-transform:uppercase;text-shadow:0 0 60px rgba(157,107,255,.35);overflow-wrap:anywhere}
#intro .i-sub{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dust);padding-left:.3em}
#intro .bar{display:none}
#intro::after{content:"";position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#intro .btn.go{margin-top:22px;min-width:min(74vw,300px);font-size:26px;letter-spacing:.1em;box-shadow:0 0 44px rgba(157,107,255,.28)}
@media (prefers-reduced-motion:no-preference){
  #intro::after{animation:i-open 1.2s ease-out both}
  @keyframes i-open{from{opacity:1}to{opacity:0}}
  #intro .btn.go{animation:rise .7s cubic-bezier(.2,.7,.2,1) 2.8s both}
  #wipe.run{animation:wipe .85s ease-in-out both}
  @keyframes wipe{0%{opacity:0}42%{opacity:1}56%{opacity:1}100%{opacity:0}}
  main.enter .day{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
  main.enter .day:nth-child(1){animation-delay:.36s}main.enter .day:nth-child(2){animation-delay:.42s}main.enter .day:nth-child(3){animation-delay:.48s}main.enter .day:nth-child(4){animation-delay:.54s}main.enter .day:nth-child(5){animation-delay:.6s}main.enter .day:nth-child(6){animation-delay:.66s}main.enter .day:nth-child(7){animation-delay:.72s}
  .brmark .m-p{animation:m-in .6s cubic-bezier(.16,.9,.2,1) both}
  .brmark .m-1{--mx:0px;--my:-46px;animation-delay:.35s}
  .brmark .m-2{--mx:54px;--my:0px;animation-delay:.55s}
  .brmark .m-3{--mx:54px;--my:0px;animation-delay:.7s}
  .brmark .m-4{--mx:0px;--my:46px;animation-delay:.85s}
  .brmark .m-5{--mx:54px;--my:0px;animation-delay:1.05s}
  .brmark .m-6{--mx:30px;--my:40px;animation-delay:1.2s}
  .brmark .m-all{animation:m-lock 1.3s ease-out 1.75s both}
  @keyframes m-in{from{opacity:0;transform:translate(var(--mx),var(--my))}to{opacity:1;transform:none}}
  @keyframes m-lock{0%{filter:drop-shadow(0 0 0 rgba(157,107,255,0))}25%{filter:drop-shadow(0 0 30px rgba(205,184,255,1))}100%{filter:drop-shadow(0 0 14px rgba(157,107,255,.35))}}
  #intro .i-day{animation:i-day 1s ease-out 1.9s both}
  #intro .i-line{animation:i-line .7s cubic-bezier(.7,0,.2,1) 2.1s both}
  #intro .i-title{animation:i-title 1.3s cubic-bezier(.2,.7,.2,1) 2.2s both}
  #intro .i-sub{animation:i-fade .6s ease-out 2.6s both}
  @keyframes i-day{from{opacity:0;letter-spacing:1.4em}to{opacity:1;letter-spacing:.5em}}
  @keyframes i-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes i-title{from{opacity:0;filter:blur(14px);transform:scale(1.14)}to{opacity:1;filter:blur(0);transform:scale(1)}}
  @keyframes i-fade{from{opacity:0}to{opacity:1}}
  main.enter>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
  main.enter>*:nth-child(2){animation-delay:.08s}main.enter>*:nth-child(3){animation-delay:.16s}main.enter>*:nth-child(4){animation-delay:.24s}main.enter>*:nth-child(n+5){animation-delay:.32s}
  main.enter .hero.cine .rule{animation:i-line .9s cubic-bezier(.7,0,.2,1) .2s both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
}

/* sheet */
#sheet{position:absolute;inset:0;z-index:10;background:rgba(6,8,10,.72);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
#sheet .panel{width:100%;max-height:92%;overflow-y:auto;background:var(--rack);border-radius:18px 18px 0 0;padding:20px 16px 24px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--display);font-weight:600;font-size:64px;line-height:.9;text-transform:uppercase}
.bar-draw{display:flex;align-items:center;justify-content:center;height:120px;overflow-x:auto;padding:0 8px}
.bar-draw .sleeve{height:14px;width:22px;background:#8a919c;border-radius:0 3px 3px 0;flex:none}
.bar-draw .sleeve.l{border-radius:3px 0 0 3px}
.bar-draw .collar{margin-right:2px}.bar-draw .collar.r{margin-right:2px;margin-left:0}
.plbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.plbtns .btn{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:600;min-height:56px}
.plbtns .dot{width:12px;height:12px;border-radius:50%}
.bar-draw .shaft{height:8px;width:64px;background:#8a919c;flex:none}
.bar-draw .collar{height:26px;width:8px;background:#aab0ba;flex:none}
.bar-draw .pl{flex:none;border-radius:4px;margin-right:2px;background:var(--c);display:grid;place-items:center;font-size:10px;font-weight:700;color:rgba(0,0,0,.7);writing-mode:vertical-rl}
#toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:20;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--chalk);color:#17130a;font-weight:700;padding:10px 16px;border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:no-preference){
  #toast div{animation:pop .25s ease-out}
  .set.done .chk{animation:pop .2s ease-out}
  @keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
}

/* ---- ledger redesign: poster header over a ruled ledger; square edges, one accent ---- */
:root{--iron:#0b0b0c;--rack:#0b0b0c;--knurl:rgba(236,233,226,.2);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--poster:Anton,Impact,'Arial Narrow',sans-serif;--ink:#0b0b0c}
#grain,.top{display:none}
.mono,.eyebrow{font-family:var(--mono);font-weight:400;font-size:11px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase}
.eyebrow{color:var(--dust)}
main{padding:env(safe-area-inset-top) 16px 40px}
main[data-v="today"]{gap:0}
.tabs{display:flex;justify-content:space-between;background:var(--iron);border-top:1px solid var(--chalk);padding:0 8px 14px}
.tabs::before{display:none}
.tabs a{flex:none;font:400 11px var(--mono);letter-spacing:.08em;color:var(--chalk);border:0;margin:0;padding:18px 8px 12px;overflow:visible}
.tabs a[aria-current="page"]{color:var(--plate);border:0}
.tabs a[aria-current="page"]::before{content:"[ "}.tabs a[aria-current="page"]::after{content:" ]"}
.hd{padding:14px 0 0}
.hd.sub{padding-top:20px}
.fit{display:block;white-space:nowrap;line-height:.9;padding-top:.08em;text-transform:uppercase;font-family:var(--poster);font-weight:400;font-size:64px;letter-spacing:0;color:var(--chalk)}
.bar{display:flex;align-items:center;justify-content:space-between;width:100%;height:66px;margin-top:12px;padding:0 14px;border:0;border-radius:0;background:var(--plate);color:var(--ink);font:400 30px/1 var(--poster);letter-spacing:.04em;text-transform:uppercase}
.bar.ghost{background:transparent;color:var(--chalk);border:1px solid var(--chalk);font-size:22px}
.rule{border-top:1px solid var(--chalk);margin:14px -16px 0}
.ledger{margin:0 -16px;display:flex;flex-direction:column}
.tr{display:grid;grid-template-columns:34px 46px minmax(0,1fr) auto;align-items:center;width:100%;min-height:52px;padding:6px 16px;border:0;border-bottom:1px solid var(--knurl);border-radius:0;background:transparent;color:var(--chalk);text-align:left;font:500 19px/1.05 Oswald,'Arial Narrow',sans-serif;letter-spacing:.03em;text-transform:uppercase}
.tr .mono{color:var(--dust)}
.tr .nm{overflow-wrap:anywhere;padding-right:8px}
.tr.off{color:var(--dust)}
.tr.now{background:var(--chalk);color:var(--ink)}.tr.now .mono{color:var(--ink)}
.tr.fin .nm,.tr.fin .mono:last-child{color:var(--plate)}
.cells{display:grid;grid-template-columns:repeat(3,1fr);margin:0 -16px;border-bottom:1px solid var(--chalk)}
.cells span{padding:14px 16px;border-right:1px solid var(--knurl);color:var(--dust);display:flex;flex-direction:column;gap:6px}
.cells span:last-child{border-right:0}
.cells b{font:700 26px/1 Oswald,'Arial Narrow',sans-serif;color:var(--chalk);letter-spacing:0}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.links button,.links a{background:none;border:0;border-radius:0;color:var(--chalk);font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:none;padding:16px 0;min-height:44px}
.links .danger{color:var(--danger)}
.act{margin:0 -16px;padding:12px 16px 0;border-bottom:1px solid var(--chalk);display:flex;flex-direction:column}
.act .row2{display:flex;justify-content:space-between;gap:12px;color:var(--plate)}
.act .up{color:var(--plate);margin-top:6px}
.nums{display:grid;grid-template-columns:auto 26px minmax(0,1fr);align-items:end;margin-top:14px}
.nums .mono{color:var(--dust);display:block;margin-bottom:6px}
.nums i{font:400 30px/1 Oswald,'Arial Narrow',sans-serif;font-style:normal;color:var(--dust);padding-bottom:14px;text-align:center}
.nums .big{display:block;font:700 136px/.82 Oswald,'Arial Narrow',sans-serif;letter-spacing:-.03em;color:var(--chalk);background:transparent;border:0;border-radius:0;padding:0;margin:0;height:114px;text-align:left;font-variant-numeric:tabular-nums}
.nums .big.empty,.nums.dim .big{color:var(--dust)}
.sq{display:flex;gap:6px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
.sq .b{width:26px;height:26px;border:1px solid var(--chalk);background:transparent;padding:0;border-radius:0}
.sq .b.f{background:var(--plate);border-color:var(--plate)}
.sq .mono{margin-left:8px}
.sq .nb{margin-left:auto;background:none;border:0;color:var(--dust);min-height:44px;padding:0 0 0 12px}
.sq .nb.has{color:var(--plate)}
.act .info{color:var(--dust);padding:2px 0 12px;line-height:1.8}
.act .info b{font-weight:400;color:var(--plate)}
.slab{display:flex;justify-content:space-between;align-items:center;width:calc(100% + 32px);margin:0 -16px;height:74px;padding:0 16px;border:0;border-radius:0;background:var(--plate);color:var(--ink);font:700 34px/1 Oswald,'Arial Narrow',sans-serif;letter-spacing:.02em;text-transform:uppercase}
.slab.ghost{background:transparent;color:var(--chalk);border-top:1px solid var(--chalk)}
.act .setnote{padding:0 0 12px}
.act .field.note{margin-top:14px}
.wk-foot{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.card{background:transparent;border-radius:0;padding:14px 0;border-bottom:1px solid var(--knurl)}
.list{gap:0}
.card.restday{border:0;border-bottom:1px solid var(--knurl)}
.btn{border-radius:0;background:transparent;border:1px solid var(--chalk);font:500 15px/1 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.btn.go{background:var(--plate);border:0;color:var(--ink);font:400 24px/1 var(--poster);letter-spacing:.04em;box-shadow:none}
.btn.ghost{border-color:var(--knurl)}
.btn.small{font-size:13px}
.field,.set input,#pl-w,.iconbtn,.seg,.pill,.chart,.gbar,.gbar i,.strip{border-radius:0}
.field{background:transparent;border:1px solid var(--knurl)}
.strip{border:1px solid var(--chalk);background:transparent;gap:0}
.strip div{background:transparent;border-right:1px solid var(--knurl)}
.strip div:last-child{border-right:0}
.strip span{font-family:var(--mono)}
.seg{border-color:var(--chalk)}
.seg button{border-radius:0}
.seg button[aria-pressed="true"]{background:var(--plate);color:var(--ink)}
.pill{font-family:var(--mono);background:var(--plate);color:var(--ink)}
.chart{background:transparent;border:1px solid var(--knurl)}
.disc{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--dust);letter-spacing:.08em}
.syncline{color:var(--dust);padding-top:6px}
#sheet .panel{border-radius:0;border-top:1px solid var(--chalk);background:var(--iron)}
#toast div{border-radius:0;font:400 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--chalk);color:var(--ink);box-shadow:none}
#rest{margin:0;border-radius:0;border:0;border-top:1px solid var(--plate);background:var(--iron)}
#rest button{border-radius:0}
#rest.go{background:var(--plate);color:var(--ink)}
#restfull{background:var(--iron);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);justify-content:flex-start;gap:0}
.rtop{display:flex;justify-content:space-between;padding:18px 16px 14px;border-bottom:1px solid var(--chalk)}
#rf-time{font:400 clamp(120px,50vw,230px)/.86 var(--poster);color:var(--plate);padding:24px 14px 0;white-space:nowrap;font-variant-numeric:tabular-nums}
#restfull.go #rf-time{color:var(--chalk)}
#rf-lab,#rf-of{font:400 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--chalk)}
.rtrack{height:14px;border:1px solid var(--chalk);margin:20px 16px 0}
.rtrack i{display:block;height:100%;width:0;background:var(--plate)}
.rbtns{display:grid;grid-template-columns:1fr 1fr 1.4fr;border-top:1px solid var(--chalk);border-bottom:1px solid var(--chalk);margin-top:22px}
.rbtns button{height:66px;background:transparent;border:0;border-right:1px solid var(--chalk);border-radius:0;color:var(--chalk);font:500 22px/1 Oswald,'Arial Narrow',sans-serif;letter-spacing:.04em;text-transform:uppercase}
.rbtns button:last-child{border-right:0;background:var(--chalk);color:var(--ink);font-weight:700}
#rf-next{padding:22px 16px 0;font-size:inherit;display:flex;flex-direction:column;gap:8px;text-align:left}
#rf-next b{font:500 26px/1.1 Oswald,'Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em}
#rf-next .mono{color:var(--dust)}
.rmin{margin:auto 16px 26px;background:none;border:0;color:var(--dust);min-height:44px;text-align:left}
#intro{background:var(--iron)}
#intro .i-day{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.3em}
#intro .i-title{font-family:var(--poster);font-weight:400;text-shadow:none;letter-spacing:.01em}
#intro .i-sub{font-family:var(--mono);font-size:11px}
#intro .btn.go{border-radius:0;box-shadow:none;font-size:28px}
.mono-num{font-variant-numeric:tabular-nums}

/* ---- calm pass: only what is needed while lifting, with room around it ---- */
.act2{margin:0 -16px;padding:40px 16px 34px;display:flex;flex-direction:column;border-bottom:1px solid var(--chalk)}
.act2.sub{padding-top:30px}
.ss2{color:var(--plate);margin-bottom:12px}
.xh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.xn{margin:0;font-family:var(--poster);font-weight:400;line-height:1.02;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;text-wrap:balance;color:var(--chalk)}
.more{flex:none;background:none;border:0;border-radius:0;color:var(--dust);font:700 22px/1 Oswald,'Arial Narrow',sans-serif;letter-spacing:.12em;min-width:44px;min-height:44px;margin:-8px -10px 0 0}
.xt{color:var(--dust);margin-top:12px}
.act2 .nums{margin-top:40px}
.act2 .nums .big{height:auto;line-height:.9}
.act2 .nums input.big{height:.9em}
.act2 .nums label,.act2 .nums>div{display:flex;flex-direction:column;justify-content:flex-end}
.act2 .nums i{font-size:22px;padding-bottom:8px}
.act2 .sq{margin:30px 0 0}
.act2 .setnote{padding:14px 0 0}
.logbtn{display:flex;align-items:center;justify-content:space-between;width:100%;height:52px;margin-top:30px;padding:0 16px;border:0;border-radius:0;background:var(--plate);color:var(--ink);font:400 20px/1 var(--poster);letter-spacing:.06em;text-transform:uppercase}
.logbtn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--knurl)}
main[data-v="today"] .tr{min-height:50px}
.wk-foot{gap:6px;padding-top:28px}
.wk-foot .logbtn{margin-top:0}
#intro .btn.go{background:var(--chalk);color:var(--ink)}

/* ---- home is the list of workouts, nothing else ---- */
.pk{color:var(--dust);padding:44px 0 18px}
.wr{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:100%;padding:26px 16px;border:0;border-bottom:1px solid var(--knurl);border-radius:0;background:transparent;color:var(--chalk);text-align:left}
.wr:first-child{border-top:1px solid var(--knurl)}
.wr .wn{font:400 30px/1.02 var(--poster);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere;min-width:0}
.wr .mono{flex:none;color:var(--dust)}
.wr .mono.hi{color:var(--plate)}
.wr.today .wn{color:var(--plate)}
.back{display:block;position:relative;z-index:2;background:none;border:0;border-radius:0;color:var(--dust);text-align:left;min-height:44px;padding:22px 0 0;margin:0}
#intro .btn.go{background:var(--plate);color:var(--ink)}

/* ---- tap a workout and go; several can be in progress; back to the welcome ---- */
.pk{display:flex;align-items:center;justify-content:space-between;padding:30px 0 10px}
.pk .back{padding:0;min-height:44px;min-width:88px;margin:0}
#intro.quick *,#intro.quick::after{animation:none!important}

/* ---- sections live at the top; the list is names only ---- */
.tabs{order:-1;border-top:0;border-bottom:1px solid var(--knurl);padding:env(safe-area-inset-top) 8px 0!important}
.tabs a{padding:20px 8px 16px;font-size:12px;letter-spacing:.1em;color:var(--dust)}
.tabs a[aria-current="page"]{color:var(--chalk);box-shadow:inset 0 -2px 0 var(--plate)}
.tabs a[aria-current="page"]::before,.tabs a[aria-current="page"]::after{content:none}
main{padding-top:0;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.pk{padding:14px 0 6px}
.wr{padding:28px 16px}
.wr .wn{font-size:32px}

main:not([data-v="today"]){padding-top:24px}

/* ---- a workout opens as a plain list of its exercises; one expands only when tapped ---- */
.back + .ledger{margin-top:18px;border-top:1px solid var(--knurl)}

/* ---- an open exercise is a table of sets: reps, weight, log ---- */
.st{margin-top:28px;display:flex;flex-direction:column;gap:10px}
.sr{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1.15fr) 36px 64px;gap:8px;align-items:center}
.sr.hdr{color:var(--dust);margin-bottom:-2px}
.sr.hdr span:nth-child(2),.sr.hdr span:nth-child(3){text-align:center}
.sn{color:var(--dust)}
.si{height:56px;width:100%;min-width:0;margin:0;padding:0;border:1px solid var(--knurl);border-radius:0;background:transparent;color:var(--chalk);text-align:center;font:500 28px/1 Oswald,'Arial Narrow',sans-serif;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}

.tabs a{font:500 11px/1 var(--mono)!important;letter-spacing:.14em!important;text-transform:uppercase;color:#5f5d59!important;padding:24px 4px 18px!important}

h2{font:500 20px/1.1 var(--display);letter-spacing:.02em}

.links a[href="#routines"]{color:var(--dust)}

.pk{padding:18px 0 4px}
.ledger,.back + .ledger{margin:8px calc(-1*var(--g)) 0;border:0!important}

.wr .wn{font:500 26px/1.05 var(--display)!important;letter-spacing:.01em}
main[data-v="today"] > .links{padding-top:28px}

.tr{grid-template-columns:30px 0 minmax(0,1fr) auto!important;column-gap:0;min-height:0!important;padding:16px var(--g)!important;border:0!important;font:500 18px/1.15 var(--display);letter-spacing:.01em}

.tr.fin .nm{color:var(--dust)!important}.tr.fin .mono:last-child{color:var(--plate)!important}

.act2{margin:0 calc(-1*var(--g));padding:28px var(--g) 36px;border:0!important}
.xn{font:500 30px/1.02 var(--display)!important;letter-spacing:.01em}
.xt{margin-top:10px}
.more{font:400 20px/1 var(--body);letter-spacing:.1em;color:#5f5d59}
.st{margin-top:34px;gap:2px}
.sr{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 30px 60px;gap:12px}

.sr.done .si{color:#5f5d59}
.ck{height:44px;border:1px solid var(--knurl)!important;background:transparent!important;color:var(--dust)!important;font:500 13px/1 var(--body)!important;letter-spacing:0!important;text-transform:none}
.sr.cur .ck{border-color:var(--plate)!important;color:var(--plate)!important}
.sr.done .ck{border:0!important;color:var(--plate)!important;font:400 20px/1 var(--body)!important}
.nt{color:#3d3c39}
.sl{padding-top:26px}
.wk-foot{padding-top:36px;gap:4px}
.logbtn{height:52px;background:transparent;color:var(--chalk);border:1px solid var(--knurl);font:500 15px/1 var(--body);letter-spacing:0;text-transform:none}
.logbtn.ghost{border-color:var(--knurl)}
/* rest strip */
#rest{border-top:1px solid var(--hair)!important;padding:12px var(--g) 14px}
#rest .lab{font:400 12px/1 var(--body);letter-spacing:0;text-transform:none}

/* sheets */
#sheet .panel{border-top:0;padding:26px var(--g) calc(26px + env(safe-area-inset-bottom))!important;gap:18px}

.seg{border:0;gap:4px}
.seg button{border:1px solid var(--knurl);font:500 13px/1 var(--body);min-height:40px}

.stk-t{border-color:var(--hair)}
.gearsw button{border-color:var(--hair);font:500 13px/1 var(--body);letter-spacing:0;text-transform:none}
/* history + progress */
.cal{gap:4px}
.cal b{font:400 15px/1 var(--display)}
.card,.card.restday{border:0!important;padding:16px 0}
.hs b{font:500 18px/1.1 var(--display)}
.hs .meta{font:400 13px/1.4 var(--body)}
.cells{margin:0 calc(-1*var(--g));padding:0 var(--g);border:0!important;gap:20px}
.cells span{border:0!important;padding:0}
.cells b{font:400 28px/1 var(--display)}
.ph-strip{margin:0 calc(-1*var(--g));padding:0 var(--g) 6px}
.strip,.strip div,.chart{border:0!important}
.addp{font:400 13px/1 var(--body);letter-spacing:0;text-transform:none}
.rt .t b{font:500 20px/1.1 var(--display)}
.disc{font:400 13px/1 var(--body);letter-spacing:0;text-transform:none}
.exedit{border-top:1px solid var(--hair)}
.exedit label{font:400 12px/1.3 var(--body);text-transform:none;letter-spacing:0}
.pill{font:500 11px/1 var(--body);letter-spacing:0;text-transform:none;border-radius:99px;padding:4px 8px}
#intro .btn.go{font:400 26px/1 var(--poster)!important;letter-spacing:.08em!important;text-transform:uppercase!important}
.tr .mono:last-child{padding-left:12px}
main h2{margin-top:18px}
main .ph-h h2{margin-top:0}
.pick-h{font:500 40px/1 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:26px 0 22px;text-wrap:balance}
main[data-v="today"] .pick-h + .ledger{margin-top:0}
main[data-v="today"] .pick-h ~ .ledger .wn{color:var(--dust)!important}

/* ---- body tab, finish screen, effort ---- */
.pk2{padding-top:6px}
.bmap{display:flex;justify-content:center;padding:8px 0 4px}
.bmap svg{width:min(78vw,300px);height:auto}
.bg{display:flex;flex-direction:column}
.bg-r{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 6px;font-size:15px;color:var(--chalk);background:none;border:0;border-radius:0;width:100%;text-align:left}

.ms-in{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:15px}

.up{color:var(--plate)!important}.dn{color:var(--dust)!important}

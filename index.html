<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BR">
<meta name="theme-color" content="#0e0f11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column (max 560px), bottom tab bar; a full-screen ring timer takes over during rest.
   One visual world, dark by choice: graphite, off-white, a single champagne accent, Oswald throughout. */
:root{
  color-scheme: dark;
  --iron:#0e0f11;      /* ground */
  --rack:#17181b;      /* cards */
  --knurl:#2a2b2f;     /* lines, raised controls */
  --chalk:#ece9e2;     /* text */
  --dust:#a39f95;      /* secondary text */
  --plate:#d6b77a;     /* accent: champagne */
  --done:#d6b77a;      /* completed set */
  --gold:#ece9e2;      /* record pill, toast */
  --danger:#e8857a;    /* destructive actions, offline */
  --p-red:#e5483b; --p-blue:#3b7fe0; --p-yellow:#e9c23a; --p-green:#3fae6a; --p-grey:#7c838e;
  --display:Oswald,"Arial Narrow",Arial,sans-serif;
  --body:Oswald,"Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:#0e0f11}
body{overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
.top{padding-top:calc(12px + env(safe-area-inset-top))!important}
.tabs{padding-bottom:calc(14px + env(safe-area-inset-bottom))!important}
#intro,#restfull{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#sheet .panel{padding-bottom:calc(24px + env(safe-area-inset-bottom))!important}
html,body{height:100%;margin:0}
body{background:var(--iron);color:var(--chalk);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--plate)}
.brand i{font-style:normal;color:var(--plate)}
.sync{font-size:12px;color:var(--dust);display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--p-grey)}
.sync[data-s="cloud"]::before{background:var(--done)}
.sync[data-s="syncing"]::before{background:var(--gold)}
.sync[data-s="offline"]::before{background:var(--danger)}
main{flex:1;overflow-y:auto;padding:8px 16px 56px;display:flex;flex-direction:column;gap:16px}
.tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--knurl);background:var(--iron);padding:0 8px 14px}
.tabs::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:36px;margin-bottom:1px;pointer-events:none;background:linear-gradient(rgba(14,15,17,0),#0e0f11)}
main>*{flex:none}
.tabs a{min-width:0;overflow:hidden;padding:18px 2px 16px;text-align:center;text-decoration:none;color:var(--dust);font-family:var(--display);font-weight:600;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;border-top:1px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--plate);border-top-color:var(--plate)}

/* knurling strip: the crosshatch grip pattern on a barbell */
.knurl{height:1px;background:var(--knurl)}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;text-wrap:balance;line-height:.95}
h2{font-size:26px;font-weight:600;letter-spacing:.03em}
.eyebrow{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--dust)}
.muted{color:var(--dust)}
.num{font-variant-numeric:tabular-nums}

.hero{display:flex;flex-direction:column;gap:12px;padding:4px 0 0}
.hero h1{overflow-wrap:anywhere;font-size:clamp(48px,15vw,84px);font-weight:600;letter-spacing:-.01em;margin-left:-3px}
.hero .focus{font-size:17px;color:var(--dust)}
.btn{border:0;border-radius:10px;padding:14px 18px;background:var(--knurl);font-weight:600;font-size:16px;min-height:48px}
.btn.go{background:var(--plate);color:#17130a;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px}
.btn.ghost{background:transparent;border:1px solid var(--knurl)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}

.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--knurl);border:1px solid var(--knurl);border-radius:12px;overflow:hidden}
.strip div{background:var(--rack);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip b{font-family:var(--display);font-weight:600;font-size:30px;line-height:1}
.strip span{font-size:12px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--rack);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rt{display:flex;align-items:center;gap:12px}
.ss{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--plate);padding-left:10px}
.lk{grid-column:1;flex-direction:row!important;align-items:center;gap:10px!important;text-transform:none!important;letter-spacing:0!important;font-size:14px!important;min-height:44px}
.lk input{width:22px;height:22px;accent-color:var(--plate)}
select.field{appearance:auto}
.card.restday{background:transparent;border:1px dashed var(--knurl)}
.card.restday .disc,.card.restday .t b{color:var(--dust)}
.disc{flex:none;width:44px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--display);font-weight:600;font-size:20px;color:var(--plate);font-variant-numeric:tabular-nums}
.rt .t{flex:1;min-width:0}
.rt .t b{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.05;overflow-wrap:anywhere}
.rt .t span{font-size:14px;color:var(--dust)}

/* workout */
.wk-head{position:sticky;top:-8px;z-index:3;background:var(--iron);padding:8px 0 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--knurl)}
.wk-head .t{flex:1;min-width:0}
.wk-head h2{overflow-wrap:anywhere}
#elapsed{font-family:var(--display);font-weight:600;font-size:22px;color:var(--dust)}
.ex h3{font-size:25px;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.ex .meta{font-size:13px;color:var(--dust);display:flex;gap:12px;flex-wrap:wrap}
.sets{display:flex;flex-direction:column;gap:6px}
.set,.sethead{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 46px 48px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.1em}
.sethead span:nth-child(n+2){text-align:center}
.set .n{font-family:var(--display);font-weight:600;font-size:20px;color:var(--dust);text-align:center}
.set .prev{font-size:14px;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);text-align:center;font-family:var(--display);font-weight:600;font-size:24px;padding:0 4px}
.set .wbtn{width:100%;height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);color:inherit;text-align:center;font-family:var(--display);font-weight:600;font-size:24px;padding:0 4px;font-variant-numeric:tabular-nums}
.set .wbtn.empty{color:var(--dust)}
.set.done .wbtn{background:rgba(214,183,122,.1);border-color:transparent}
.set .nbtn{height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;display:grid;place-items:center;color:var(--dust)}
.set .nbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.set .nbtn.has{background:var(--plate);border-color:var(--plate);color:#17130a}
.set .nbtn[aria-expanded="true"]{background:transparent;color:var(--plate);border-color:var(--plate)}
.setsub{font-size:13px;color:var(--dust);padding-left:34px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setnote{padding-left:34px}
.setnote textarea{margin-top:0}
#pl-w{height:72px;font-family:var(--display);font-weight:600;font-size:48px;text-align:center}
.set .chk{height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;display:grid;place-items:center}
.set .chk svg{width:22px;height:22px;stroke:var(--dust);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.done input{background:rgba(214,183,122,.1);border-color:transparent}
.set.done .chk{background:var(--done);border-color:var(--done)}
.set.done .chk svg{stroke:#17130a}
.set.done .n{color:var(--done)}
.set.pr .n{color:var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--gold);color:#221a03}
.field{height:46px;border-radius:8px;border:1px solid var(--knurl);background:var(--iron);padding:0 12px;min-width:0;width:100%}

.field.note{height:40px;font-size:14px;border-style:dashed;color:var(--chalk)}
textarea.field{height:auto;padding:10px 12px;resize:vertical;font-size:16px;text-transform:none;letter-spacing:0;margin-top:4px;display:block}
.up{font-size:13px;font-weight:600;color:var(--done)}
.notebox{font-size:14px;color:var(--dust);border-left:3px solid var(--knurl);padding-left:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.gbar{height:8px;border-radius:4px;background:var(--iron);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--plate);border-radius:4px}
.goal .pct{font-family:var(--display);font-weight:600;font-size:26px}
.goal .t b{font-size:22px}
label.eyebrow{display:flex;flex-direction:column;gap:4px}
.mm{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:center;padding:6px 0 2px}
.mm svg{display:block;width:100%;height:auto;overflow:visible}
.mm-n *{fill:#212328;stroke:#40434a;stroke-width:.5}
.mm-b{fill:#2d2f35;stroke:#4a4d54;stroke-width:.5;stroke-linejoin:round}
.mm-s{fill:rgba(214,183,122,.34);stroke:rgba(214,183,122,.7);stroke-width:.5;stroke-linejoin:round}
.mm-p{fill:#d6b77a;stroke:#f0dcae;stroke-width:.5;stroke-linejoin:round;filter:drop-shadow(0 0 2.4px rgba(214,183,122,.75))}
.mm-t{display:flex;flex-direction:column;gap:12px;min-width:0}
.mm-t div{display:flex;flex-direction:column;gap:2px}
.mm-t b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;text-transform:uppercase;letter-spacing:.03em;color:var(--plate)}
.mm-t span:not(.eyebrow){font-size:15px;color:var(--chalk)}
.mm-t .eyebrow{font-size:11px}
/* rest dock */
#rest{margin:0 12px 10px;border-radius:12px;background:var(--rack);border:1px solid var(--plate);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
#rest[hidden]{display:none}
#rest .r1{display:flex;align-items:center;gap:8px}
#rest .lab{font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--dust)}
#rest .time{font-family:var(--display);font-weight:600;font-size:40px;line-height:1}
#rest button{border:1px solid var(--knurl);border-radius:8px;background:transparent;color:inherit;min-height:44px;padding:0 12px;font-weight:500}
#rest .bar{height:3px;border-radius:2px;background:var(--knurl);overflow:hidden}
#rest .bar i{display:block;height:100%;background:var(--plate);width:0}
#rest.go{background:var(--plate);color:#17130a}
#rest.go .lab{color:#17130a}

/* full-screen rest timer */
#restfull{position:absolute;inset:0;z-index:5;background:var(--iron);display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:22px;padding:24px;overflow-y:auto}
#restfull[hidden]{display:none}
#restfull .ring{display:grid;place-items:center}
#restfull .ring svg{grid-area:1/1;width:min(72vw,300px);height:auto}
#restfull .ring .txt{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:4px}
#rf-time{font-family:var(--display);font-weight:600;font-size:clamp(64px,22vw,96px);line-height:.95}
#rf-lab{font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--dust)}
#rf-of{font-size:14px;color:var(--dust)}
#rf-next{text-align:center;font-size:17px}
#rf-next small{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--dust);margin-bottom:4px}
#restfull.go #rf-time{color:var(--plate)}

/* history / progress */
details.card summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:4px}
details.card summary::-webkit-details-marker{display:none}
.hs b{font-family:var(--display);font-weight:600;font-size:24px;text-transform:uppercase;letter-spacing:.03em}
.hs .meta{font-size:14px;color:var(--dust);display:flex;gap:12px;flex-wrap:wrap}
.lines{display:flex;flex-direction:column;gap:6px;font-size:15px}
.lines div{display:flex;gap:10px;justify-content:space-between}
.lines div span:last-child{color:var(--dust);text-align:right}
.chart{background:var(--rack);border-radius:12px;padding:12px}
.chart svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--knurl)}
th{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.empty{color:var(--dust);padding:18px 0}

/* routine editor */
.exedit{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;padding:10px 0;border-top:1px solid var(--knurl)}
.exedit .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-column:1}
.exedit label{font-size:11px;color:var(--dust);text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;gap:3px}
.exedit .x{grid-row:1 / span 2;grid-column:2;align-self:start}
.iconbtn{width:44px;height:46px;border-radius:8px;border:1px solid var(--knurl);background:transparent;color:var(--dust);font-size:20px}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--knurl);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 18px;min-height:44px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--plate);color:#17130a}

/* cinematic layer: grain over everything, lit hero, week strip */
#grain{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-size:160px 160px}
.hero.cine{position:relative;margin:-8px -16px 0;padding:30px 16px 22px;gap:14px;border-top:1px solid #000;border-bottom:1px solid var(--knurl);
  background:radial-gradient(120% 90% at 12% 0%,rgba(214,183,122,.2),rgba(214,183,122,0) 62%),radial-gradient(90% 70% at 100% 100%,rgba(0,0,0,.55),rgba(0,0,0,0) 70%),var(--iron)}
.hero.cine h1{font-size:clamp(52px,17vw,96px);letter-spacing:.01em;text-shadow:0 0 42px rgba(214,183,122,.22)}
.hero.cine .eyebrow{color:var(--plate);letter-spacing:.42em}
.hero.cine .rule{height:1px;background:linear-gradient(90deg,var(--plate),rgba(214,183,122,0));transform-origin:left}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd .l{font-size:12px;letter-spacing:.14em;color:var(--dust)}
.wd .c{width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:1px solid var(--knurl);font-size:15px;color:var(--dust);font-variant-numeric:tabular-nums}
.wd .c svg{width:18px;height:18px;stroke:#17130a;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wd.done .c{background:var(--plate);border-color:var(--plate)}
.wd.today .c{border-color:var(--plate);color:var(--chalk);box-shadow:0 0 0 3px rgba(214,183,122,.18)}
.wd.today .l{color:var(--plate)}
.wd.rest .c{border-style:dashed;font-size:11px;letter-spacing:.04em}
.wd.missed .c{opacity:.45}
.textlink{color:var(--dust);text-align:center;font-size:14px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;padding:12px 0}

/* opening title card */
#intro[hidden],#wipe[hidden]{display:none}
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;background:#000;opacity:0}
#wipe i{display:none}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;border-radius:12px;background:var(--rack);padding:14px;min-height:72px;color:inherit;font:inherit}
.day .d{display:flex;flex-direction:column;gap:2px;font-family:var(--display)}
.day .d b{font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--plate);line-height:1}
.day .d span{font-size:13px;color:var(--dust);font-variant-numeric:tabular-nums}
.day .n{min-width:0;display:flex;flex-direction:column;gap:2px}
.day .n b{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.day .n span{font-size:14px;color:var(--dust)}
.day .s{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);display:flex;align-items:center}
.day .s svg{width:22px;height:22px;stroke:var(--plate);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.day.today{border-color:var(--plate);background:radial-gradient(120% 140% at 0% 0%,rgba(214,183,122,.18),rgba(214,183,122,0) 60%),var(--rack);box-shadow:0 0 28px rgba(214,183,122,.12)}
.day.today .s{color:var(--plate)}
.day.off{background:transparent;border:1px dashed var(--knurl)}
.day.off .d b,.day.off .n b{color:var(--dust)}
.pick h1{font-size:clamp(44px,14vw,76px);font-weight:600;text-shadow:0 0 42px rgba(214,183,122,.2)}
.pick .eyebrow{color:var(--plate);letter-spacing:.42em}
#intro{position:absolute;inset:0;z-index:30;overflow:hidden;display:grid;place-items:center;
  background:radial-gradient(90% 60% at 50% 45%,rgba(214,183,122,.2),rgba(214,183,122,0) 70%),#0e0f11}
#intro .bar{position:absolute;left:0;right:0;height:50%;background:#000}
#intro .bar.t{top:0}#intro .bar.b{bottom:0}
#intro .mid{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 20px;text-align:center}
.mono{width:min(46vw,190px);height:auto;overflow:visible;margin-bottom:10px}
.mono .m-p{fill:var(--plate)}
.mono .m-all{filter:drop-shadow(0 0 14px rgba(214,183,122,.35))}
#intro .i-day{white-space:nowrap;font-size:14px;font-weight:500;letter-spacing:.5em;text-transform:uppercase;color:var(--plate);padding-left:.5em}
#intro .i-line{width:min(60vw,240px);height:1px;background:var(--plate)}
#intro .i-title{font-family:var(--display);font-weight:600;font-size:clamp(40px,13vw,76px);line-height:.95;text-transform:uppercase;text-shadow:0 0 60px rgba(214,183,122,.35);overflow-wrap:anywhere}
#intro .i-sub{font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--dust);padding-left:.3em}
#intro .bar{display:none}
#intro::after{content:"";position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#intro .btn.go{margin-top:22px;min-width:min(74vw,300px);font-size:26px;letter-spacing:.1em;box-shadow:0 0 44px rgba(214,183,122,.28)}
@media (prefers-reduced-motion:no-preference){
  #intro::after{animation:i-open 1.2s ease-out both}
  @keyframes i-open{from{opacity:1}to{opacity:0}}
  #intro .btn.go{animation:rise .7s cubic-bezier(.2,.7,.2,1) 2.8s both}
  #wipe.run{animation:wipe .85s ease-in-out both}
  @keyframes wipe{0%{opacity:0}42%{opacity:1}56%{opacity:1}100%{opacity:0}}

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function key(name){ return String(name||"").trim().toLowerCase(); }
function e1rm(w,r){ if(!(w>0) || !(r>0)) return 0; return r === 1 ? w : w * (1 + r/30); }  // Epley estimate
function fmtW(n){ return (Math.round(n*10)/10).toString(); }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m + ":" + (s<10?"0":"") + s; }
function fmtDur(sec){ sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h? h+":"+(m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s; }
function fmtMin(sec){ return Math.max(1, Math.round(sec/60)) + " min"; }
function fmtVol(n){ return Math.round(n).toLocaleString("en-US"); }
function fmtDate(t){ return new Date(t).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(t){ return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(t){ var d = new Date(t); d.setHours(0,0,0,0); var day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function lowRep(r){ var m = String(r||"").match(/\d+/); return m ? m[0] : ""; }

var ls = {
  get: function(k){ try{ var v = localStorage.getItem("ironlog."+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem("ironlog."+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- starter program (shown until you edit it) ---------- */
var STARTER = { units:"lb", updatedAt:0, weeklyGoal:5, pv:2, goals:[], notes:{}, routines:[
  { id:"mon", day:1, name:"Back & Hamstrings", focus:"Rows, RDLs, pulldowns, shrugs", exercises:[
    {name:"Low Cable Row", sets:4, reps:"12-15", rest:75},
    {name:"RDL", sets:4, reps:"10-12", rest:90},
    {name:"Cable Straight-Arm Pulldown", sets:3, reps:"15", rest:60},
    {name:"Hamstring Curl", sets:3, reps:"15", rest:60},
    {name:"Dumbbell Shrug", sets:3, reps:"15-20", rest:60}
  ]},
  { id:"tue", day:2, name:"Chest & Shoulders", focus:"Incline press, Arnold press, triceps", exercises:[
    {name:"Incline Press", sets:4, reps:"8-12", rest:90},
    {name:"Seated Arnold Press", sets:3, reps:"10-12", rest:90},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15-20", rest:60},
    {name:"Cable Tricep Pushdown", sets:3, reps:"15-20", rest:60}
  ]},
  { id:"thu", day:4, name:"Legs", focus:"Split squats, squats, extensions, RDLs, calves", exercises:[
    {name:"Smith Bulgarian Split Squat", sets:4, reps:"8-10", rest:90},
    {name:"Goblet Squat / Heels-Elevated Smith Squat", sets:3, reps:"10-12", rest:90},
    {name:"Leg Extension", sets:4, reps:"12-15", rest:60},
    {name:"RDL", sets:3, reps:"12", rest:90},
    {name:"Smith Calf Raise", sets:4, reps:"15-20", rest:60}
  ]},
  { id:"fri", day:5, name:"Upper Supersets", focus:"Row + press, delts, arms, flys, calves", exercises:[
    {name:"Cable Seated Row", sets:4, reps:"15-20", rest:75, link:true},
    {name:"Flat Press", sets:4, reps:"15-20", rest:75},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60, link:true},
    {name:"Rear Delt Raise", sets:4, reps:"15-20", rest:60},
    {name:"Cable Curl", sets:3, reps:"15", rest:60, link:true},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15", rest:60},
    {name:"Cable Chest Fly", sets:2, reps:"20", rest:60},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:60}
  ]},
  { id:"sat", day:6, name:"Shoulders & Carries", focus:"Shoulder press, delts, shrugs, farmer carries", exercises:[
    {name:"Seated Shoulder Press", sets:4, reps:"12", rest:90},
    {name:"Lateral Raise", sets:4, reps:"15-20", rest:60, link:true},
    {name:"Rear Delt Raise", sets:4, reps:"15-20", rest:60},
    {name:"Dumbbell Shrug", sets:3, reps:"15-20", rest:60},
    {name:"Farmer Carry", sets:3, reps:"lengths of the gym", rest:90, repLabel:"Lengths"},
    {name:"Smith Calf Raise", sets:3, reps:"20", rest:60}
  ]}
]};
var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], migrated = false;
function normalise(c){ c.goals = c.goals || []; c.notes = c.notes || {}; c.bars = c.bars || {}; c.weeklyGoal = c.weeklyGoal || 5; c.routines = c.routines || [];
  if((c.pv || 0) < 2){ c.routines = clone(STARTER.routines); c.weeklyGoal = 5; c.pv = 2; migrated = true; }
  return c; }
var PLATE_COLORS = ["var(--plate)","var(--p-blue)","var(--p-yellow)","var(--p-green)"];

/* ---------- state ---------- */
var S = {
  cfg: normalise(ls.get("cfg") || clone(STARTER)),
  sessions: ls.get("sessions") || [],
  active: ls.get("active") || null,
  activeAt: ls.get("activeAt") || 0,
  pend: ls.get("pend") || { cfg:false, add:[], del:[] },
  openRoutine: null,
  progressEx: null
};
var STANDALONE = !(window.claude && typeof window.claude.use === "function");
var db = null, chains = {}, timers = {}, confirmFn = null, restFlash = 0, actx = null, restMin = false;

/* ---------- persistence: this device first, then your Claude account ---------- */
function setSync(s){
  var el = $("#sync"); el.dataset.s = s;
  el.textContent = { local:"Saved on this device", syncing:"Connecting…", cloud:"Saved to your account", offline:"Offline, saved on this device" }[s];
}
function dbWrite(k, fn){
  if(!db) return;
  chains[k] = (chains[k] || Promise.resolve()).then(fn).then(function(){ setSync("cloud"); }).catch(function(e){
    console.warn("save failed", e); setSync("offline");
  });
}
function debounce(k, ms, fn){ clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); }
function savePend(){ ls.set("pend", S.pend); }
function saveCfg(){
  S.cfg.updatedAt = Date.now(); ls.set("cfg", S.cfg);
  S.pend.cfg = true; savePend();
  debounce("cfg", 1200, pushCfg);
}
function pushCfg(){
  var body = clone(S.cfg);
  dbWrite("cfg", function(){ return db.doc("app/config").set(body).then(function(){ S.pend.cfg = false; savePend(); }); });
}
function saveActive(){
  S.activeAt = Date.now(); ls.set("active", S.active); ls.set("activeAt", S.activeAt);
  debounce("active", 1500, pushActive);
}
function pushActive(){
  var body = S.active ? { on:true, w:clone(S.active), updatedAt:S.activeAt } : { on:false, updatedAt:S.activeAt };
  dbWrite("active", function(){ return db.doc("app/active").set(body); });
}
function pushSession(s){
  var body = clone(s);
  dbWrite("s"+s.id, function(){ return db.collection("sessions").doc(s.id).set(body).then(function(){
    S.pend.add = S.pend.add.filter(function(i){ return i !== s.id; }); savePend(); }); });
}
function pushDelete(id){
  dbWrite("s"+id, function(){ return db.collection("sessions").doc(id).delete().then(function(){
    S.pend.del = S.pend.del.filter(function(i){ return i !== id; }); savePend(); }); });
}
function connect(){
  if(!(window.claude && typeof window.claude.use === "function")){ setSync("local"); return; }
  setSync("syncing");
  var slow = setTimeout(function(){ if($("#sync").dataset.s === "syncing") setSync("offline"); }, 10000);
  window.claude.use("db").then(function(d){
    if(!d){ clearTimeout(slow); setSync("local"); return; }
    return Promise.all([
      d.doc("app/config").get(),
      d.doc("app/active").get(),
      d.collection("sessions").orderBy("startedAt","desc").limit(500).get()
    ]).then(function(res){
      clearTimeout(slow); db = d;
      var c = res[0], a = res[1], q = res[2];
      if(c.exists){ var rc = c.data(); if(rc && rc.routines && (!S.pend.cfg || (rc.updatedAt||0) > (S.cfg.updatedAt||0))){ S.cfg = normalise(clone(rc)); S.pend.cfg = false; ls.set("cfg", S.cfg); } }
      if(S.pend.cfg) pushCfg();
      var remote = {}; q.docs.forEach(function(doc){ var v = doc.data(); if(v && v.id) remote[v.id] = clone(v); });
      var merged = [];
      Object.keys(remote).forEach(function(id){ if(S.pend.del.indexOf(id) < 0) merged.push(remote[id]); });
      S.sessions.forEach(function(s){ if(!remote[s.id] && S.pend.add.indexOf(s.id) >= 0) merged.push(s); });
      merged.sort(function(x,y){ return y.startedAt - x.startedAt; });
      S.sessions = merged; ls.set("sessions", merged);
      S.pend.add.slice().forEach(function(id){ var s = merged.filter(function(m){ return m.id === id; })[0]; if(s) pushSession(s); });
      S.pend.del.slice().forEach(pushDelete);
      if(a.exists){ var ra = a.data() || {};
        if((ra.updatedAt||0) > (S.activeAt||0)){ S.active = ra.on && ra.w ? clone(ra.w) : null; S.activeAt = ra.updatedAt; ls.set("active", S.active); ls.set("activeAt", S.activeAt); }
        else if((S.activeAt||0) > (ra.updatedAt||0)) pushActive();
      } else if(S.active) pushActive();
      if(migrated){ migrated = false; saveCfg(); }
      if(dropStale() || trimActive()) saveActive();
      savePend(); setSync("cloud");
      var ae = document.activeElement; if(!(ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName))) render();
    });
  }).catch(function(e){ clearTimeout(slow); console.warn(e); setSync("offline"); });
}

/* ---------- history index ---------- */
function histIndex(){
  var idx = {};
  for(var i = S.sessions.length-1; i >= 0; i--){
    var s = S.sessions[i];
    (s.exercises||[]).forEach(function(x){
      var k = key(x.name); var h = idx[k] || (idx[k] = { name:x.name, best:0, bestSet:null, bestAt:0, last:[], series:[] });
      var top = 0;
      (x.sets||[]).forEach(function(st){ var e = e1rm(st.w, st.r); if(e > top) top = e; if(e > h.best){ h.best = e; h.bestSet = {w:st.w, r:st.r}; h.bestAt = s.startedAt; } });
      h.last = x.sets || []; h.name = x.name;
      if(top > 0) h.series.push({ t:s.startedAt, e:top });
    });
  }
  return idx;
}
function nextRoutine(){
  var rs = S.cfg.routines; if(!rs.length) return null;
  var today = new Date().getDay(), dated = rs.filter(function(r){ return r.day != null; });
  if(dated.length){ var t = dated.filter(function(r){ return r.day === today; })[0]; return t || { rest:true }; }
  var last = S.sessions[0]; if(!last) return rs[0];
  for(var i = 0; i < rs.length; i++) if(rs[i].id === last.routineId) return rs[(i+1) % rs.length];
  return rs[0];
}
function groupOf(a, ei){
  var i = ei, j = ei;
  while(i > 0 && a.exercises[i-1].link) i--;
  while(a.exercises[j].link && a.exercises[j+1]) j++;
  var out = []; for(var k = i; k <= j; k++) out.push(k); return out;
}
function dropStale(){
  var a = S.active; if(!a || !a.routineId) return false;
  if(S.cfg.routines.some(function(r){ return r.id === a.routineId; })) return false;
  if(a.exercises.some(function(x){ return x.sets.some(function(q){ return q.done; }); })) return false;
  S.active = null; return true;
}
function weekStats(){
  var now = Date.now(), ws = weekStart(now), thisWeek = 0, weeks = {};
  S.sessions.forEach(function(s){ var w = weekStart(s.startedAt); weeks[w] = 1; if(w === ws) thisWeek++; });
  var streak = 0, cur = ws; if(!weeks[cur]) cur = weekStart(cur - 864e5);
  while(weeks[cur]){ streak++; cur = weekStart(cur - 864e5); }
  return { thisWeek:thisWeek, streak:streak };
}

/* ---------- workout actions ---------- */
function trimActive(){
  var a = S.active, changed = false; if(!a) return false;
  a.exercises.forEach(function(x){ if(x.plan) return; x.plan = x.sets.length; changed = true;
    while(x.sets.length > 1 && !x.sets[x.sets.length-1].done) x.sets.pop(); });
  return changed;
}
function mkEx(x, hist){
  var h = hist[key(x.name)], n = Math.max(1, parseInt(x.sets,10) || 3), sets = [];
  var inc = S.cfg.units === "kg" ? 2.5 : 5, rng = String(x.reps||"").match(/\d+/g), topR = rng ? +rng[rng.length-1] : 0;
  var bump = !!(h && topR && h.last.length >= n && h.last.slice(0,n).every(function(s){ return s.r >= topR && s.w > 0; }));
  for(var i = 0; i < 1; i++){
    var p = h && h.last.length ? (h.last[i] || h.last[h.last.length-1]) : null;
    sets.push({ w: p ? (bump ? p.w + inc : p.w) : "", r: p && !bump ? p.r : (x.repLabel ? 1 : lowRep(x.reps)), done:false, prev: p ? {w:p.w, r:p.r} : null });
  }
  return { name:x.name, target:x.reps || "", rest: parseInt(x.rest,10) || 90, sets:sets, plan:n, bump: bump ? inc : 0, link: !!x.link, repLabel: x.repLabel || "" };
}
function startWorkout(r){
  var hist = histIndex();
  S.active = { id:uid(), routineId: r ? r.id : null, name: r ? r.name : "Open workout", startedAt:Date.now(), restEnd:null, restTotal:0,
    exercises: (r ? r.exercises : []).filter(function(x){ return key(x.name); }).map(function(x){ return mkEx(x, hist); }) };
  saveActive(); location.hash = "#today"; render(); $("#view").scrollTop = 0;
}
function toggleSet(ei, si){
  var a = S.active, x = a.exercises[ei], st = x.sets[si];
  if(st.done){ st.done = false; delete st.pr; saveActive(); render(); return; }

function chart(series, u){
  var W = 320, H = 160, pl = 36, pr = 16, pt = 18, pb = 24;
  var vals = series.map(function(p){ return p.e; }), mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var lo = mn, hi = mx; if(hi === lo){ hi += 5; lo -= 5; } var pad = (hi-lo)*.18; lo -= pad; hi += pad;
  var X = function(i){ return series.length === 1 ? pl + (W-pl-pr)/2 : pl + i*(W-pl-pr)/(series.length-1); };
  var Y = function(v){ return pt + (hi-v)*(H-pt-pb)/(hi-lo); };
  var ticks = mn === mx ? [mn] : [mn, (mn+mx)/2, mx];
  var g = ticks.map(function(v){ return '<line x1="' + pl + '" x2="' + (W-pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="var(--knurl)" stroke-width="1"/><text x="' + (pl-6) + '" y="' + (Y(v)+4) + '" text-anchor="end" font-size="10" fill="var(--dust)">' + Math.round(v) + '</text>'; }).join("");
  var pts = series.map(function(p, i){ return X(i).toFixed(1) + "," + Y(p.e).toFixed(1); });
  var li = series.length - 1, lx = X(li), ly = Y(series[li].e);
  var area = series.length > 1 ? '<path d="M' + pts.join(" L") + ' L' + X(li) + ',' + (H-pb) + ' L' + X(0) + ',' + (H-pb) + ' Z" fill="var(--plate)" opacity=".14"/><polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--plate)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : "";
  var dots = series.map(function(p, i){ return i === li ? "" : '<circle cx="' + X(i) + '" cy="' + Y(p.e) + '" r="2.5" fill="var(--plate)"/>'; }).join("");
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Estimated one-rep max over time, in ' + esc(u) + '">' + g + area + dots +
    '<circle cx="' + lx + '" cy="' + ly + '" r="5" fill="var(--chalk)" stroke="var(--plate)" stroke-width="3"/>' +
    '<text x="' + pl + '" y="' + (H-6) + '" font-size="10" fill="var(--dust)">' + fmtShort(series[0].t) + '</text>' +
    (series.length > 1 ? '<text x="' + (W-pr) + '" y="' + (H-6) + '" text-anchor="end" font-size="10" fill="var(--dust)">' + fmtShort(series[li].t) + '</text>' : "") + '</svg>';
}

      var id = b.dataset.id; S.sessions = S.sessions.filter(function(s){ return s.id !== id; }); ls.set("sessions", S.sessions);
      S.pend.add = S.pend.add.filter(function(i){ return i !== id; }); S.pend.del.push(id); savePend(); pushDelete(id); render(); }); break;
    case "goal-add": var gn = $("#g-name").value.trim(), gw = num($("#g-w").value), gr = Math.round(num($("#g-r").value));
      if(!gn || !(gw > 0) || !(gr > 0)){ toast("Fill in the lift, weight and reps"); break; }
      S.cfg.goals.push({ id:uid(), name:gn, w:gw, r:gr }); saveCfg(); render(); break;
    case "goal-del": S.cfg.goals = S.cfg.goals.filter(function(g){ return g.id !== b.dataset.id; }); saveCfg(); render(); break;
    case "backup": (function(){
        var data = JSON.stringify({ app:"br-workout", v:1, at:Date.now(), cfg:S.cfg, sessions:S.sessions }), name = "br-workout-backup-" + new Date().toISOString().slice(0,10) + ".json";
        try{ var f = new File([data], name, { type:"application/json" });
          if(navigator.canShare && navigator.canShare({ files:[f] })){ navigator.share({ files:[f], title:"Workout backup" }).catch(function(){}); return; } }catch(e){}
        try{ var u = URL.createObjectURL(new Blob([data], { type:"application/json" })), l = document.createElement("a"); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 4000); toast("Backup saved"); }catch(e){ toast("Could not save a backup on this device"); }
      })(); break;
    case "units": S.cfg.units = b.dataset.v; saveCfg(); render(); break;
    case "r-add": var nr = { id:uid(), name:"New routine", focus:"", exercises:[{ name:"", sets:3, reps:"8-12", rest:90 }] }; rs.push(nr); S.openRoutine = nr.id; saveCfg(); render(); break;
    case "r-add-ex": rs[ri].exercises.push({ name:"", sets:3, reps:"8-12", rest:90 }); S.openRoutine = rs[ri].id; saveCfg(); render(); break;
    case "r-del-ex": rs[ri].exercises.splice(+b.dataset.x, 1); S.openRoutine = rs[ri].id; saveCfg(); render(); break;
    case "r-del": ask("Delete " + (rs[ri].name || "this routine") + "?", "Past workouts stay in your history.", "Delete routine", function(){ rs.splice(ri,1); saveCfg(); render(); }); break;
  }
});
document.addEventListener("input", function(ev){
  var t = ev.target, d = t.dataset;
  if(t.id === "pl-bar"){ plateShow(true); return; }
  if(t.id === "pl-w"){ plSide = []; plateShow(false); return; }
  if(d.note !== undefined){ if(t.value.trim()) S.cfg.notes[d.note] = t.value; else delete S.cfg.notes[d.note]; saveCfg(); return; }
  if(t.id === "wk-note" && S.active){ S.active.note = t.value; saveActive(); return; }
  if(t.id === "wk-goal"){ var wg = parseInt(t.value,10); if(wg > 0){ S.cfg.weeklyGoal = Math.min(14, wg); saveCfg(); } return; }
  if(d.s !== undefined && d.e !== undefined && S.active){ S.active.exercises[+d.e].sets[+d.s][d.k] = t.value; saveActive(); return; }
  if(d.r !== undefined){
    var r = S.cfg.routines[+d.r]; if(!r) return;
    if(d.x !== undefined){ var x = r.exercises[+d.x]; x[d.k] = d.k === "link" ? t.checked : (d.k === "sets" || d.k === "rest") ? (parseInt(t.value,10) || 0) : t.value; }
    else r[d.k] = d.k === "day" ? (t.value === "" ? null : +t.value) : t.value;
    saveCfg();
  }
});
document.addEventListener("change", function(ev){ if(ev.target.id === "pg-ex"){ S.progressEx = ev.target.value; render(); }
  if(ev.target.id === "restore-file" && ev.target.files && ev.target.files[0]){ var fr = new FileReader();
    fr.onload = function(){ try{ var d = JSON.parse(fr.result); if(!d || !d.cfg || !Array.isArray(d.sessions)) throw 0;
        ask("Restore this backup?", "It replaces the routines and " + S.sessions.length + " workouts on this phone with the " + d.sessions.length + " workouts in the file.", "Restore", function(){
          S.cfg = normalise(d.cfg); S.sessions = d.sessions; ls.set("sessions", S.sessions); saveCfg(); render(); toast("Backup restored"); });
      }catch(e){ toast("That file is not a workout backup"); } };
    fr.readAsText(ev.target.files[0]); ev.target.value = ""; } });
document.addEventListener("toggle", function(ev){ var d = ev.target; if(d.dataset && d.dataset.rid){ if(d.open) S.openRoutine = d.dataset.rid; else if(S.openRoutine === d.dataset.rid) S.openRoutine = null; } }, true);
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); if(ev.key === "Enter" && ev.target.id === "new-ex"){ var b = document.querySelector('[data-act="add-ex"]'); if(b) b.click(); } });
document.addEventListener("focusout", function(ev){
  var t = ev.target, d = t.dataset; if(!d || d.k !== "note" || !S.active) return;
  var x = S.active.exercises[+d.e], st = x && x.sets[+d.s]; if(!st) return;
  st.open = false; noteBlur = { k: d.e + "-" + d.s, t: Date.now() }; saveActive();
  var wrap = t.closest(".setnote"), btn = document.querySelector('[data-act="set-note"][data-e="' + d.e + '"][data-s="' + d.s + '"]'), has = !!String(st.note || "").trim();
  setTimeout(function(){ if(wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
    if(btn && btn.isConnected){ btn.classList.toggle("has", has); btn.setAttribute("aria-expanded", "false"); btn.innerHTML = noteIcon(has, false); } }, 280);
});
window.addEventListener("hashchange", render);

/* ---------- installed app: offline copy and storage ---------- */
try{ if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js"); }catch(e){}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---------- boot ---------- */
if(migrated){ migrated = false; saveCfg(); }
if(dropStale() || trimActive()) saveActive();
(function(){ try{ var c = document.createElement("canvas"); c.width = c.height = 160; var x = c.getContext("2d"), im = x.createImageData(160,160);
  for(var i = 0; i < im.data.length; i += 4){ var v = Math.random()*255|0; im.data[i] = im.data[i+1] = im.data[i+2] = v; im.data[i+3] = 255; }
  x.putImageData(im,0,0); $("#grain").style.backgroundImage = "url(" + c.toDataURL() + ")"; }catch(e){} })();
var calm = false; try{ calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
function cut(fn){
  var w = $("#wipe"); if(calm){ fn(); return; }
  w.hidden = false; w.classList.remove("run"); void w.offsetWidth; w.classList.add("run");
  setTimeout(fn, 400); clearTimeout(timers.wipe); timers.wipe = setTimeout(function(){ w.hidden = true; w.classList.remove("run"); }, 880);
}
function endIntro(){ var el = $("#intro"); if(el.hidden) return; el.hidden = true;
  if(viewName() === "today" && !S.active){ var m = $("#view"); m.scrollTop = 0; m.classList.add("enter"); setTimeout(function(){ m.classList.remove("enter"); }, 1700); } }
(function(){ if(S.active) return;
  var pl = todayPlan(); $("#i-day").textContent = new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"});
  $("#i-title").textContent = "Time to train"; $("#i-sub").textContent = "Today · " + pl.title;
  if(location.hash && location.hash !== "#today") try{ history.replaceState(null, "", "#today"); }catch(e){}
  $("#intro").hidden = false; })();
render();
setInterval(tick, 250);
connect();
})();

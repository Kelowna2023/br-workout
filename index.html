<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wake">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-w-180.png">
<link rel="icon" type="image/png" href="icon-w-192.png">
<link rel="preload" href="fonts/inter-tight.woff2" as="font" type="font/woff2" crossorigin>
<title>Wake</title>
<style>
/* ==================== Wake: one system ====================
   Black, warm white, one teal. Inter Tight. Thin rules, no cards, no glows.
   Solid teal = something you tap. Outlined teal = a status. */
@font-face{font-family:"Inter Tight";src:url("fonts/inter-tight.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
:root{
  --bg:#000; --tx:#F5F2EC; --mu:#8A867F; --mu2:#6B6862; --dim:#3A3834; --ln:#222; --ln2:#333; --sf:#111;
  --t:#14D3C2; --red:#E5604D;
  --p-blue:#2F6FDE; --p-yellow:#E9C33B; --p-green:#3BA55D; --p-red:#D8483A; --p-grey:#8A867F; --chalk:#F5F2EC;
  --font:"Inter Tight",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --g:20px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --out:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1); --io:cubic-bezier(.76,0,.24,1);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
body{color:var(--tx);font:400 15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0;text-align:inherit}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;border-radius:0}
h1,h2,h3,p{margin:0}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
b,.num{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;max-width:560px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}

/* ---- top bar: fades in as the big title scrolls away ---- */
#bar{position:absolute;z-index:20;top:0;left:0;right:0;height:calc(var(--st) + 52px);padding:var(--st) 8px 0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
#bar::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--bp,0);border-bottom:.5px solid var(--ln)}
#bar>*{position:relative;pointer-events:auto}
.bk{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 4px;color:var(--t);font-size:15px;font-weight:500;max-width:min(240px,56vw);transition:transform .3s var(--spring),color .2s}
.bk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bk:active{transform:scale(.94);opacity:.6}
.bk svg{width:20px;height:20px}
#bar-t{position:absolute;left:50%;top:var(--st);height:52px;display:flex;align-items:center;transform:translateX(-50%);font-weight:600;font-size:16px;letter-spacing:-.02em;opacity:var(--tp,0);max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--mu);border-radius:50%;transition:transform .3s var(--spring),color .2s}
.ib:active{transform:scale(.88);color:var(--tx)}
#bar-date{position:absolute;left:var(--g);top:var(--st);height:52px;display:flex;align-items:center;font-size:13px;color:var(--mu2);font-weight:500;pointer-events:none;will-change:opacity,transform}

/* ---- the wordmark: big on arrival, rides your scroll up into the bar ---- */
#wm{position:absolute;z-index:21;left:var(--g);top:calc(var(--st) + 10px);font:600 60px/1 var(--font);letter-spacing:-.045em;display:flex;align-items:flex-end;transform-origin:0 0;will-change:transform;pointer-events:none;white-space:nowrap;view-transition-name:wm}
#wm span{display:inline-block}
#wm i{width:.2em;height:.2em;border-radius:50%;background:var(--t);margin:0 0 .12em .09em;flex:none}
#app:not([data-s="home"]) #wm,#app:not([data-s="home"]) #bar-date{opacity:0!important;visibility:hidden}
@keyframes breathe{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.32);opacity:.55}}
.breathe{animation:breathe 2.8s cubic-bezier(.45,0,.55,1) infinite}

/* ---- the scrolling page ---- */
main{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 52px) var(--g) 48px;touch-action:pan-y;overscroll-behavior-x:none;will-change:transform}
main::-webkit-scrollbar{display:none}
.big{font:600 32px/1.1 var(--font);letter-spacing:-.03em;margin:6px 0 0;transform-origin:0 100%;will-change:transform,opacity;view-transition-name:title}
.sub{color:var(--mu);font-size:14px;margin-top:6px}
.sub.t,.t{color:var(--t)}
.eyebrow{font-size:13px;color:var(--mu);font-weight:500}
.muted{color:var(--mu);font-size:14px;line-height:1.5}
h2{font:500 20px/1.2 var(--font);letter-spacing:-.03em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 4px}
.lnk{color:var(--t);font-weight:600;font-size:14px;padding:8px 0 8px 12px}
.empty{color:var(--mu);font-size:14px;line-height:1.5;padding:16px 0;border-top:.5px solid var(--ln);border-bottom:.5px solid var(--ln)}

.tag{flex:none;font:500 11px/1 var(--font);color:var(--t);border:1px solid var(--t);padding:4px 8px;border-radius:6px;white-space:nowrap}
.tag.q{color:var(--mu);border-color:var(--ln2)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:0 18px;border-radius:14px;border:.5px solid var(--ln2);font-weight:500;font-size:15px;color:var(--tx);transition:transform .35s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.965)}
.btn.go{background:var(--t);border-color:var(--t);color:#000;font-weight:500}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--mu)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.grow{flex:1}
.stack{display:grid;gap:10px;margin-top:22px}
.field{width:100%;min-height:48px;background:var(--sf);border:.5px solid var(--ln2);border-radius:12px;padding:0 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--t)}
textarea.field{padding:12px 14px;min-height:76px;resize:none;line-height:1.4}

/* ---- home ---- */
.hero{height:98px}
.wk{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.wk-n{font:600 40px/1 var(--font);letter-spacing:-.045em}
.wk-n b{color:var(--t);font-weight:600}.wk-n span{color:var(--dim)}
.wk-l{font-size:13px;color:var(--mu);flex:1;margin-left:-6px}
.segs{display:flex;gap:6px;margin-top:20px}
.segs span{flex:1;height:4px;border-radius:2px;background:#1E1E1E;overflow:hidden}
.segs i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .9s var(--out)}
.segs i.on{transform:scaleX(1)}
.list{margin-top:32px;border-top:.5px solid var(--ln)}
.wrow{width:100%;min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:.5px solid var(--ln);will-change:transform,opacity;transform-origin:0 50%}
.wrow:active .wn{color:var(--t)}
.wn{display:block;font:500 23px/1.1 var(--font);letter-spacing:-.035em;transition:color .15s}
.wrow small{display:block;font-size:13px;color:var(--mu);margin-top:5px}
.wr{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.wv{width:76px;height:20px;overflow:hidden;color:var(--dim);transition:color .4s}
.wv svg{display:block;width:152px;height:20px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;animation:drift 16s linear infinite;will-change:transform}
.wrow.on .wv{color:var(--t)}
.wrow:active .wv{color:var(--t)}
@keyframes drift{to{transform:translate3d(-76px,0,0)}}
/* a horizon under each page title, and a thought at the foot of each page */
.hz{height:1px;margin:22px calc(var(--g) * -1) 0;background:linear-gradient(90deg,transparent,var(--t) 22%,var(--t) 60%,transparent);opacity:.45;transform-origin:0 50%}
.th{position:relative;margin:84px 0 36px;padding-right:10%}
.th::before{content:attr(data-g);position:absolute;left:-10px;top:-62px;font:400 180px/1 Georgia,"Times New Roman",serif;color:var(--tx);opacity:.06;pointer-events:none}
.th[data-g="?"]::before{top:-112px;left:-4px;font-size:170px}
.th[data-g="~"]::before{top:-118px;font-size:230px;font-style:italic}
.th em{position:relative;display:block;font-style:normal;font-size:11px;font-weight:500;color:var(--t);margin-bottom:12px}
.th p{position:relative;font:400 18px/1.36 var(--font);letter-spacing:-.012em;color:#8F8B84}
.th p b{font-weight:500;color:var(--tx)}
.th span{position:relative;display:block;font-size:12px;color:var(--mu2);margin-top:10px}
.th::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--t);margin-top:26px;opacity:.9}
/* the inline dial: drag sideways on a number, it turns like a wheel */
.hw{overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:6px calc(var(--g) * -1) 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);mask-image:linear-gradient(90deg,transparent,#000 24%,#000 76%,transparent);touch-action:pan-x}
.hw::-webkit-scrollbar{display:none}
.hw-t{display:flex;width:max-content;padding:0 calc(50% - 65px)}
.hw span{flex:none;width:130px;text-align:center;scroll-snap-align:center;font:600 58px/1.12 var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;transform:scale(.36);opacity:.14;will-change:transform,opacity}
.hw.ghost span{color:var(--mu)}
.hw-u{text-align:center;font-size:12px;color:var(--mu2);margin-bottom:14px}
.hw-u button{color:var(--t);font-weight:500;padding:6px 0 6px 8px;font-size:12px}
.hw.sm{flex:1;margin:0 6px;min-width:0}
.hw.sm .hw-t{padding:0 calc(50% - 39px)}
.hw.sm span{width:78px;font:500 26px/44px var(--font);letter-spacing:-.03em}
.rest[data-st="idle"] #rest-n{display:none}
.rest:not([data-st="idle"]) .hw{visibility:hidden}
/* moon and the year in weeks */
.mn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu2);flex:none}
.mn svg{width:18px;height:18px;flex:none}
.yg{margin-top:44px}
.yg-g{display:grid;grid-template-columns:repeat(26,1fr);gap:5px}
.yg-g i{aspect-ratio:1;border-radius:50%;border:1px solid #232323}
.yg-g i.p{background:#2A2A2A;border-color:#2A2A2A}
.yg-g i.t{background:var(--t);border-color:var(--t)}
.yg-g i.n{border-color:var(--tx)}
.yg-c{display:flex;justify-content:space-between;font-size:12px;color:var(--mu2);margin-top:12px}
/* rest: the tide comes in */
.ck-tide{position:absolute;inset:0;overflow:hidden;pointer-events:none;will-change:transform}
.ck-tide b{position:absolute;inset:0;background:rgba(20,211,194,.14);transform:translate3d(0,100%,0);transition:transform .3s linear;will-change:transform}
.ck-tide svg{position:absolute;left:0;bottom:100%;width:200%;height:12px;fill:rgba(20,211,194,.14);animation:drift2 7s linear infinite;margin-bottom:-1px}
@keyframes drift2{to{transform:translate3d(-50%,0,0)}}
#clock .ck-bar{display:none}
.bmap path.sel{animation:zap .8s var(--out)}
@keyframes zap{from{fill-opacity:.1}}
.ck-q{font-size:13px;line-height:1.4;color:var(--mu2);text-align:center;max-width:84%;margin-top:6px}
.ck-q b{font-weight:500;color:var(--mu)}
.foot{margin-top:22px;display:grid;gap:2px}
.foot button{color:var(--t);font-weight:500;font-size:15px;padding:12px 0;display:flex;align-items:center;gap:10px}
.foot button.t{color:var(--t)}

/* ---- workout: the list of lifts ---- */
.xrow{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:.5px solid var(--ln)}
.xrow .nm{font:500 18px/1.2 var(--font);letter-spacing:-.025em;display:block}
.xrow small{display:block;font-size:12px;color:var(--mu2);margin-top:3px}
.xrow .ct{font-size:14px;color:var(--mu2);font-variant-numeric:tabular-nums;font-weight:500}
.xrow.done .nm{color:var(--mu)}
.xrow .nm,.prow>span:first-child,.hrow b,.acc>button,.mrow>span:first-child,.grow-r div span:first-child{transition:color .15s}
.xrow:active .nm,.prow:active>span:first-child,.hrow:active b,.acc>button:active,.mrow:active>span:first-child,.grow-r:active div span:first-child{color:var(--t)}
.xrow small.t{color:var(--t);font-weight:500}
.xrow .ct b{color:var(--t);font-weight:600}
.sub b{color:var(--t);font-weight:600}
.btn.tl{border-color:var(--t);color:var(--t)}
.okc{width:22px;height:22px;border-radius:50%;background:var(--t);color:#000;display:grid;place-items:center;flex:none}
.okc svg{width:14px;height:14px;stroke-width:2.4}

/* ---- exercise: one set in focus, the finished ones underneath ---- */
.x-of{font-size:13px;color:var(--mu)}
.x-beat{font-size:14px;font-weight:500;color:var(--t);margin-top:8px;display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.x-beat button{color:var(--mu2);font-weight:400;font-size:14px;padding:4px 0}
.x-note{font-size:13px;color:var(--mu);margin-top:6px}
.x-segs{display:flex;gap:6px;margin-top:18px}
.x-segs span{flex:1;height:4px;border-radius:2px;background:#242424;overflow:hidden}
.x-segs i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .7s var(--out)}
.x-segs i.on{transform:scaleX(1)}
.x-cur{margin-top:24px}
.x-cur .lab{font-size:13px;color:var(--mu)}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stp+.stp{margin-top:14px}
.sb{width:52px;height:52px;border-radius:50%;border:.5px solid var(--ln2);display:grid;place-items:center;font-size:24px;font-weight:400;color:var(--tx);flex:none;transition:transform .28s var(--spring),background .2s,border-color .2s}
.sb:active{transform:scale(.86);background:var(--sf);border-color:var(--mu2)}
.nw{position:relative;flex:1;text-align:center;overflow:hidden}
.nw input{width:100%;background:none;border:0;outline:0;text-align:center;font:600 58px/1.06 var(--font);letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--tx);padding:0;caret-color:var(--t)}
.nw input::placeholder{color:var(--dim);opacity:1}
.nw small{display:block;font-size:12px;color:var(--mu2);margin-top:2px}
.nw small button{color:var(--t);font-weight:600;padding:4px 0 4px 6px;font-size:12px}
.sweep{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.9) 50%,transparent 70%);transform:translateX(-130%);mix-blend-mode:overlay}
.x-go{margin-top:20px}
.x-sup{margin-top:10px}
.rest{position:relative;margin-top:22px;display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px}
.rest-t{display:flex;align-items:center;gap:10px;min-height:44px;color:var(--mu);font-size:14px}
.rest-t i{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none;transition:background .3s}
.rest-t b{font:500 28px/1 var(--font);letter-spacing:-.03em;color:var(--tx);min-width:76px}
.rest[data-st="idle"] .rest-t b{color:var(--mu)}
.rest[data-st="run"] .rest-t i,.rest[data-st="go"] .rest-t i{background:var(--t);animation:breathe 2.8s cubic-bezier(.45,0,.55,1) infinite}
.rest[data-st="paused"] .rest-t i{background:var(--t)}
.rest[data-st="go"] .rest-t b{color:var(--t)}
.rest-b{display:flex;gap:8px}
.rb{width:44px;height:44px;border-radius:50%;border:.5px solid var(--ln2);display:grid;place-items:center;color:var(--t);transition:transform .28s var(--spring)}
.rb:active{transform:scale(.86)}
.rb svg{width:18px;height:18px}
.rb.x{color:var(--mu)}
.rest[data-st="idle"] .rb.x,.rest[data-st="go"] .rb.x{display:none}
.rest .i-pause,.rest[data-st="run"] .i-play{display:none}.rest[data-st="run"] .i-pause{display:block}
.rest-bar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:#1A1A1A;overflow:hidden}
.rest-bar i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transform:scaleX(0);transition:transform .3s linear}
.dset{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:.5px solid var(--ln)}
.dsets{margin-top:18px;border-top:.5px solid var(--ln)}
.dset .k{color:var(--mu2);font-size:14px;width:44px;flex:none}
.dset .v{font:500 18px/1 var(--font);letter-spacing:-.02em;font-variant-numeric:tabular-nums;flex:1;min-height:44px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dset .v small{font-size:12px;color:var(--t);font-weight:500;letter-spacing:0}
.dset .nb{font-size:13px;color:var(--mu2);min-height:44px;padding:0 4px}
.dset .nb.has{color:var(--t)}
.dset .dx{width:36px;height:44px;color:var(--mu2);font-size:20px;display:grid;place-items:center}
.dnote{padding:0 0 12px 56px;border-bottom:.5px solid var(--ln);margin-top:-6px}
.x-more{display:flex;gap:18px;margin-top:6px}
.x-more button{color:var(--t);font-weight:500;font-size:15px;padding:12px 0}

/* ---- tabs ---- */
#tabs{flex:none;display:flex;justify-content:space-around;padding:8px 6px calc(var(--sb) + 6px);border-top:.5px solid #1A1A1A;background:var(--bg);z-index:15;view-transition-name:tabs}
#tabs a{flex:1;display:grid;justify-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--mu2);padding:4px 0;text-decoration:none;transition:color .2s,transform .3s var(--spring)}
#tabs a:active{transform:scale(.9)}
#tabs a[aria-current="page"]{color:var(--t)}
#app[data-s="wk"] #tabs,#app[data-s="ex"] #tabs,#app[data-s="setup"] #tabs{display:none}

/* ---- history ---- */
.cal-h .ib{color:var(--t)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-top:22px}
.cal-h b{font:500 18px/1 var(--font);letter-spacing:-.02em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);margin-top:10px;row-gap:2px}
.cal .dw{font-size:11px;color:var(--mu2);text-align:center;padding:6px 0}
.cd{position:relative;height:48px;display:grid;place-items:center;font-size:15px;color:var(--dim);font-variant-numeric:tabular-nums}
.cd span{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;transition:transform .3s var(--spring)}
.cd.on{color:#000;font-weight:600}.cd.on span{background:var(--t)}
.cd.on:active span{transform:scale(.86)}
.cd.td:not(.on){color:var(--tx)}.cd.td:not(.on) span{border:1px solid var(--ln2)}
.cd.ph::after{content:"";position:absolute;top:5px;right:calc(50% - 20px);width:6px;height:6px;border-radius:50%;background:var(--tx);border:1.5px solid #000}
.cd.ph:not(.on){color:var(--tx)}
.hrow{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:.5px solid var(--ln)}
.hrow b{font:500 17px/1.2 var(--font);letter-spacing:-.02em;display:block}
.hrow small{display:block;font-size:13px;color:var(--mu);margin-top:3px}
.hrow .r{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums;text-align:right;flex:none}
.hrow .r b{font-size:17px;color:var(--tx)}
.dx-ex{padding:12px 0;border-bottom:.5px solid var(--ln)}
.dx-ex b{font-weight:600;font-size:15px;display:block}
.dx-ex span{font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums;display:block;margin-top:3px;line-height:1.5}
.dx-ex em{display:block;font-style:normal;font-size:13px;color:var(--mu2);margin-top:4px}

/* ---- progress ---- */
.acc{border-bottom:.5px solid var(--ln)}
.acc>button{width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;font:500 20px/1.2 var(--font);letter-spacing:-.03em}
.acc>button svg{width:18px;height:18px;color:var(--t);transition:transform .45s var(--out)}
.acc.open>button svg{transform:rotate(90deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--out)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.prow{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;border-top:.5px solid #161616}
.prow span:last-child{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.acc-b>div>:last-child{margin-bottom:10px}
.pday{padding:16px 0;border-bottom:.5px solid var(--ln)}
.pday-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pday-h span{font-size:14px;color:var(--mu)}
.pday-h b{font:500 22px/1 var(--font);letter-spacing:-.03em}
.pday-h b small{font-size:12px;color:var(--mu2);font-weight:500;letter-spacing:0}
.pday-s{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--mu);font-variant-numeric:tabular-nums}
.pday-n{font-size:14px;color:var(--mu);margin-top:10px;line-height:1.5;padding-left:12px;border-left:1px solid var(--ln2)}
.up,.fs-r span:last-child .up{color:var(--t);font-weight:600;font-size:13px}

/* ---- body ---- */
.bmap{margin:18px auto 0;max-width:300px}
.bmap svg{display:block;width:100%;height:auto}
.bmap path[data-m]{transition:fill .35s,fill-opacity .35s}
.b-info{min-height:44px;margin-top:10px;font-size:14px;color:var(--mu);line-height:1.6;text-align:center}
.b-info b{color:var(--t);font-weight:600;font-size:16px;display:block}
.grow-r{width:100%;display:block;padding:14px 0 12px;border-bottom:.5px solid var(--ln)}
.grow-r div{display:flex;justify-content:space-between;align-items:baseline;font:500 18px/1 var(--font);letter-spacing:-.02em}
.grow-r div span:last-child{font-variant-numeric:tabular-nums;color:var(--mu)}
.grow-r[aria-pressed="true"] div span{color:var(--t)}
.grow-r p{height:3px;border-radius:2px;background:#1A1A1A;margin-top:10px;overflow:hidden}
.grow-r p i{display:block;height:100%;background:var(--t);border-radius:2px;transform-origin:0 50%}
.mrow{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--ln);font-size:16px}
.mrow span:last-child{color:var(--mu);font-size:14px}.mrow b{color:var(--tx);font-size:17px}
.ph-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ph-strip button{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--sf)}
.ph-strip img{width:100%;height:100%;object-fit:cover;display:block}
.ph-strip span{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.ph-full{width:100%;border-radius:12px;display:block;margin:12px 0}

/* ---- setup ---- */
details.rt{border-bottom:.5px solid var(--ln)}
details.rt summary{list-style:none;min-height:64px;display:flex;align-items:center;justify-content:space-between;font:500 20px/1.2 var(--font);letter-spacing:-.03em}
details.rt summary::-webkit-details-marker{display:none}
details.rt summary small{font-size:13px;color:var(--mu2);font-weight:400;letter-spacing:0}
.rt-b{padding:0 0 18px;display:grid;gap:10px}
.rx{display:grid;grid-template-columns:1fr 64px 64px 36px;gap:6px;align-items:center}
.rx .field{min-height:44px;padding:0 10px;font-size:16px}
.rx-h{font-size:11px;color:var(--mu2)}
.rx button{color:var(--mu2);font-size:20px;height:44px}
.sup{font-size:12px;color:var(--mu2);display:flex;align-items:center;gap:8px;margin:-2px 0 4px}
.sup input{width:18px;height:18px;border:1px solid var(--ln2);border-radius:5px;display:grid;place-items:center}
.sup input:checked{background:var(--t);border-color:var(--t)}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:60px;border-bottom:.5px solid var(--ln);font-size:16px;gap:12px}
.seg{display:flex;border:.5px solid var(--ln2);border-radius:10px;overflow:hidden}
.seg button{min-width:52px;min-height:38px;padding:0 12px;font-size:14px;font-weight:500;color:var(--mu)}
.seg button[aria-pressed="true"]{background:var(--t);color:#000;font-weight:600}
.ver{margin-top:28px;font-size:12px;color:var(--dim);text-align:center}

/* ---- sheets ---- */
#sheet{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(100%)}}
.panel{width:100%;max-height:88%;overflow-y:auto;background:#0C0C0C;border-top:.5px solid var(--ln2);border-radius:22px 22px 0 0;padding:10px var(--g) calc(var(--sb) + 22px);display:grid;gap:14px;animation:rise .55s var(--out) both;will-change:transform}
.grab{width:100%;height:20px;display:grid;place-items:center;touch-action:none;margin-bottom:-4px}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--ln2)}
.panel h2{font-size:24px;letter-spacing:-.035em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border-radius:12px;border:.5px solid var(--ln2);font-size:15px;font-weight:500;transition:transform .28s var(--spring)}
.chips button:active{transform:scale(.94)}
.chips button[aria-pressed="true"]{border-color:var(--t);color:var(--t)}
.wheel{position:relative;display:flex;justify-content:center;gap:6px;height:220px;font:500 26px/44px var(--font);font-variant-numeric:tabular-nums}
.wheel::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-top:.5px solid var(--ln2);border-bottom:.5px solid var(--ln2);pointer-events:none}
.wheel>div{width:84px;height:220px;overflow-y:auto;scroll-snap-type:y mandatory;padding:88px 0;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel>div::-webkit-scrollbar{display:none}
.wheel>div>span{display:block;height:44px;scroll-snap-align:center}
.wheel>b{align-self:center;font-size:13px;color:var(--mu);font-weight:500;width:28px}
.bar-draw{display:flex;align-items:center;justify-content:center;height:130px;gap:2px}
.bar-draw .shaft{width:70px;height:8px;background:#555}
.bar-draw .sleeve{width:16px;height:12px;background:#666;border-radius:2px}
.bar-draw .collar{width:6px;height:26px;background:#777;border-radius:2px}
.pl{display:grid;place-items:center;border-radius:3px;background:var(--c);color:#000;font-size:9px;font-weight:600;writing-mode:vertical-rl}
.plbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plbtns .dot{width:12px;height:12px;border-radius:50%}
.fs-r{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-bottom:.5px solid var(--ln);font-size:15px}
.fs-r span:last-child{color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
.ms-in{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px}
.ms-in .field{width:120px;text-align:center}

/* ---- rest, grown: press play and the timer swells into the lower half of the screen ---- */
#clock{position:absolute;inset:0;z-index:30;overflow:hidden;border-radius:28px 28px 0 0;touch-action:none;will-change:transform}
.ck-c{position:absolute;left:0;right:0;top:0;height:54%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px var(--g) calc(var(--sb) + 18px);will-change:transform}
.ck-bg{position:absolute;inset:0;background:#000;border-top:.5px solid var(--ln2);border-radius:28px 28px 0 0;transform-origin:50% 100%;will-change:transform}
.ck-hide{position:absolute;top:0;left:0;right:0;height:34px;display:grid;place-items:center;z-index:2}
.ck-hide::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--ln2)}
#clock .cl-l{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:15px}
#clock .cl-l i{width:9px;height:9px;border-radius:50%;background:var(--t)}
#ck-t{display:inline-block;font:600 min(34vw,150px)/.95 var(--font);letter-spacing:-.06em;font-variant-numeric:tabular-nums;transform-origin:0 0;will-change:transform}
#clock.go #ck-t{color:var(--t)}
.ck-bar{width:100%;height:4px;background:#1A1A1A;border-radius:2px;overflow:hidden}
.ck-bar i{display:block;height:100%;background:var(--t);transform-origin:0 50%;transition:transform .3s linear}
#clock .chips{justify-content:center;margin-top:8px;flex-wrap:nowrap;gap:8px}
#clock .chips button{padding:0 14px;min-height:48px}
#clock .chips button.p{background:var(--t);border-color:var(--t);color:#000;font-weight:600}
.wheel.one{font-size:34px;letter-spacing:-.03em}
.wheel.one>div{width:150px}

/* ---- finish card ---- */
#end{position:absolute;inset:0;z-index:55;background:var(--bg);overflow-y:auto;padding:calc(var(--st) + 56px) var(--g) calc(var(--sb) + 28px)}
#end .e-t{font:600 44px/1 var(--font);letter-spacing:-.05em;margin-top:8px}
.e-st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:30px 0 26px}
.e-st b{display:block;font:600 40px/1 var(--font);letter-spacing:-.04em}
.e-st b.t{color:var(--t)}
.e-st span{font-size:13px;color:var(--mu);display:block;margin-top:6px}
#veil{position:absolute;inset:0;z-index:54;background:var(--t);clip-path:inset(100% 0 0 0);pointer-events:none}


/* ---- the opening: first light. The name rises over a horizon and its reflection moves like water ---- */
#hero{position:absolute;inset:0;z-index:52;background:var(--bg);touch-action:none;overflow:hidden}
.h-top{position:absolute;left:var(--g);right:var(--g);top:calc(var(--st) + 18px);display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--mu2)}
.h-sea{position:absolute;left:0;right:0;top:43%;font:600 min(33vw,150px)/1 var(--font);letter-spacing:-.05em}
.h-rise{position:absolute;left:0;right:0;bottom:0;height:.868em;overflow:hidden;display:flex;justify-content:center}
.h-w{display:flex;align-items:flex-end;height:1em;white-space:nowrap;will-change:transform}
.h-w i{width:.19em;height:.19em;border-radius:50%;background:var(--t);margin:0 0 .136em .07em;flex:none}
.h-line{position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--t) 18%,var(--t) 82%,transparent);transform-origin:50% 50%;z-index:2}
.h-ref{position:absolute;left:0;right:0;top:1px}
.h-ref .st{overflow:hidden;display:flex;justify-content:center;will-change:transform}
.h-ref .h-w{transform:scaleY(-1)}
.h-bot{position:absolute;left:var(--g);right:var(--g);bottom:calc(var(--sb) + 26px)}
.h-q{position:relative;padding-right:8%}
.h-q::before{content:"\201C";position:absolute;left:-10px;top:-66px;font:400 190px/1 Georgia,"Times New Roman",serif;color:var(--tx);opacity:.07;pointer-events:none}
.h-q p{position:relative;font:400 19px/1.32 var(--font);letter-spacing:-.012em;color:#A29E96}
.h-q p b{font-weight:500;color:var(--tx)}
.h-q span{position:relative;display:block;font-size:12px;color:var(--mu2);margin-top:10px}
#h-go{margin-top:30px;min-height:64px;justify-content:space-between;padding:0 22px;font-size:17px;border-radius:16px}
#h-go svg{width:22px;height:22px;stroke-width:2}
#tide{position:absolute;inset:0;z-index:53;pointer-events:none;will-change:transform}
#tide i{position:absolute;left:0;right:0;background:var(--t);will-change:transform;transform:scaleY(0)}
#tide .a{top:0;transform-origin:50% 100%}#tide .b{bottom:0;transform-origin:50% 0}

#toast{position:absolute;z-index:70;left:0;right:0;bottom:calc(var(--sb) + 90px);display:grid;place-items:center;pointer-events:none}
#toast div{background:var(--tx);color:#000;font-size:14px;font-weight:500;padding:10px 16px;border-radius:12px;animation:toast .45s var(--spring) both;max-width:86%}
@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.96)}}

/* ---- moving between screens ---- */
@keyframes vt-out{to{opacity:0;transform:translateX(-22px)}}
@keyframes vt-in{from{opacity:0;transform:translateX(28px)}}
@keyframes vt-out-b{to{opacity:0;transform:translateX(22px)}}
@keyframes vt-in-b{from{opacity:0;transform:translateX(-28px)}}
@keyframes vt-fade-in{from{opacity:0;transform:translateY(10px)}}
::view-transition-group(*){animation-duration:.55s;animation-timing-function:var(--out)}
::view-transition-old(root){animation:vt-out .28s var(--out) both}
::view-transition-new(root){animation:vt-in .55s var(--out) both}
html[data-dir="back"]::view-transition-old(root){animation-name:vt-out-b}
html[data-dir="back"]::view-transition-new(root){animation-name:vt-in-b}
html[data-dir="tab"]::view-transition-old(root){animation:fade .2s reverse both}
html[data-dir="tab"]::view-transition-new(root){animation:vt-fade-in .45s var(--out) both}
::view-transition-old(title),::view-transition-new(title){height:100%;width:auto;object-fit:contain;object-position:left center;animation-duration:.5s}
@media (prefers-reduced-motion: reduce){*,::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important;transition:none!important}}
.bk-st{color:var(--mu);font-size:14px;line-height:1.5}.bk-st b{color:var(--tx)}
</style>
</head>
<body>
<div id="app" data-s="home">
  <div id="bar"><span id="bar-l"></span><span id="bar-t"></span><span id="bar-r"></span><span id="bar-date"></span></div>

  </div>

  <main id="view"></main>
  <nav id="tabs" aria-label="Sections">
    <a href="#today" id="tab-today"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M21 9v6M6 6v12M18 6v12M6 12h12"/></svg>Train</a>
    <a href="#history" id="tab-history"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>History</a>
    <a href="#progress" id="tab-progress"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/></svg>Progress</a>
    <a href="#body" id="tab-body"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2.5"/><path d="M6 9.5h12M12 9.5v5M9 21l3-6.5 3 6.5"/></svg>Body</a>
  </nav>
  <div id="clock" hidden>
    <div class="ck-bg"></div>
    <div class="ck-tide"><b id="ck-tide"><svg viewBox="0 0 400 12" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12V6q25-8 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0V12Z"/></svg></b></div>
    <button type="button" class="ck-hide" data-act="clock-hide" aria-label="Shrink timer"></button>
    <div class="ck-c">
      <div class="cl-l"><i class="breathe"></i><span id="ck-l">Rest</span></div>
      <div id="ck-t" role="timer" data-act="clock-hide">0:00</div>
      <div class="ck-bar"><i id="ck-b"></i></div>
      <div class="chips"><button type="button" data-act="rest-add" data-v="-15">−15 s</button><button type="button" data-act="rest-add" data-v="30">+30 s</button><button type="button" class="p" data-act="rest-toggle" id="ck-p">Pause</button><button type="button" data-act="rest-cancel">Cancel</button></div>
      <div class="ck-q" id="ck-q"></div>
    </div>
  </div>
  <div id="veil" aria-hidden="true"></div>
  <div id="end" hidden></div>
  <div id="sheet" hidden></div>
  <div id="toast"></div>
  <div id="sync" data-s="local" hidden></div>
</div>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function key(name){ return String(name||"").trim().toLowerCase(); }
function e1rm(w,r){ if(!(w>0) || !(r>0)) return 0; return r === 1 ? w : w * (1 + r/30); }  // Epley estimate
function fmtW(n){ return (Math.round(n*10)/10).toString(); }
function fmtClock(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec/60), s = sec%60; return m + ":" + (s<10?"0":"") + s; }
function fmtDur(sec){ sec = Math.max(0, Math.floor(sec)); var h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60; return (h? h+":"+(m<10?"0":"") : "") + m + ":" + (s<10?"0":"") + s; }
function fmtMin(sec){ return Math.max(1, Math.round(sec/60)) + " min"; }
function fmtVol(n){ return Math.round(n).toLocaleString("en-US"); }
function fmtDate(t){ return new Date(t).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); }
function fmtShort(t){ return new Date(t).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(t){ var d = new Date(t); d.setHours(0,0,0,0); var day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); return d.getTime(); }
function lowRep(r){ var m = String(r||"").match(/\d+/); return m ? m[0] : ""; }

var ls = {
  get: function(k){ try{ var v = localStorage.getItem("ironlog."+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem("ironlog."+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- starter program (shown until you edit it) ---------- */
var STARTER = { units:"lb", updatedAt:0, weeklyGoal:5, pv:4, goals:[], notes:{}, routines:[
  { id:"mon", day:1, name:"Posterior Chain", focus:"Rows, RDLs, pulldowns, shrugs", exercises:[

  { id:"tue", day:2, name:"Push", focus:"Incline press, Arnold press, triceps", exercises:[

  ]},
  { id:"thu", day:4, name:"Lower Body", focus:"Split squats, squats, extensions, RDLs, calves", exercises:[
    {name:"Smith Bulgarian Split Squat", sets:3, reps:"8-10", rest:150},
    {name:"Goblet Squat / Heels-Elevated Smith Squat", sets:3, reps:"10-12", rest:150},
    {name:"Leg Extension", sets:3, reps:"12-15", rest:150},
    {name:"RDL", sets:3, reps:"12", rest:150},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:150}
  ]},
  { id:"fri", day:5, name:"Upper Density", focus:"Row + press, delts, arms, flys, calves", exercises:[
    {name:"Cable Seated Row", sets:3, reps:"15-20", rest:150, link:true},
    {name:"Flat Press", sets:3, reps:"15-20", rest:150},
    {name:"Lateral Raise", sets:3, reps:"15-20", rest:150, link:true},
    {name:"Rear Delt Raise", sets:3, reps:"15-20", rest:150},
    {name:"Cable Curl", sets:3, reps:"15", rest:150, link:true},
    {name:"Overhead Cable Tricep Extension", sets:3, reps:"15", rest:150},
    {name:"Cable Chest Fly", sets:3, reps:"20", rest:150},
    {name:"Smith Calf Raise", sets:3, reps:"15-20", rest:150}
  ]},
  { id:"sat", day:6, name:"Shoulders & Carries", focus:"Shoulder press, delts, shrugs, farmer carries", exercises:[

    case "del-ex": ask("Remove " + a.exercises[ei].name + "?", "Its sets from this workout will be dropped.", "Remove", function(){ a.exercises.splice(ei, 1); a.openEx = null; saveActive(); render(); }); break;
    case "add-ex-open": sheet('<h2>Add a lift</h2><input class="field" id="new-ex" placeholder="Lift name" aria-label="Lift name"><button class="btn go" type="button" data-act="add-ex">Add</button>'); setTimeout(function(){ var n = $("#new-ex"); if(n) n.focus(); }, 350); break;
    case "add-ex": (function(){ var inp = $("#new-ex"), nm = inp.value.trim(); if(!nm){ toast("Type a lift name"); inp.focus(); return; }
        a.exercises.push(mkEx({ name:nm, sets:3, reps:"", rest:150 }, histIndex())); saveActive(); closeSheet(); render(); })(); break;
    case "finish": finishWorkout(); break;
    case "cancel": ask("Cancel this workout?", "Everything logged in this session will be thrown away.", "Cancel workout", function(){ S.active = null; S.pick = true; saveActive(); render(); }); break;
    case "end-done": (function(){ var e = $("#end"); haptic(); if(calm){ e.hidden = true; return; } e.animate([{ opacity:1, transform:"none" }, { opacity:0, transform:"translate3d(0,-30px,0)" }], { duration:420, easing:"ease-in" }).onfinish = function(){ e.hidden = true; e.innerHTML = ""; };
        if(viewName() !== "today"){ history.replaceState(null, "", "#today"); render(); } })(); break;
    /* rest */
    case "rest-toggle": if(!a) break; if(a.restEnd){ if(a.restPaused != null){ a.restEnd = Date.now() + a.restPaused * 1000; delete a.restPaused; } else a.restPaused = Math.max(1, (a.restEnd - Date.now()) / 1000); saveActive(); haptic(); tick(); }
      else if(a.openEx != null) restStart(Math.round(a.exercises[a.openEx].rest || 150)); break;
    case "rest-cancel": closeClock(); if(a){ a.restEnd = null; delete a.restPaused; ls.set("active", a); } restFlash = 0; tick(); break;
    case "rest-add": if(a && a.restEnd){ var dd = +b.dataset.v * 1000; a.restEnd += dd; if(a.restPaused != null) a.restPaused = Math.max(1, a.restPaused + dd / 1000); a.restTotal = Math.max(1, a.restTotal + dd / 1000); ls.set("active", a); tick(); } break;
    case "rest-time": if(a && a.restEnd) openClock(); break;
    case "w-type": sheet('<div><div class="eyebrow">' + esc(a.exercises[a.openEx].name) + '</div><h2>Weight</h2></div><input class="field num" id="w-in" inputmode="decimal" placeholder="0" aria-label="Weight"><button class="btn go" type="button" data-act="w-use">Use this weight</button>'); setTimeout(function(){ var t = $("#w-in"); if(t) t.focus(); }, 350); break;
    case "w-use": (function(){ var x = a.exercises[a.openEx], ci = curIdx(x), v = $("#w-in").value.trim(); if(ci < 0 || v === ""){ closeSheet(); return; } x.sets[ci].w = Math.max(0, num(v)); delete x.sets[ci].pl; saveActive(); closeSheet(); render(); })(); break;
    case "clock-hide": closeClock(); break;
    case "w-wheel": if(b.readOnly) weightSheet(); break;
    case "ww-use": (function(){ var x = a.exercises[a.openEx], ci = curIdx(x); if(ci < 0) return; var v = Math.round($("#ww").scrollTop / 44) * wStep(), st = x.sets[ci], old = blank(st.w) ? -1 : num(st.w);
        st.w = v; delete st.pl; saveActive(); closeSheet(); haptic(); var inp = $("#in-w"); if(inp) roll(inp, fmtW(v), v >= old ? 1 : -1); })(); break;
    case "ww-type": (function(){ closeSheet(); var inp = $("#in-w"); if(!inp) return; inp.readOnly = false; inp.focus(); })(); break;
    case "wh-pre": (function(v){ $("#wh-m").scrollTo({ top:Math.floor(v / 60) * 44, behavior:"smooth" }); $("#wh-s").scrollTo({ top:(v % 60) / 5 * 44, behavior:"smooth" });
        [].forEach.call(document.querySelectorAll("#sheet .chips button"), function(q){ q.setAttribute("aria-pressed", q === b); }); })(+b.dataset.v); break;
    case "wh-go": case "wh-set": (function(){ var secs = wheelValue(); if(secs < 5){ toast("Pick a time first"); return; } a.exercises[ei].rest = secs; saveActive(); closeSheet(); if(act === "wh-go") restStart(secs); else tick(); })(); break;
    /* body */
    case "bsel": case "bmus": (function(){ var g = act === "bsel" ? b.dataset.g : (BODY_GROUPS.filter(function(x){ return x[1].indexOf(b.dataset.m) >= 0; })[0] || [])[0]; if(!g) return;
        UI.bsel = UI.bsel === g ? null : g; haptic(); render(); if(act === "bsel" && UI.bsel) view.scrollTo({ top:0, behavior:"smooth" }); })(); break;
    case "meas-log": measSheet(); break;
    case "meas-save": (function(){ var v = {}, any = false; MEAS.forEach(function(m){ var x = $("#ms-" + m[0]).value.trim(); if(x !== "" && num(x) > 0){ v[m[0]] = num(x); any = true; } });
        if(!any){ toast("Enter at least one measurement"); return; } S.cfg.meas.push({ at:Date.now(), v:v }); saveCfg(); closeSheet(); render(); toast("Measurements saved"); })(); break;
    case "meas-hist": (function(){ var k = b.dataset.k, lab = MEAS.filter(function(m){ return m[0] === k; })[0][1], mu = measUnit();
        sheet('<h2>' + lab + '</h2><div>' + S.cfg.meas.map(function(e, ix){ return e.v[k] != null ? '<div class="fs-r"><span>' + fmtDate(e.at) + '</span><span>' + fmtW(e.v[k]) + ' ' + mu + ' <button type="button" style="padding:10px 0 10px 12px;color:var(--mu2)" aria-label="Delete" data-act="meas-del" data-i="' + ix + '" data-k="' + k + '">×</button></span></div>' : ""; }).reverse().join("") + '</div><button class="btn" type="button" data-act="sheet-close">Close</button>'); })(); break;
    case "meas-del": (function(){ var ix = +b.dataset.i, e = S.cfg.meas[ix]; if(!e) return; delete e.v[b.dataset.k]; if(!Object.keys(e.v).length) S.cfg.meas.splice(ix, 1); saveCfg(); closeSheet(); render(); })(); break;
    case "ph-view": (function(){ var q = S.photos.filter(function(z){ return z.id === b.dataset.id; })[0]; if(!q) return;
        sheet('<div class="eyebrow">' + esc(fmtDate(q.at)) + '</div><img class="ph-full" src="' + q.url + '" alt="Progress photo, ' + esc(fmtDate(q.at)) + '"><div class="row"><button class="btn danger grow" type="button" data-act="ph-del" data-id="' + esc(q.id) + '">Delete photo</button><button class="btn grow" type="button" data-act="sheet-close">Close</button></div>'); })(); break;
    case "ph-del": (function(id){ ask("Delete this photo?", "It's removed from the app. The copy in your camera roll stays.", "Delete photo", function(){ pTx("readwrite", function(st){ return st.delete(id); }).then(loadPhotos); }); })(b.dataset.id); break;
    case "del-session": (function(id){ ask("Delete this workout?", "It will be removed from your history and bests.", "Delete", function(){
        S.sessions = S.sessions.filter(function(s){ return s.id !== id; }); ls.set("sessions", S.sessions);
        S.pend.add = S.pend.add.filter(function(i){ return i !== id; }); S.pend.del.push(id); savePend(); pushDelete(id); render(); }); })(b.dataset.id); break;
    /* setup */
    case "units": S.cfg.units = b.dataset.v; saveCfg(); render(); break;
    case "r-add": (function(){ var nr = { id:uid(), day:null, name:"New workout", focus:"", exercises:[{ name:"", sets:3, reps:"8-12", rest:150 }] }; rs.push(nr); S.openRoutine = nr.id; saveCfg(); render(); })(); break;
    case "r-add-ex": rs[ri].exercises.push({ name:"", sets:3, reps:"8-12", rest:150 }); S.openRoutine = rs[ri].id; saveCfg(); render(); break;
    case "r-del-ex": rs[ri].exercises.splice(+b.dataset.x, 1); S.openRoutine = rs[ri].id; saveCfg(); render(); break;
    case "r-del": ask("Delete " + (rs[ri].name || "this workout") + "?", "Past sessions stay in your history.", "Delete workout", function(){ rs.splice(ri, 1); saveCfg(); render(); }); break;
    case "backup": bkSheet(); break;
    case "backup-go": (function(){ if(!BK) return;
        try{ var f = new File([BK.data], BK.name, { type:"application/json" });
          if(navigator.canShare && navigator.canShare({ files:[f] })){ navigator.share({ files:[f], title:"Wake backup" }).then(bkDone).catch(function(){}); return; } }catch(e){}
        try{ var u = URL.createObjectURL(new Blob([BK.data], { type:"application/json" })), l = document.createElement("a"); l.href = u; l.download = BK.name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){ URL.revokeObjectURL(u); }, 4000); bkDone(); }catch(e){ toast("Could not save a backup on this device"); }
      })(); break;
    case "enter": enter(); break;
    case "sheet-close": closeSheet(); break;
    case "confirm-yes": (function(){ var fn = confirmFn; closeSheet(); if(fn) fn(); })(); break;
  }
});
document.addEventListener("input", function(ev){
  var t = ev.target, d = t.dataset, a = S.active;
  if(t.id === "pl-bar"){ plateShow(); return; }
  if((t.id === "in-w" || t.id === "in-r") && a && a.openEx != null){ var x = a.exercises[a.openEx], ci = curIdx(x); if(ci < 0) return; x.sets[ci][d.k] = t.value.trim(); if(d.k === "w") delete x.sets[ci].pl; saveActive(); return; }
  if(t.id === "note-t" && a){ a.exercises[+d.e].sets[+d.s].note = t.value; saveActive(); return; }
  if(d.note !== undefined){ if(t.value.trim()) S.cfg.notes[d.note] = t.value; else delete S.cfg.notes[d.note]; saveCfg(); return; }
  if(t.id === "wk-goal"){ var wg = parseInt(t.value, 10); if(wg > 0){ S.cfg.weeklyGoal = Math.min(14, wg); saveCfg(); } return; }
  if(d.r !== undefined){ var r = S.cfg.routines[+d.r]; if(!r) return;
    if(d.x !== undefined){ var ex = r.exercises[+d.x]; ex[d.k] = d.k === "link" ? t.checked : d.k === "rest" ? (parseInt(t.value, 10) || 150) : t.value; }
    else r[d.k] = t.value;
    saveCfg(); }
});
document.addEventListener("focusin", function(ev){ var t = ev.target; if((t.id === "in-w" && !t.readOnly) || t.id === "in-r") setTimeout(function(){ try{ t.select(); }catch(e){} }, 0); });
document.addEventListener("focusout", function(ev){ if(ev.target.id === "in-w") ev.target.readOnly = true; });
document.addEventListener("change", function(ev){ var t = ev.target;
  if(t.id === "ph-file" && t.files && t.files[0]){ addPhoto(t.files[0]); t.value = ""; } });
document.addEventListener("toggle", function(ev){ var d = ev.target; if(d.dataset && d.dataset.rid){ if(d.open) S.openRoutine = d.dataset.rid; else if(S.openRoutine === d.dataset.rid) S.openRoutine = null; } }, true);
document.addEventListener("keydown", function(ev){
  if(ev.key === "Escape" && !$("#sheet").hidden) closeSheet();
  if(ev.key === "Enter"){ var t = ev.target; if(t.id === "w-in"){ var wb = document.querySelector('[data-act="w-use"]'); if(wb) wb.click(); } else if(t.id === "new-ex"){ var b = document.querySelector('[data-act="add-ex"]'); if(b) b.click(); } else if(t.id === "in-w" || t.id === "in-r") t.blur(); } });
window.addEventListener("hashchange", function(){ render(); });

/* ---------- installed app: offline copy, quiet updates ---------- */
try{ if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js", { updateViaCache:"none" }).then(function(reg){
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) try{ reg.update(); }catch(e){} }); }); }catch(e){}
(function(){ var away = 0;
  document.addEventListener("visibilitychange", function(){
    if(document.hidden){ away = Date.now(); return; }
    render();
    if(!away || Date.now() - away < 20000 || location.protocol !== "https:") return;
    fetch("index.html?b=" + Date.now(), { cache:"no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(t){
      var m = t.match(/var BUILD = "(\d+)"/); if(!m || m[1] === BUILD) return;
      var busy = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if(!busy && $("#sheet").hidden && $("#end").hidden && !(S.active && !S.pick)) location.reload(); }).catch(function(){}); });
})();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

/* ---------- boot: always the list first, nothing picked for you ---------- */
if(migrated){ migrated = false; saveCfg(); }
if(dropStale() || trimActive()) saveActive();
S.pick = true; if(S.active) S.active.openEx = null;
if(!/^#(today|history|progress|body)$/.test(location.hash)) history.replaceState(null, "", "#today");
render();
if(viewName() === "today") hero();
connect(); loadPhotos();
setInterval(tick, 250);
})();
</script>
</body>
